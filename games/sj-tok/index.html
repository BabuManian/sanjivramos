<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kushtok</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#faa41a;--accent-rgb:250,164,26;--on-accent:#1b1a19;--font:"Fira Sans",Ubuntu,"Noto Sans","Segoe UI",-apple-system,Roboto,sans-serif;
  --bg:#0d0d10;--panel:#17171c;--panel2:#202027;--line:rgba(255,255,255,.08);--text:#f4f4f6;--text2:rgba(244,244,246,.62);--text3:rgba(244,244,246,.35);--hover:rgba(255,255,255,.07);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block;flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
img{display:block}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--text3);border-radius:8px}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
/* ---- side ---- */
#side{display:flex;flex-direction:column;gap:2px;padding:14px 12px;border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .lg{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#e11d48));box-shadow:0 5px 16px rgba(var(--accent-rgb),.45)}
.brand .lg svg{width:18px;height:18px;color:var(--on-accent);fill:currentColor;stroke:none}
.brand small{display:block;font-size:10.5px;font-weight:500;color:var(--text2)}
.sbox{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;margin:0 0 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.2)}
.sbox svg{width:16px;height:16px;color:var(--text2)}
.sbox input{flex:1;min-width:0;border:none;outline:none;background:none}
.ni{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;font-weight:600;font-size:15px;text-align:left;position:relative}
.ni:hover{background:var(--hover)}
.ni.on{color:var(--accent);background:rgba(var(--accent-rgb),.12)}
.ni-s{display:none}
.ni.on:before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--accent)}
.sp{flex:1}
.mecard{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);text-align:left;width:100%}
.mecard img,.mecard .av0{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--hover);flex:none}
.mecard .tx{flex:1;min-width:0}.mecard b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mecard small{color:var(--text2);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:0 6px 18px rgba(var(--accent-rgb),.35)}
.btn:hover{filter:brightness(1.08)}.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.wide{width:100%}
/* ---- main ---- */
#main{position:relative;min-width:0;overflow:hidden}
#view{position:absolute;inset:0}
.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;contain:layout paint;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;gap:16px;padding:16px;position:relative}
.frame{position:relative;height:100%;aspect-ratio:9/16;max-width:calc(100% - 80px);border-radius:18px;overflow:hidden;background:#000 center/cover no-repeat;box-shadow:0 10px 30px rgba(0,0,0,.4);contain:layout paint}
.frame .bgc{display:none}
.frame video,.frame .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
.frame .ph{display:flex;transition:transform .4s ease}
.frame .ph img{width:100%;height:100%;object-fit:contain;flex:none}
.frame .dots{position:absolute;top:12px;left:0;right:0;display:flex;gap:4px;justify-content:center;z-index:3}
.frame .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}.frame .dots i.on{background:#fff}
.cap{position:absolute;left:0;right:0;bottom:0;padding:60px 16px 18px;background:linear-gradient(transparent,rgba(0,0,0,.72));z-index:3;pointer-events:none}
.cap a{pointer-events:auto;cursor:pointer;font-weight:700;font-size:15px}
.cap a:hover{text-decoration:underline}
.cap .ds{margin-top:6px;font-size:13.5px;line-height:1.4;max-height:4.2em;overflow:hidden;pointer-events:auto;cursor:pointer}
.cap .ds.open{max-height:none}
.cap .ds b{color:#fff;font-weight:700}
.cap .mu{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden}
.cap .mu svg{width:14px;height:14px}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);z-index:4;cursor:pointer}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.prog:hover{height:6px}
.center-ic{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.center-ic span{width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.center-ic span svg{width:32px;height:32px;fill:#fff;stroke:none}
.slide.paused .center-ic span{opacity:1}
.spin{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite;z-index:2;display:none}
.slide.wait .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.burst{position:absolute;z-index:5;pointer-events:none;color:#ff3b5c;animation:burst .8s ease forwards}
.burst svg{width:90px;height:90px;fill:currentColor;stroke:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3) rotate(-15deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(-8deg);opacity:1}100%{transform:translate(-50%,-90%) scale(1) rotate(0);opacity:0}}
.acts{display:flex;flex-direction:column;align-items:center;gap:14px;flex:none;align-self:flex-end;padding-bottom:12px}
.av{position:relative;width:50px;height:50px;margin-bottom:8px;cursor:pointer}
.av img,.av .av0{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:var(--panel2)}
.av .fol{position:absolute;left:50%;bottom:-9px;margin-left:-11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.av .fol svg{width:13px;height:13px;stroke-width:3}
.ab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text)}
.ab span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);transition:transform .12s,background .15s}
.ab:hover span{background:#2c2c35}.ab:active span{transform:scale(.88)}
.ab svg{width:24px;height:24px}
.ab.on svg{fill:#ff3b5c;stroke:#ff3b5c}.ab.sv.on svg{fill:var(--accent);stroke:var(--accent)}
.topbar{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:center;gap:22px;padding:14px;pointer-events:none}
.topbar button{pointer-events:auto;font-weight:700;font-size:16px;color:rgba(255,255,255,.6);text-shadow:0 1px 6px rgba(0,0,0,.5);padding-bottom:4px;border-bottom:2px solid transparent}
.topbar button.on{color:#fff;border-bottom-color:#fff}
.sound{position:absolute;top:14px;right:16px;z-index:6;display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);font-weight:600;font-size:13px}
.chip svg{width:16px;height:16px}
.navarrows{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:6}
.navarrows button{width:44px;height:44px;border-radius:50%;background:var(--panel2);display:grid;place-items:center}
.navarrows button:hover{background:#2c2c35}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;color:var(--text2)}
.msg svg{width:52px;height:52px;color:var(--text3)}
.msg h3{margin:0;color:var(--text);font-size:20px}
.msg p{margin:0;max-width:420px}
/* ---- pages (grid, search, me) ---- */
.page{position:absolute;inset:0;overflow-y:auto;padding:26px 30px 40px}
.page h1{margin:0 0 18px;font-size:28px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gi{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--panel2) center/cover;cursor:pointer;transition:transform .15s}
.gi:hover{transform:translateY(-2px)}
.gi .pc{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.gi .pc svg{width:14px;height:14px}
.gi .tp{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:7px;background:rgba(0,0,0,.5);display:grid;place-items:center}.gi .tp svg{width:14px;height:14px}
.gi:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.gi .pc,.gi .tp{z-index:1}
.ph-head{display:flex;gap:24px;align-items:center;margin-bottom:24px;padding:22px;border-radius:22px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.18),transparent 70%),var(--panel);border:1px solid var(--line)}
.ph-head img,.ph-head .av0{width:116px;height:116px;border-radius:50%;object-fit:cover;background:var(--panel2);flex:none}
.ph-head h2{margin:0;font-size:24px;display:flex;align-items:center;gap:6px}
.ph-head .nm{color:var(--text2);margin:2px 0 10px}
.ph-head .st{display:flex;gap:18px;font-size:13.5px;color:var(--text2)}.ph-head .st b{color:var(--text);font-size:16px;margin-right:4px}
.ph-head .sig{margin:10px 0 14px;white-space:pre-line;font-size:13.5px}
.vf svg{width:18px;height:18px;fill:#20d5ec;stroke:#0d0d10;stroke-width:1.5}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:26px}
.ur{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left}
.ur:hover{background:var(--panel2)}
.ur img,.ur .av0{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--panel2);flex:none}
.ur .tx{min-width:0}.ur b{display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden}.ur small{color:var(--text2);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh{font-size:17px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.sh:before{content:"";width:4px;height:17px;border-radius:3px;background:var(--accent)}
.note{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:14px;background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.3);margin:0 0 20px}
.note svg{color:var(--accent);width:24px;height:24px}
.av0{display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),#7c3aed)!important}
.more-sp{height:60px;display:grid;place-items:center;color:var(--text3)}
/* ---- comments ---- */
#cm{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);z-index:20;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.3,.8,.2,1)}
#cm.open{transform:none;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
#cm header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
#cm .ls{flex:1;overflow:auto;padding:8px 14px 30px}
.cr{display:flex;gap:10px;padding:10px 0}
.cr img,.cr .av0{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel2)}
.cr .tx{flex:1;min-width:0}.cr .n{font-size:12.5px;color:var(--text2);font-weight:600}.cr .t{margin:3px 0;word-wrap:break-word}.cr .m{font-size:12px;color:var(--text3)}
.cr .lk{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--text2)}.cr .lk svg{width:16px;height:16px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}.ib:hover{background:var(--hover)}
/* ---- sign in ---- */
.dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:grid;place-items:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.dlg .box{width:min(460px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;border-radius:22px;background:var(--panel);border:1px solid var(--line);padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative}
.dlg h3{margin:0 0 4px;font-size:21px}
.dlg .sub{margin:0 0 16px;color:var(--text2);font-size:13px}
.dlg .x{position:absolute;right:12px;top:12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel2);margin-bottom:16px}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.qr{width:240px;height:240px;margin:0 auto 14px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden}
.qr img{width:100%;height:100%;object-fit:contain}
.qr .spin{display:block;position:static;margin:0;border-color:rgba(0,0,0,.15);border-top-color:#000}
.steps{margin:0;padding-left:20px;color:var(--text2);font-size:13px;line-height:1.7}
.live{position:relative;width:100%;max-width:330px;aspect-ratio:420/760;margin:0 auto 10px;border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;touch-action:none}
.live img{width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.live .spin{border-color:rgba(0,0,0,.15);border-top-color:#000;display:block}
.live img+.spin{display:none}
.lrow{display:flex;gap:6px;max-width:330px;margin:0 auto}
.lrow input{flex:1;min-width:0;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;outline:none}
.lrow input:focus{border-color:var(--accent)}
.lrow .btn{height:38px;padding:0 12px}
.fine{font-size:11.5px;color:var(--text3);text-align:center;margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:60;padding:11px 18px;border-radius:14px;background:#26262e;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:500;opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:10px;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{color:var(--accent);width:18px;height:18px}
#tabs{display:none}
@media (max-width:1100px) and (min-width:641px){
  #app{grid-template-columns:68px minmax(0,1fr)}
  #side{padding:12px 8px;align-items:center}
  .brand{padding:2px 0 12px}.brand div{display:none}
  #side .sbox{display:none}
  .ni{width:48px;justify-content:center;padding:0}.ni span{display:none}.ni-s{display:flex}
  .ni.on:before{left:-8px}
  .mecard{padding:4px;border:none;background:none;justify-content:center}.mecard .tx{display:none}
  #sideSign{width:48px;height:48px;padding:0;border-radius:14px}#sideSign span{display:none}
  .frame{max-width:calc(100% - 74px)}
  .navarrows{right:10px}
}
@media (max-width:640px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  #side{display:none}
  #tabs{display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));background:#000;border-top:1px solid var(--line)}
  #tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--text2);width:64px}
  #tabs button.on{color:#fff}#tabs button svg{width:24px;height:24px}
  .slide{padding:0}
  .frame{max-width:none;width:100%;height:100%;aspect-ratio:auto;border-radius:0}
  .acts{position:absolute;right:8px;bottom:90px;z-index:5;padding:0}
  .ab span{background:transparent;width:44px;height:40px}.ab svg{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
  .ab{text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .cap{padding-right:76px}
  .navarrows{display:none}
  .sound{top:auto;bottom:16px;right:auto;left:12px}
  .sound .chip{height:30px;font-size:12px}
  .cap{padding-bottom:54px}
  .page{padding:18px 14px 30px}
  .grid{grid-template-columns:repeat(3,1fr);gap:3px}.gi{border-radius:4px}
  .ph-head{flex-direction:column;text-align:center}.ph-head .st{justify-content:center}
}
</style></head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><span class="lg"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg></span><div>Kushtok<small>TikTok, fast</small></div></div>
    <label class="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="q" placeholder="Search or @name" autocomplete="off" spellcheck="false"></label>
    <nav id="nav"></nav>
    <div class="sp"></div>
    <div id="mebox"></div>
  </aside>
  <main id="main"><div id="view"></div>
    <aside id="cm"><header><span id="cmT">Comments</span><button class="ib" id="cmX" title="Close (C)"></button></header><div class="ls" id="cmL"></div></aside>
  </main>
  <nav id="tabs"></nav>
</div>
<div id="toast"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => n >= 1e9 ? (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n || 0);
const ago = t => { const s = Date.now() / 1000 - t; return s < 3600 ? Math.max(1, Math.round(s / 60)) + 'm' : s < 86400 ? Math.round(s / 3600) + 'h' : s < 86400 * 30 ? Math.round(s / 86400) + 'd' : new Date(t * 1000).toLocaleDateString(); };
const P = {
  home: '<path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9v5.5H5.5A1.5 1.5 0 0 1 4 19z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 19.5a6.5 6.5 0 0 1 13 0M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14a6.5 6.5 0 0 1 3 5.5"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
  bookmark: '<path d="M6.5 4h11a1 1 0 0 1 1 1v15l-6.5-4-6.5 4V5a1 1 0 0 1 1-1z"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',

  const fo = t.closest('[data-follow]'); if (fo) return follow(F.L.items[+fo.dataset.follow], fo);
  const ds = t.closest('.ds'); if (ds) { ds.classList.toggle('open'); return; }
  const pr = t.closest('.prog'); if (pr) { const m = playing().querySelector('video'); if (m && m.duration) { const r = pr.getBoundingClientRect(); m.currentTime = (e.clientX - r.left) / r.width * m.duration; } return; }
  if (t.closest('.frame')) { clearTimeout(clickT); clickT = setTimeout(() => { if (D.muted === false) { const m = playing() && playing().querySelector('video,audio'); if (m && m.muted) { m.muted = false; $('#mute').innerHTML = I('vol'); return; } } togglePlay(); }, 230); }
}
function onDbl(e) {
  const fr = e.target.closest('.frame'); if (!fr || e.target.closest('.cap a,.prog')) return;
  clearTimeout(clickT);
  const r = fr.getBoundingClientRect(), b = document.createElement('div'); b.className = 'burst'; b.style.left = (e.clientX - r.left) + 'px'; b.style.top = (e.clientY - r.top) + 'px'; b.innerHTML = I('heart'); fr.appendChild(b); setTimeout(() => b.remove(), 850);
  const v = cur(); if (v && !v.liked) like(v, F.el.querySelector(`[data-like="${F.idx}"]`));
}

/* ---------- actions ---------- */
async function like(v, btn) {
  if (!ME) { if (!isSaved(v)) toggleSave(v, F && F.el.querySelector(`[data-save="${F.L.items.indexOf(v)}"]`)); toast('Saved here. Sign in to like on TikTok', 'bookmark'); return; }
  if (v._liking) return; v._liking = true;
  const on = !v.liked; v.liked = on; v.stats.likes += on ? 1 : -1;
  if (btn) { btn.classList.toggle('on', on); btn.lastChild.textContent = num(v.stats.likes); }
  try { await api('like', { id: v.id, on, author: v.author.id }); } catch (e) { v.liked = !on; v.stats.likes += on ? -1 : 1; if (btn) { btn.classList.toggle('on', !on); btn.lastChild.textContent = num(v.stats.likes); } likeFailed(v, e.message); }
  v._liking = false;
}
function likeFailed(v, why) {
  const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="box"><h3>TikTok didn’t accept that like</h3><p class="sub">${esc(why)}. TikTok often refuses likes from apps outside its own website. You can like it on tiktok.com instead (sign in there once).</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="lfX">Close</button><button class="btn" id="lfO">${I('link')}Open on TikTok</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#lfX').onclick = () => d.remove(); d.onclick = e => { if (e.target === d) d.remove(); };
  d.querySelector('#lfO').onclick = () => { window.open(`https://www.tiktok.com/@${v.author.id}/video/${v.id}`, '_blank', 'noopener'); d.remove(); };
}
function toggleSave(v, btn) {
  const on = !isSaved(v);
  D.saved = on ? [slim(v), ...D.saved] : D.saved.filter(x => x.id !== v.id); save();
  if (btn) { btn.classList.toggle('on', on); btn.lastChild.textContent = num(v.stats.saves + (on ? 1 : 0)); }
  toast(on ? 'Saved' : 'Removed from Saved', 'bookmark');
}
async function follow(v, btn) {
  btn.innerHTML = I('check');
  try { await api('follow', { id: v.id, author: v.author.id, on: true }); v.following = true; toast('Following @' + v.author.id, 'users'); setTimeout(() => btn.remove(), 600); }
  catch (e) { btn.innerHTML = I('plus'); toast(e.message, 'x'); }
}
function openUser(id) { if (id) go({ v: 'grid', kind: 'user', q: id }); }

/* ---------- comments ---------- */
let cmFor = null;
$('#cmX').innerHTML = I('x'); $('#cmX').onclick = () => closeComments();
function closeComments() { $('#cm').classList.remove('open'); cmFor = null; }
async function openComments(v) {
  if (!v) return; const box = $('#cm'), ls = $('#cmL');
  box.classList.add('open'); if (cmFor === v.id) return; cmFor = v.id;
  $('#cmT').textContent = `${num(v.stats.comments)} comments`;
  ls.innerHTML = '<div class="more-sp"><div class="spin" style="display:block;position:static"></div></div>';
  let cursor = 0, more = true, busy = false;
  const page = async () => {
    if (busy || !more) return; busy = true;
    try {
      const j = await api(`comments?id=${encodeURIComponent(v.id)}&cursor=${cursor}`); if (cmFor !== v.id) return;
      if (!cursor) ls.innerHTML = '';
      ls.insertAdjacentHTML('beforeend', j.items.map(c => `<div class="cr">${avatar(c.user)}<div class="tx"><div class="n">${esc(c.user.name || c.user.id)}</div><div class="t">${esc(c.text)}</div><div class="m">${c.t ? ago(c.t) : ''}${c.replies ? ` · ${num(c.replies)} replies` : ''}</div></div><div class="lk">${I('heart')}${num(c.likes)}</div></div>`).join('') || (cursor ? '' : '<div class="msg" style="position:static">No comments yet</div>'));
      cursor = j.next; more = j.hasMore;
    } catch (e) { if (!cursor) ls.innerHTML = `<div class="msg" style="position:static"><p>${esc(e.message)}</p></div>`; more = false; }
    busy = false;
  };
  ls.onscroll = () => { if (ls.scrollTop + ls.clientHeight > ls.scrollHeight - 300) page(); };
  page();
}

/* ---------- grids: profiles, saved, watched ---------- */
const gridItem = (v, i) => `<div class="gi" data-gi="${i}" style="background-image:url('${esc(img(v.cover))}')">${v.photo ? `<span class="tp">${I('img')}</span>` : ''}<span class="pc">${I('play')}${num(v.stats.plays)}</span></div>`;
function gridView(r) {
  const v = $('#view');
  const L = r.kind === 'saved' ? { kind: 'saved', items: D.saved, hasMore: false } : r.kind === 'history' ? { kind: 'history', items: D.history, hasMore: false } : list(r.kind, r.q || '');
  const title = r.kind === 'saved' ? 'Saved' : r.kind === 'history' ? 'Watched' : '@' + r.q;
  const draw = () => {
    if (route !== r) return;
    const p = L.profile;
    const head = r.kind === 'user' ? (p ? `<div class="ph-head">${avatar(p)}<div><h2>${esc(p.id)} ${vf(p)}</h2><div class="nm">${esc(p.name)}</div><div class="st"><span><b>${num(p.following)}</b>Following</span><span><b>${num(p.followers)}</b>Followers</span><span><b>${num(Math.abs(p.likes))}</b>Likes</span></div>${p.sig ? `<div class="sig">${esc(p.sig)}</div>` : '<div style="height:14px"></div>'}<div style="display:flex;gap:8px;flex-wrap:wrap">${L.items.length ? `<button class="btn" id="gPlay">${I('play')}Play all</button>` : ''}<button class="btn ghost" id="gLink">${I('link')}Copy link</button></div></div></div>` : `<h1>${esc(title)}</h1>`) : `<h1>${esc(title)}</h1>`;
    const body = L.items.length ? `<div class="grid">${L.items.map(gridItem).join('')}</div>${L.hasMore ? '<div class="more-sp" id="gMore"><div class="spin" style="display:block;position:static"></div></div>' : ''}`
      : L.busy || (L.hasMore && r.kind === 'user') ? '<div class="more-sp"><div class="spin" style="display:block;position:static"></div></div>'
      : r.kind === 'user' && ME && r.q.toLowerCase() === (ME.id || '').toLowerCase() ? `<div class="msg" style="position:static;padding:50px">${I('user')}<h3>TikTok won’t share your own videos with Kushtok</h3><p>Your videos (including private ones) only open on TikTok’s own website or app.</p><button class="btn" onclick="window.open('https://www.tiktok.com/@${esc(r.q)}', '_blank', 'noopener')">${I('link')}Open my profile on TikTok</button></div>`
      : `<div class="msg" style="position:static;padding:50px">${I(r.kind === 'saved' ? 'bookmark' : r.kind === 'history' ? 'clock' : 'user')}<h3>${L.err ? 'Couldn’t load this' : p && p.private ? 'This account is private' : 'Nothing here yet'}</h3><p>${esc(L.err || (r.kind === 'saved' ? 'Tap the bookmark on any video to save it here.' : r.kind === 'history' ? 'Videos you watch show up here.' : ''))}</p></div>`;
    v.innerHTML = `<div class="page" id="pg">${back.length ? `<button class="btn ghost" id="pBack" style="height:34px;margin-bottom:14px">${I('left')}Back</button>` : ''}${head}${body}</div>`;
    const pb = $('#pBack'); if (pb) pb.onclick = () => { const x = back.pop(); if (x) go(x, false); };
    const gp = $('#gPlay'); if (gp) gp.onclick = () => go({ v: 'feed', kind: r.kind, q: r.q, list: L, from: 1, title, start: 0 });
    const gl = $('#gLink'); if (gl) gl.onclick = () => navigator.clipboard.writeText('https://www.tiktok.com/@' + r.q).then(() => toast('Link copied', 'link'));
    $('#pg').onclick = e => { const g = e.target.closest('[data-gi]'); if (g) go({ v: 'feed', kind: r.kind, q: r.q, list: L, from: 1, title, start: +g.dataset.gi }); };
    const pg = $('#pg'); pg.onscroll = () => { if (L.hasMore && !L.busy && pg.scrollTop + pg.clientHeight > pg.scrollHeight - 500) { const y = pg.scrollTop; loadMore(L).then(() => { draw(); $('#pg').scrollTop = y; }); } };
  };
  draw();
  if (L.hasMore && !L.items.length) loadMore(L).then(draw).catch(render);
}

/* ---------- search ---------- */
function searchView(r) {
  const v = $('#view'), q = (r.q || '').trim();
  const mobileBox = innerWidth <= 640 ? `<label class="sbox" style="margin-bottom:16px">${I('search')}<input id="q2" placeholder="Search or @name" value="${esc(q)}"></label>` : '';
  if (!q) { v.innerHTML = `<div class="page"><h1>Search</h1>${mobileBox}<div class="msg" style="position:static;padding:40px">${I('search')}<h3>Find videos and people</h3><p>Type words to search TikTok${ME ? '' : ' (needs sign-in)'}, or <b>@name</b> to open someone’s profile.</p></div></div>`; bindQ2(); return; }
  if (q.startsWith('@') || /^[\w.]{2,24}$/.test(q) && !ME) { go({ v: 'grid', kind: 'user', q: q.replace(/^@/, '') }, false); return; }
  const V = list('search', q), U = list('users', q);
  const draw = () => {
    if (route !== r) return;
    let h = `<div class="page" id="pg"><h1>“${esc(q)}”</h1>${mobileBox}`;
    if (V.signin || U.signin) h += `<div class="note">${I('key')}<div style="flex:1">${esc(V.note || U.note || 'Sign in to search.')}</div><button class="btn" data-signin>Sign in</button></div><button class="ur" style="max-width:360px" data-open="${esc(q.replace(/\s+/g, ''))}">${avatar({ name: q })}<div class="tx"><b>@${esc(q.replace(/\s+/g, ''))}</b><small>Open this profile</small></div></button>`;
    const people = U.users.length ? U.users : [...new Map(V.items.map(x => [x.author.id, x.author])).values()].filter(a => a.id).slice(0, 8);
    if (people.length) h += `<div class="sh">People</div><div class="users">${people.slice(0, 8).map(u => `<button class="ur" data-open="${esc(u.id)}">${avatar(u)}<div class="tx"><b>${esc(u.id)} ${vf(u)}</b><small>${esc(u.name || '')}${u.followers ? ' · ' + num(u.followers) + ' followers' : ''}</small></div></button>`).join('')}</div>`;
    if (false) h += `<div class="sh">People</div><div class="users">${U.users.slice(0, 8).map(u => `<button class="ur" data-open="${esc(u.id)}">${avatar(u)}<div class="tx"><b>${esc(u.id)} ${vf(u)}</b><small>${esc(u.name)} · ${num(u.followers)} followers</small></div></button>`).join('')}</div>`;
    if (V.items.length) h += `<div class="sh">Videos</div><div class="grid">${V.items.map(gridItem).join('')}</div>${V.hasMore ? '<div class="more-sp"><div class="spin" style="display:block;position:static"></div></div>' : ''}`;
    else if (V.busy || U.busy) h += '<div class="more-sp"><div class="spin" style="display:block;position:static"></div></div>';
    else if (!V.signin) h += `<div class="msg" style="position:static;padding:40px">${I('search')}<h3>${V.err ? 'Search didn’t work' : 'No results'}</h3><p>${esc(V.err || 'Try other words.')}</p></div>`;
    v.innerHTML = h + '</div>'; bindQ2();
    $('#pg').onclick = e => { const o = e.target.closest('[data-open]'); if (o) return openUser(o.dataset.open); const g = e.target.closest('[data-gi]'); if (g) go({ v: 'feed', kind: 'search', q, list: V, from: 1, title: '“' + q + '”', start: +g.dataset.gi }); };
    const pg = $('#pg'); pg.onscroll = () => { if (V.hasMore && !V.busy && pg.scrollTop + pg.clientHeight > pg.scrollHeight - 500) { const y = pg.scrollTop; loadMore(V).then(() => { draw(); $('#pg').scrollTop = y; }); } };
  };
  if (!V.items.length && V.hasMore) loadMore(V).then(draw).catch(render);
  if (!U.users.length && U.hasMore) loadMore(U).then(draw).catch(() => {});
  draw();
}
function bindQ2() { const q2 = $('#q2'); if (q2) q2.onkeydown = e => { if (e.key === 'Enter' && q2.value.trim()) go({ v: 'search', q: q2.value.trim() }); }; }
$('#q').onkeydown = e => { if (e.key === 'Enter') { const s = $('#q').value.trim(); if (s) go({ v: 'search', q: s }); } };

/* ---------- me + sign in ---------- */
function meView() {
  const v = $('#view');
  if (!ME) { v.innerHTML = `<div class="page"><h1>Profile</h1><div class="msg" style="position:static;padding:40px">${I('user')}<h3>Sign in to TikTok</h3><p>See your For You page, the people you follow, and like, comment-read and follow from Kushtok. Saved and Watched work without signing in.</p><button class="btn" data-signin>${I('key')}Sign in</button></div></div>`; return; }
  v.innerHTML = `<div class="page"><h1>Profile</h1><div class="ph-head">${avatar(ME)}<div><h2>${ME.id ? '@' + esc(ME.id) : 'Signed in'}</h2><div class="nm">Signed in to TikTok</div><div style="display:flex;gap:8px;flex-wrap:wrap">${ME.id ? `<button class="btn" id="myP">${I('user')}My videos</button>` : ''}<button class="btn ghost" id="sOut">${I('out')}Sign out</button></div></div></div><p style="color:var(--text2)">You’re signed in on this SanjivramOS machine’s own browser. Your password was never seen by Kushtok.</p></div>`;
  const mp = $('#myP'); if (mp) mp.onclick = () => openUser(ME.id);
  $('#sOut').onclick = async () => { if (!confirm('Sign out of TikTok on this machine?')) return; await api('signout', {}).catch(() => {}); ME = null; lists.clear(); renderNav(); toast('Signed out', 'out'); go({ v: 'feed', kind: 'foryou' }); };
}
function signIn() {
  const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="box"><button class="ib x" id="sX">${I('x')}</button><h3>Sign in to TikTok</h3><p class="sub">You sign in on TikTok’s own page, in a browser running on your SanjivramOS machine.</p><div class="seg"><button data-m="qr" class="on">${'QR code'}</button><button data-m="live">Other ways</button></div><div id="sBody"></div></div>`;
  document.body.appendChild(d);
  let mode = 'qr', timer = 0, alive = true;
  const close = () => { alive = false; clearTimeout(timer); d.remove(); api('login/cancel', {}).catch(() => {}); };
  const done = async j => { if (ME) toast('You’re already signed in', 'check'); alive = false; clearTimeout(timer); d.remove(); ME = j.me || (await api('status?force=1')).me; lists.clear(); renderNav(); toast('Signed in' + (ME && ME.id ? ' as @' + ME.id : ''), 'check'); go({ v: 'feed', kind: 'foryou' }); };
  d.querySelector('#sX').onclick = close; d.onclick = e => { if (e.target === d) close(); };
  d.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; d.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); start(); });
  const body = d.querySelector('#sBody');
  async function qrLoop() {
    if (!alive || mode !== 'qr') return;
    try { const j = await api('login/qr', {}); if (!alive || mode !== 'qr') return; if (j.done) return done(j); const q = body.querySelector('.qr'); if (q && j.img) q.innerHTML = `<img src="${j.img}" alt="QR code">`; }
    catch (e) { const q = body.querySelector('.qr'); if (q) q.innerHTML = `<p style="color:#000;padding:16px;text-align:center;font-size:13px">${esc(e.message)}</p>`; if (e.block) return; }
    timer = setTimeout(qrLoop, 2500);
  }
  let busy = false;
  async function live(input) {
    if (!alive || mode !== 'live') return;
    if (busy && !input) return; busy = true;
    try { const j = await api('login/live', input || {}); if (!alive || mode !== 'live') return; if (j.done) return done(j); const box = body.querySelector('.live'); if (box && j.img) { let im = box.querySelector('img'); if (!im) { box.insertAdjacentHTML('afterbegin', '<img alt="">'); im = box.querySelector('img'); } im.src = j.img; } }
    catch (e) { toast(e.message, 'x'); }
    busy = false;
    clearTimeout(timer); timer = setTimeout(() => live(), 1500);
  }
  function start() {
    clearTimeout(timer);
    if (mode === 'qr') {
      body.innerHTML = `<div class="qr"><div style="display:grid;justify-items:center;gap:10px;color:#555;font-size:12.5px"><div class="spin"></div>Getting a code from TikTok…</div></div><ol class="steps"><li>Open the <b>TikTok</b> app on your phone</li><li>Tap the <b>scan</b> icon (in Search, or Profile → Add friends)</li><li>Point it at this code and confirm on your phone</li></ol><p class="fine">The code refreshes by itself. This window closes when you’re in.</p>`;
      qrLoop();
    } else {
      body.innerHTML = `<div class="live" id="lv"><div class="spin"></div></div><div class="lrow"><input id="lt" placeholder="Type here, then press Enter" autocomplete="off"><button class="btn ghost" id="lb" title="Back">${I('left')}</button><button class="btn ghost" id="lr" title="Start over">${I('refresh')}</button></div><p class="fine">This is TikTok’s real login page. Tap it to pick fields, type in the box above, and drag to solve puzzles. What you type goes straight to TikTok; Kushtok never saves it.</p>`;
      const lv = body.querySelector('#lv'), lt = body.querySelector('#lt');
      let down = null;
      const pos = e => { const r = lv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 420, y: (e.clientY - r.top) / r.height * 760 }; };
      lv.onpointerdown = e => { down = pos(e); lv.setPointerCapture(e.pointerId); };
      lv.onpointerup = e => { if (!down) return; const p = pos(e), d0 = down; down = null; if (Math.hypot(p.x - d0.x, p.y - d0.y) > 8) live({ t: 'drag', x1: d0.x, y1: d0.y, x2: p.x, y2: p.y }); else { live({ t: 'click', x: p.x, y: p.y }); setTimeout(() => lt.focus(), 50); } };
      lv.onwheel = e => { e.preventDefault(); live({ t: 'scroll', dy: e.deltaY }); };
      lt.onkeydown = async e => {
        if (e.key === 'Enter') { e.preventDefault(); const t = lt.value; lt.value = ''; if (t) await live({ t: 'text', text: t }); live({ t: 'key', key: 'Enter' }); }
        else if (e.key === 'Tab') { e.preventDefault(); const t = lt.value; lt.value = ''; if (t) await live({ t: 'text', text: t }); live({ t: 'key', key: 'Tab' }); }
        else if (e.key === 'Backspace' && !lt.value) { e.preventDefault(); live({ t: 'key', key: 'Backspace' }); }
      };
      lt.onblur = () => { const t = lt.value; if (t) { lt.value = ''; live({ t: 'text', text: t }); } };
      body.querySelector('#lb').onclick = () => live({ t: 'back' }); body.querySelector('#lr').onclick = () => live({ t: 'home' });
      live();
    }
  }
  start();
}

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (document.querySelector('.dlg')) return;
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); step(-1); }
  else if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'm') setMuted(!D.muted);
  else if (e.key === 'l') { const v = cur(); if (v) like(v, F.el.querySelector(`[data-like="${F.idx}"]`)); }
  else if (e.key === 's') { const v = cur(); if (v) toggleSave(v, F.el.querySelector(`[data-save="${F.idx}"]`)); }
  else if (e.key === 'c') { const v = cur(); if ($('#cm').classList.contains('open')) closeComments(); else if (v) openComments(v); }
  else if (e.key === '/') { e.preventDefault(); if (innerWidth <= 640) go({ v: 'search' }); else $('#q').focus(); }
  else if (e.key === 'Escape') closeComments();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { const s = playing(); const m = s && s.querySelector('video,audio'); if (m && !m.paused) { m.pause(); s.classList.add('paused'); } } });

/* ---------- start ---------- */
renderNav(); render();
api('status').then(j => { ME = j.me; renderNav(); if (route.v === 'me') render(); }).catch(e => { if (e.block) render(); });
window.__tok = { get F() { return F; }, get ME() { return ME; }, lists, go, step, api, get route() { return route; } };
})();
</script>
</body></html>
