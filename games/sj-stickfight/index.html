<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stickman Fight</title>
<style>
html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font:14px system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,23,42,.92);padding:14px;box-sizing:border-box;overflow:auto}
.ov.on{display:flex}
h1{margin:0;font-size:40px;font-weight:900;letter-spacing:1px}
button{font:inherit;border:none;border-radius:8px;padding:8px 13px;cursor:pointer;background:#1e293b;color:#e2e8f0}
button.sel{outline:2px solid #f59e0b;background:#334155}
button.pri{background:#f59e0b;color:#1c1917;font-weight:800;padding:12px 30px;font-size:17px}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.chars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chars button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;min-width:84px}
.chars small{opacity:.7;font-size:11px}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
#touch button{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-weight:700;touch-action:none;padding:0}
</style></head><body>
<canvas id="cv" width="960" height="540" aria-label="Stickman Fight"></canvas>
<div id="touch">
  <button data-k="left" style="left:16px;bottom:70px">◀</button><button data-k="right" style="left:142px;bottom:70px">▶</button>
  <button data-k="up" style="left:79px;bottom:132px">▲</button><button data-k="down" style="left:79px;bottom:10px">🛡</button>
  <button data-k="punch" style="right:86px;bottom:16px">👊</button><button data-k="kick" style="right:16px;bottom:76px">🦶</button><button data-k="special" style="right:86px;bottom:136px">★</button>
</div>
<div class="ov on" id="menu">
  <h1>STICKMAN FIGHT</h1>
  <div class="row" id="modes"></div>
  <div><b id="p1l">Player 1</b></div><div class="chars" id="c1"></div>
  <div><b id="p2l">CPU</b></div><div class="chars" id="c2"></div>
  <div class="row" id="stages"></div>
  <div class="row" id="diffs"></div>
  <button class="pri" id="fight">FIGHT!</button>
  <div style="opacity:.65;font-size:12px;text-align:center;max-width:640px">P1: A/D move · W jump (twice for double jump) · S block · F or J punch · G or K kick · H or L special (needs ½ meter) · walk over weapons to grab them.<br>P2: ←/→ · ↑ jump · ↓ block · , punch · . kick · / special (or numpad 1 2 3).</div>
</div>
<div class="ov" id="end"><h1 id="endT">WINNER</h1><div id="endS"></div><div class="row"><button class="pri" id="rematch">Rematch</button><button id="toMenu">Menu</button></div></div>
<script src="../sj-gamekit/kit.js"></script>
<script>window.SJG && SJG.init("stickfight", { vs: false, remote: { canvas: '#cv', field: 'code', help: 'A/D move · W jump · S block · F punch · G kick · H special',

// ---------- input / menu ----------
addEventListener('keydown', e => { keys[e.code] = true; if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Slash'].includes(e.code)) e.preventDefault(); if (e.code === 'Escape' && state !== 'menu') { state = 'menu'; showMenu(); } });
