<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Palette</title>
<style>
html,body{margin:0;min-height:100%;background:#18181b;color:#fafafa;font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;box-sizing:border-box}
#row{display:flex;gap:0;width:min(94vw,640px);height:min(48vh,320px);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #0008}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:12px 4px;cursor:pointer;border:none;font:inherit;transition:flex .2s}
.sw:hover{flex:1.4}
.sw span{background:#0006;padding:3px 7px;border-radius:6px;font:600 13px ui-monospace,monospace;color:#fff}
.sw.lock::after{content:"🔒";font-size:14px;margin-bottom:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button{background:#3f3f46;color:#fff;border:none;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.primary{background:#8b5cf6;font-weight:700}
input[type=color]{width:44px;height:36px;border:none;background:none;padding:0;cursor:pointer}
#toast{min-height:20px;opacity:.85}
#hist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:640px}
#hist button{width:34px;height:34px;padding:0;border-radius:8px;border:2px solid #0000}
</style></head><body>
<div id="row"></div>
<div class="bar">
  <button class="primary" id="gen">Generate (Space)</button>
  <label>Base <input type="color" id="base" value="#8b5cf6"></label>
  <select id="mode" aria-label="Scheme">
    <option value="analog">Analogous</option><option value="comp">Complementary</option><option value="tri">Triadic</option><option value="mono">Monochrome</option><option value="rand">Random</option>
  </select>
</div>
<div id="toast">Click a colour to copy its hex code. Click 🔒 to keep it when you generate.</div>
<div id="hist" aria-label="Recent palettes"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const row = $('row');
  let cols = [], locked = [false, false, false, false, false], hist = [];
  try { hist = JSON.parse(localStorage.getItem('sj-colors-hist') || '[]'); } catch {}

  const hsl2hex = (h, s, l) => {
    h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(100, s)) / 100; l = Math.max(0, Math.min(100, l)) / 100;
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => Math.round((l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))) * 255);
    return '#' + [f(0), f(8), f(4)].map(x => x.toString(16).padStart(2, '0')).join('');
  };
  const hex2hsl = hex => {
    const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let h = 0, s = 0;
    if (mx !== mn) {
      const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
    }
    return [h, s * 100, l * 100];
  };
  const textOn = hex => { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return (r * .299 + g * .587 + b * .114) > 150 ? '#111' : '#fff'; };

  function generate() {
    const base = hex2hsl($('base').value), mode = $('mode').value, h = base[0];
    const pick = {
      analog: () => [-40, -20, 0, 20, 40].map((d, i) => hsl2hex(h + d, 55 + i * 4, 40 + i * 6 - 4)),
      comp: () => [0, 0, 180, 180, 0].map((d, i) => hsl2hex(h + d, 60, 30 + i * 12)),
      tri: () => [0, 120, 240, 0, 120].map((d, i) => hsl2hex(h + d, 55, 35 + i * 8)),
      mono: () => [14, 30, 50, 70, 88].map(l => hsl2hex(h, base[1], l)),
      rand: () => Array.from({ length: 5 }, () => hsl2hex(Math.random() * 360, 45 + Math.random() * 45, 25 + Math.random() * 55))
    }[mode]();
    cols = cols.map((c, i) => locked[i] ? c : pick[i]);
    if (!cols.length) cols = pick;
    paint(); remember();
  }
  function paint() {
    row.innerHTML = cols.map((c, i) => `<button class="sw${locked[i] ? ' lock' : ''}" data-i="${i}" style="background:${c};color:${textOn(c)}" title="Copy ${c}"><span>${c.toUpperCase()}</span></button>`).join('');
  }
  function remember() {
    hist.unshift(cols.slice()); hist = hist.slice(0, 12);
    try { localStorage.setItem('sj-colors-hist', JSON.stringify(hist)); } catch {}
    $('hist').innerHTML = hist.map((p, j) => `<button data-h="${j}" title="${p.join(' ')}" style="background:linear-gradient(90deg,${p.join(',')})"></button>`).join('');
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch {} t.remove(); return ok;
    }
  }
  row.addEventListener('click', async e => {
    const b = e.target.closest('.sw'); if (!b) return;
    const i = +b.dataset.i;
    if (e.altKey || e.shiftKey) { locked[i] = !locked[i]; paint(); return; }
    const ok = await copy(cols[i]);
    $('toast').textContent = ok ? `Copied ${cols[i]}` : `Couldn’t copy. The code is ${cols[i]}`;
  });
  $('hist').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (!b) return; cols = hist[+b.dataset.h].slice(); paint(); });
  $('gen').addEventListener('click', generate);
  $('mode').addEventListener('change', generate);
  $('base').addEventListener('input', generate);
  addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); generate(); } });
  // Lock by long-press too (touch): a press held for 500 ms toggles the lock.
  let pt = null;
  row.addEventListener('pointerdown', e => { const b = e.target.closest('.sw'); if (!b) return; pt = setTimeout(() => { locked[+b.dataset.i] = !locked[+b.dataset.i]; paint(); pt = -1; }, 500); });
  row.addEventListener('pointerup', () => { if (pt && pt !== -1) clearTimeout(pt); pt = null; });
  row.addEventListener('pointerleave', () => { if (pt && pt !== -1) clearTimeout(pt); pt = null; });
  cols = hist[0] ? hist[0].slice() : [];
  if (!cols.length) generate(); else { paint(); remember(); }
})();
</script>
</body></html>
