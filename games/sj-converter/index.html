<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Converter</title>
<style>
html,body{margin:0;min-height:100%;background:#0c4a6e;color:#f0f9ff;font:15px system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px;box-sizing:border-box}
.card{background:#075985;border-radius:16px;padding:18px;width:min(92vw,440px);display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
select,input{font:inherit;padding:10px;border-radius:10px;border:1px solid #0ea5e9;background:#0c4a6e;color:#fff;width:100%;box-sizing:border-box}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.swap{background:#0284c7;border:none;color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
label{font-size:13px;opacity:.85;display:flex;flex-direction:column;gap:4px}
#tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(92vw,440px)}
#tabs button{background:#075985;color:#bae6fd;border:none;border-radius:20px;padding:7px 12px;font:inherit;cursor:pointer}
#tabs button.on{background:#38bdf8;color:#0c4a6e;font-weight:700}
#out{font-size:22px;font-weight:700;word-break:break-all;text-align:center;min-height:30px}
#note{font-size:12px;opacity:.7;text-align:center}
</style></head><body>
<div id="tabs"></div>
<div class="card">
  <div class="pair">
    <label>From<select id="fu"></select></label>
    <button class="swap" id="swap" title="Swap units" aria-label="Swap units">⇄</button>
    <label>To<select id="tu"></select></label>
  </div>
  <label>Value<input id="val" type="number" inputmode="decimal" value="1" step="any"></label>
  <div id="out"></div>
  <div id="note"></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  // Each category: units with their factor to the category's base unit (temperature is special-cased).
  const CATS = {
    Length: { base: 'm', u: { mm: 0.001, cm: 0.01, m: 1, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344, nmi: 1852 } },
    Mass: { base: 'kg', u: { mg: 1e-6, g: 0.001, kg: 1, t: 1000, oz: 0.028349523125, lb: 0.45359237, st: 6.35029318 } },
    Volume: { base: 'l', u: { ml: 0.001, l: 1, tsp: 0.00492892, tbsp: 0.01478676, 'fl oz': 0.0295735, cup: 0.236588, pt: 0.473176, qt: 0.946353, gal: 3.785411784 } },
    Speed: { base: 'm/s', u: { 'm/s': 1, 'km/h': 1 / 3.6, mph: 0.44704, knot: 0.514444, 'ft/s': 0.3048 } },
    Area: { base: 'm²', u: { 'm²': 1, 'km²': 1e6, 'ft²': 0.09290304, 'acre': 4046.8564224, 'ha': 10000, 'mi²': 2589988.110336 } },
    Time: { base: 's', u: { ms: 0.001, s: 1, min: 60, h: 3600, day: 86400, week: 604800, year: 31557600 } },
    Data: { base: 'B', u: { B: 1, KB: 1e3, MB: 1e6, GB: 1e9, TB: 1e12, KiB: 1024, MiB: 1048576, GiB: 1073741824 } },
    Temperature: { base: 'C', u: { '°C': 0, '°F': 0, K: 0 } }
  };
  const toBase = (cat, unit, v) => {
    if (cat === 'Temperature') return unit === '°F' ? (v - 32) * 5 / 9 : unit === 'K' ? v - 273.15 : v;
    return v * CATS[cat].u[unit];
  };
  const fromBase = (cat, unit, v) => {
    if (cat === 'Temperature') return unit === '°F' ? v * 9 / 5 + 32 : unit === 'K' ? v + 273.15 : v;
    return v / CATS[cat].u[unit];
  };
  const fmt = v => {
    if (!isFinite(v)) return '—';
    const a = Math.abs(v);
    if (a !== 0 && (a >= 1e12 || a < 1e-6)) return v.toExponential(6);
    return String(+v.toPrecision(10));
  };
  let cat = 'Length';
  const tabs = $('tabs');
  Object.keys(CATS).forEach(c => { const b = document.createElement('button'); b.textContent = c; b.dataset.c = c; tabs.appendChild(b); });
  function fillUnits(keepFrom, keepTo) {
    const units = Object.keys(CATS[cat].u);
    const fu = $('fu'), tu = $('tu');
    fu.innerHTML = units.map(u => `<option>${u}</option>`).join('');
    tu.innerHTML = units.map(u => `<option>${u}</option>`).join('');
    fu.value = units.includes(keepFrom) ? keepFrom : units[0];
    tu.value = units.includes(keepTo) ? keepTo : units[Math.min(1, units.length - 1)];
    [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.c === cat));
    convert();
  }
  function convert() {
    const v = parseFloat($('val').value);
    const from = $('fu').value, to = $('tu').value;
    if (isNaN(v)) { $('out').textContent = 'Enter a number'; $('note').textContent = ''; return; }
    const res = fromBase(cat, to, toBase(cat, from, v));
    $('out').textContent = `${fmt(v)} ${from} = ${fmt(res)} ${to}`;
    $('note').textContent = cat === 'Temperature' ? 'Temperature uses offsets, so °F and K are converted through °C.' : '';
    try { localStorage.setItem('sj-conv', JSON.stringify({ cat, from, to, v: $('val').value })); } catch {}
  }
  tabs.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; const f = $('fu').value, t = $('tu').value; cat = b.dataset.c; fillUnits(f, t); });
  $('fu').addEventListener('change', convert); $('tu').addEventListener('change', convert);
  $('val').addEventListener('input', convert);
  $('swap').addEventListener('click', () => { const f = $('fu').value; $('fu').value = $('tu').value; $('tu').value = f; convert(); });
  try {
    const s = JSON.parse(localStorage.getItem('sj-conv') || 'null');
    if (s && CATS[s.cat]) { cat = s.cat; if (s.v !== undefined) $('val').value = s.v; fillUnits(s.from, s.to); return; }
  } catch {}
  fillUnits();
})();
</script>
</body></html>
