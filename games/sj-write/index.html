<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Write</title>
<script src="../sj-officekit/kit.js"></script>
<style>
:root{--k-acc:#2b6cd8}
#app{display:flex;flex-direction:column;height:100%}
#home{flex:1;overflow:auto}
#ed{flex:1;display:none;flex-direction:column;min-height:0}
#ed.on{display:flex} #home.off{display:none}
.wscroll{flex:1;overflow:auto;padding:24px 12px 60px;background:var(--k-bg)}
.paper{margin:0 auto;background:#fff;color:#1b1b1b;box-shadow:0 1px 3px rgba(0,0,0,.2),0 6px 24px rgba(0,0,0,.08);width:816px;min-height:1056px;padding:96px;outline:none;font:11pt/1.5 Carlito,Calibri,"Segoe UI",Arial,sans-serif;word-wrap:break-word;transform-origin:top center}
.paper.a4{width:794px;min-height:1123px}
.paper:empty::before{content:'Start typing…';color:#999}
.paper h1{font-size:20pt;margin:.6em 0 .3em;color:#1f3864;font-weight:600}
.paper h2{font-size:15pt;margin:.6em 0 .3em;color:#2f5496;font-weight:600}
.paper h3{font-size:12.5pt;margin:.6em 0 .3em;color:#1f3864;font-weight:600}
.paper p{margin:0 0 .55em}
.paper blockquote{margin:.6em 0;padding:.2em 1em;border-left:3px solid #b4c6e7;color:#444;font-style:italic}
.paper pre{background:#f4f5f7;padding:8px 10px;border-radius:4px;font:10pt/1.4 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.paper table{border-collapse:collapse;width:100%;margin:.5em 0}
.paper td,.paper th{border:1px solid #9aa4b2;padding:4px 7px;vertical-align:top;min-width:30px}
.paper img{max-width:100%;height:auto;cursor:pointer}
.paper img.sel{outline:2px solid var(--k-acc)}
.paper a{color:#1d5fbf}
.paper hr{border:none;border-top:1px solid #aaa;margin:1em 0}
.paper hr.pb{border-top:2px dashed #b9c3d0;margin:2em -96px;position:relative;overflow:visible}
.paper hr.pb::after{content:'Page break';position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#fff;color:#8794a6;font:11px system-ui;padding:0 8px}
.paper ul,.paper ol{margin:0 0 .55em;padding-left:2em}
.paper .found{background:#ffe066}
.k-status b{font-weight:500}
.wfind{display:none;gap:6px;align-items:center;padding:6px 8px;background:var(--k-panel);border-bottom:1px solid var(--k-line);flex-wrap:wrap}
.wfind.on{display:flex}
.wfind input{font:inherit;padding:5px 8px;border:1px solid var(--k-line);border-radius:6px;background:var(--k-bg);color:var(--k-text);width:170px}
.imgbar{position:fixed;z-index:50;display:none;gap:2px;background:var(--k-panel);border:1px solid var(--k-line);border-radius:8px;padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.imgbar.on{display:flex}
.tpl-page{position:absolute;inset:0;padding:12% 12%;font:5px/1.5 sans-serif;text-align:left}
.tpl-page b{display:block;font-size:9px;margin-bottom:4px;color:#1f3864}
.tpl-page i{display:block;height:3px;background:#d5d9e0;margin:3px 0;border-radius:2px}
@media (max-width:700px){.wscroll{padding:10px 4px 40px}}
@media print{
  @page{margin:0}
  body{background:#fff}
  #home,.k-bar,.k-tools,.wfind,.imgbar{display:none!important}
  #ed,.wscroll{display:block!important;overflow:visible!important;padding:0!important;background:#fff!important}
  .paper{box-shadow:none!important;transform:none!important;zoom:1!important;width:auto!important;min-height:0!important;margin:0!important}
  .paper hr.pb{border:none;margin:0;break-after:page}.paper hr.pb::after{display:none}
  .paper .found{background:none}
}
</style></head>
<body><div id="app"><div id="home"></div><div id="ed">
  <div class="k-bar">
    <button class="k-mb" data-m="file">File</button><button class="k-mb" data-m="edit">Edit</button><button class="k-mb" data-m="insert">Insert</button><button class="k-mb" data-m="format">Format</button><button class="k-mb" data-m="view">View</button>
    <input class="k-title" id="title" spellcheck="false">
    <span class="k-status" id="status"></span>
  </div>
  <div class="k-tools" id="tools">
    <button class="k-tb" data-c="undo" title="Undo (Ctrl+Z)">↶</button><button class="k-tb" data-c="redo" title="Redo (Ctrl+Y)">↷</button><span class="k-vs"></span>
    <select id="block" title="Paragraph style"><option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option><option value="pre">Code</option></select>
    <select id="font" title="Font"><option value="">Default font</option><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option><option>Comic Sans MS</option></select>
    <select id="size" title="Font size"><option value="">Size</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option><option>48</option><option>72</option></select>
    <span class="k-vs"></span>
    <button class="k-tb" data-c="bold" title="Bold (Ctrl+B)"><b>B</b></button><button class="k-tb" data-c="italic" title="Italic (Ctrl+I)"><i>I</i></button><button class="k-tb" data-c="underline" title="Underline (Ctrl+U)"><u>U</u></button><button class="k-tb" data-c="strikeThrough" title="Strikethrough"><s>S</s></button>
    <button class="k-tb" data-c="superscript" title="Superscript">x²</button><button class="k-tb" data-c="subscript" title="Subscript">x₂</button>
    <span class="k-col k-tb" title="Text colour"><b>A</b><i id="fcI" style="background:#c00000"></i><input type="color" id="fc" value="#c00000"></span>
    <span class="k-col k-tb" title="Highlight"><span>🖍</span><i id="hcI" style="background:#ffff00"></i><input type="color" id="hc" value="#ffff00"></span>
    <span class="k-vs"></span>
    <button class="k-tb" data-c="insertUnorderedList" title="Bullets">•≡</button><button class="k-tb" data-c="insertOrderedList" title="Numbering">1≡</button>
    <button class="k-tb" data-c="outdent" title="Decrease indent">⇤</button><button class="k-tb" data-c="indent" title="Increase indent">⇥</button>
    <span class="k-vs"></span>
    <button class="k-tb" data-c="justifyLeft" title="Align left">⫷</button><button class="k-tb" data-c="justifyCenter" title="Centre">≡</button><button class="k-tb" data-c="justifyRight" title="Align right">⫸</button><button class="k-tb" data-c="justifyFull" title="Justify">☰</button>
    <span class="k-vs"></span>
    <button class="k-tb" data-x="link" title="Link (Ctrl+K)">🔗</button><button class="k-tb" data-x="image" title="Picture">🖼</button><button class="k-tb" data-x="table" title="Table">▦</button><button class="k-tb" data-c="removeFormat" title="Clear formatting">⌫</button>
  </div>
  <div class="wfind" id="find"><input id="fq" placeholder="Find"><input id="fr" placeholder="Replace with"><button class="k-btn" id="fn">Next</button><button class="k-btn" id="fra">Replace all</button><span id="fcnt" style="color:var(--k-sub);font-size:12px"></span><button class="k-tb" id="fx" title="Close">✕</button></div>
  <div class="wscroll" id="scroll"><div class="paper" id="paper" contenteditable="true" spellcheck="true"></div></div>
</div></div>
<div class="imgbar" id="imgbar"><button class="k-tb" data-w="25">25%</button><button class="k-tb" data-w="50">50%</button><button class="k-tb" data-w="75">75%</button><button class="k-tb" data-w="100">100%</button><span class="k-vs"></span><button class="k-tb" data-a="left">⫷</button><button class="k-tb" data-a="center">≡</button><button class="k-tb" data-a="right">⫸</button><button class="k-tb" data-a="del" title="Delete">🗑</button></div>
<script>
'use strict';
const { $, $$, h, esc, x } = Kit;
const lib = new Kit.Library('write');
const paper = $('#paper'), title = $('#title'), status = $('#status');
let doc = null, dirty = false, saveT = 0, zoomLvl = 'fit';

// ---------- templates ----------
const P = s => `<p>${s}</p>`;
const TEMPLATES = [
  { name: 'Blank document', html: '<p><br></p>' },
  { name: 'Letter', html: `<p style="text-align:right">Your Name<br>123 Street Name<br>City, Postcode<br>${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })}</p><p><br></p><p>Recipient Name<br>Company<br>Address</p><p><br></p><p>Dear Recipient,</p><p>Write the first paragraph of your letter here. Say why you are writing.</p><p>Add the details in the second paragraph.</p><p>Close with what you would like to happen next.</p><p><br></p><p>Yours sincerely,</p><p><br></p><p>Your Name</p>` },
  { name: 'Report', html: `<h1>Report title</h1><p style="color:#666">Prepared by Your Name · ${new Date().toLocaleDateString()}</p><h2>Summary</h2><p>One paragraph that tells the reader what this report found.</p><h2>Background</h2><p>Why this work was done.</p><h2>Findings</h2><ul><li>First finding</li><li>Second finding</li><li>Third finding</li></ul><h2>Next steps</h2><ol><li>Do this</li><li>Then this</li></ol>` },
  { name: 'Resume', html: `<h1 style="text-align:center">Your Name</h1><p style="text-align:center">email@example.com · 555 0100 · City</p><h2>Experience</h2><p><b>Job title</b> — Company · 2022 – now</p><ul><li>What you achieved, with a number if you can</li><li>Another achievement</li></ul><p><b>Job title</b> — Company · 2019 – 2022</p><ul><li>What you did there</li></ul><h2>Education</h2><p><b>Qualification</b> — School · Year</p><h2>Skills</h2><p>Skill one · Skill two · Skill three</p>` },
  { name: 'Meeting notes', html: `<h1>Meeting notes</h1><p><b>Date:</b> ${new Date().toLocaleDateString()}<br><b>Attendees:</b> </p><h2>Agenda</h2><ol><li>Topic</li><li>Topic</li></ol><h2>Notes</h2><p><br></p><h2>Action items</h2><table><tbody><tr><th>Task</th><th>Owner</th><th>Due</th></tr><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></tbody></table>` },
  { name: 'Essay', html: `<h1 style="text-align:center">Essay title</h1><p style="text-align:center">Your Name · Class · Date</p><p style="text-indent:2em">Introduction: open with a hook and end with your main argument.</p><p style="text-indent:2em">Body paragraph one: your first point and the evidence for it.</p><p style="text-indent:2em">Body paragraph two: your second point.</p><p style="text-indent:2em">Conclusion: sum up and say why it matters.</p>` }
];
TEMPLATES.forEach(t => t.preview = `<div class="tpl-page"><b>${esc(t.name === 'Blank document' ? '' : t.name)}</b>${t.name === 'Blank document' ? '' : '<i></i><i style="width:80%"></i><i></i><i style="width:60%"></i><i></i><i style="width:70%"></i>'}</div>`);

// ---------- home / open ----------
const showHome = () => { flush(); doc = null; $('#ed').classList.remove('on'); $('#home').classList.remove('off'); refreshHome(); document.title = 'Write'; };
const refreshHome = Kit.home({ el: $('#home'), title: 'Write', accent: '#2b6cd8', lib, templates: TEMPLATES, importLabel: 'Open a file…',
  onNew: t => openDoc({ id: Kit.uid(), name: t.name === 'Blank document' ? 'Untitled document' : t.name, html: t.html, page: 'letter' }, true),
  onOpen: id => { const d = lib.load(id); if (d) openDoc({ ...d, id }); else Kit.toast('That document is gone'); },
  onImport: () => importFile() });
const openDoc = (d, isNew) => {
  doc = d; paper.innerHTML = d.html || '<p><br></p>'; title.value = d.name;
  paper.classList.toggle('a4', d.page === 'a4');
  $('#home').classList.add('off'); $('#ed').classList.add('on'); document.title = d.name + ' — Write';
  fitZoom(); if (isNew) save(); dirty = false; counts();
  paper.focus(); placeCaretStart();
};
const placeCaretStart = () => { try { const r = document.createRange(); r.setStart(paper, 0); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch {} };
const save = () => { if (!doc) return; clearFound(); doc.html = paper.innerHTML; doc.name = title.value.trim() || 'Untitled document'; lib.save(doc.id, doc.name, { name: doc.name, html: doc.html, page: doc.page }); dirty = false; counts(); };
const flush = () => { if (dirty) save(); };
const changed = () => { dirty = true; status.textContent = 'Saving…'; clearTimeout(saveT); saveT = setTimeout(save, 700); counts(); };
paper.addEventListener('input', changed);
title.addEventListener('input', () => { document.title = title.value + ' — Write'; changed(); });
title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); paper.focus(); } });
addEventListener('beforeunload', flush); addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
const counts = () => { const t = paper.innerText.trim(); const w = t ? t.split(/\s+/).length : 0; $('#status').dataset.c = w; status.title = `${w} words · ${t.replace(/\s/g, '').length} characters`; status.innerHTML = `<b>${w} words</b> · ${dirty ? 'Saving…' : 'Saved'}`; };

// ---------- zoom ----------
const fitZoom = () => {
  const avail = $('#scroll').clientWidth - 24, w = paper.offsetWidth || 816;
  const z = zoomLvl === 'fit' ? Math.min(1, avail / w) : zoomLvl;
  paper.style.zoom = z;
};
addEventListener('resize', () => { if (doc) fitZoom(); });

// ---------- commands ----------
document.execCommand('defaultParagraphSeparator', false, 'p');
const cmd = (c, v = null) => { paper.focus(); document.execCommand('styleWithCSS', false, !/^(bold|italic|underline|strikeThrough)$/.test(c)); document.execCommand(c, false, v); changed(); syncTools(); };
$$('[data-c]').forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => cmd(b.dataset.c); });
$$('[data-x]').forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => ({ link: insertLink, image: insertImage, table: insertTable })[b.dataset.x](); });
let savedRange = null;
const keepSel = () => { const s = getSelection(); if (s.rangeCount && paper.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange(); };
const restoreSel = () => { paper.focus(); if (savedRange) { const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); } };
document.addEventListener('selectionchange', () => { keepSel(); syncTools(); });
$('#block').onchange = e => { restoreSel(); cmd('formatBlock', '<' + e.target.value + '>'); };
$('#font').onchange = e => { restoreSel(); if (e.target.value) cmd('fontName', e.target.value); };
$('#size').onchange = e => { restoreSel(); setSize(+e.target.value); };
const setSize = pt => {
  if (!pt) return;
  document.execCommand('styleWithCSS', false, false); document.execCommand('fontSize', false, '7');
  $$('font[size="7"]', paper).forEach(f => { const s = document.createElement('span'); s.style.fontSize = pt + 'pt'; s.innerHTML = f.innerHTML; f.replaceWith(s); });
  changed();
};
$('#fc').oninput = e => { $('#fcI').style.background = e.target.value; restoreSel(); cmd('foreColor', e.target.value); };
$('#hc').oninput = e => { $('#hcI').style.background = e.target.value; restoreSel(); cmd('hiliteColor', e.target.value); };
const syncTools = () => {
  if (!doc) return;
  ['bold', 'italic', 'underline', 'strikeThrough', 'superscript', 'subscript', 'insertUnorderedList', 'insertOrderedList', 'justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'].forEach(c => { const b = $(`[data-c="${c}"]`); if (b) b.classList.toggle('on', document.queryCommandState(c)); });
  const s = getSelection(); let n = s.anchorNode; if (!n || !paper.contains(n)) return;
  if (n.nodeType === 3) n = n.parentNode;
  const blk = n.closest('h1,h2,h3,blockquote,pre,p,li,td,th,div'); const tag = blk && blk !== paper ? blk.tagName.toLowerCase() : 'p';
  $('#block').value = ['h1', 'h2', 'h3', 'blockquote', 'pre'].includes(tag) ? tag : 'p';
  const cs = getComputedStyle(n); $('#size').value = String(Math.round(parseFloat(cs.fontSize) * 0.75)) || '';
  if (!$('#size').value) $('#size').value = '';
  const fam = cs.fontFamily.split(',')[0].replace(/["']/g, '').trim(); $('#font').value = [...$('#font').options].some(o => o.value === fam) ? fam : '';
};
const insertHTML = html => { restoreSel(); document.execCommand('insertHTML', false, html); changed(); };
const insertLink = async () => {
  keepSel(); const sel = String(getSelection());
  const v = await Kit.dialog('Insert link', [{ id: 'u', label: 'Address', value: 'https://' }, ...(sel ? [] : [{ id: 't', label: 'Text to show', value: '' }])], { ok: 'Insert' });
  if (!v || !v.u.trim()) return;
  const url = /^[a-z]+:/i.test(v.u.trim()) ? v.u.trim() : 'https://' + v.u.trim();
  if (sel) { restoreSel(); cmd('createLink', url); } else insertHTML(`<a href="${esc(url)}">${esc(v.t || url)}</a>`);
};
const insertImage = async () => {
  keepSel(); const f = await Kit.pick('image/*'); if (!f) return;
  const url = await Kit.readAs(f, 'readAsDataURL'); const sz = await Kit.imgSize(url);
  insertHTML(`<img src="${url}" style="width:${sz.w > 600 ? 100 : Math.round(sz.w / 6.24)}%" alt="${esc(f.name)}">`);
};
const insertTable = async () => {
  keepSel(); const v = await Kit.dialog('Insert table', [{ id: 'r', label: 'Rows', type: 'number', value: 3, min: 1, max: 60 }, { id: 'c', label: 'Columns', type: 'number', value: 3, min: 1, max: 12 }, { id: 'hd', label: 'Header row', type: 'select', value: 'y', options: [['y', 'Yes'], ['n', 'No']] }], { ok: 'Insert' });
  if (!v) return; const r = Kit.clamp(+v.r || 3, 1, 60), c = Kit.clamp(+v.c || 3, 1, 12);
  let t = '<table><tbody>'; for (let i = 0; i < r; i++) { t += '<tr>'; for (let j = 0; j < c; j++) t += i === 0 && v.hd === 'y' ? '<th><br></th>' : '<td><br></td>'; t += '</tr>'; } t += '</tbody></table><p><br></p>';
  insertHTML(t);
};
const cellOf = () => { const s = getSelection(); let n = s.anchorNode; if (!n) return null; if (n.nodeType === 3) n = n.parentNode; return n.closest && paper.contains(n) ? n.closest('td,th') : null; };
const tableOp = op => {
  const c = cellOf(); if (!c) return Kit.toast('Put the cursor in a table first');
  const tr = c.parentNode, tbl = c.closest('table'), idx = [...tr.children].indexOf(c);
  if (op === 'rowA' || op === 'rowB') { const n = document.createElement('tr'); [...tr.children].forEach(() => n.appendChild(h('<td><br></td>'))); op === 'rowA' ? tr.after(n) : tr.before(n); }
  if (op === 'colA' || op === 'colB') $$('tr', tbl).forEach(r => { const ref = r.children[idx]; const n = h(ref && ref.tagName === 'TH' ? '<th><br></th>' : '<td><br></td>'); if (!ref) r.appendChild(n); else op === 'colA' ? ref.after(n) : ref.before(n); });
  if (op === 'rowD') { tr.remove(); if (!$('tr', tbl)) tbl.remove(); }
  if (op === 'colD') { $$('tr', tbl).forEach(r => r.children[idx] && r.children[idx].remove()); if (!$('td,th', tbl)) tbl.remove(); }
  if (op === 'tblD') tbl.remove();
  changed();
};

// ---------- image tools ----------
let selImg = null;
const imgbar = $('#imgbar');
const placeImgBar = () => { if (!selImg || !paper.contains(selImg)) { imgbar.classList.remove('on'); selImg = null; return; } const r = selImg.getBoundingClientRect(); imgbar.classList.add('on'); imgbar.style.left = Math.max(4, r.left) + 'px'; imgbar.style.top = Math.max(4, r.top - 40) + 'px'; };
paper.addEventListener('click', e => { $$('img.sel', paper).forEach(i => i.classList.remove('sel')); selImg = e.target.tagName === 'IMG' ? e.target : null; if (selImg) selImg.classList.add('sel'); placeImgBar(); });
$('#scroll').addEventListener('scroll', placeImgBar);
$$('[data-w]', imgbar).forEach(b => b.onclick = () => { if (selImg) { selImg.style.width = b.dataset.w + '%'; selImg.style.height = 'auto'; changed(); placeImgBar(); } });
$$('[data-a]', imgbar).forEach(b => b.onclick = () => {
  if (!selImg) return; const a = b.dataset.a;
  if (a === 'del') { selImg.remove(); selImg = null; placeImgBar(); changed(); return; }
  let p = selImg.parentNode; if (p === paper) { p = document.createElement('p'); selImg.before(p); p.appendChild(selImg); }
  p.style.textAlign = a; changed(); placeImgBar();
});

// ---------- find & replace ----------
const clearFound = () => $$('mark.found', paper).forEach(m => m.replaceWith(...m.childNodes)) || paper.normalize();
const findAll = q => {
  clearFound(); paper.normalize(); if (!q) { $('#fcnt').textContent = ''; return []; }
  const out = [], walker = document.createTreeWalker(paper, NodeFilter.SHOW_TEXT), nodes = []; let n;
  while ((n = walker.nextNode())) nodes.push(n);
  const ql = q.toLowerCase();
  nodes.forEach(t => { let i, s = t.nodeValue.toLowerCase(), node = t; let off = 0;
    while ((i = s.indexOf(ql, off)) >= 0) { const r = node.splitText(i); const rest = r.splitText(q.length); const m = document.createElement('mark'); m.className = 'found'; r.before(m); m.appendChild(r); out.push(m); node = rest; s = rest.nodeValue.toLowerCase(); off = 0; } });
  $('#fcnt').textContent = out.length ? out.length + ' found' : 'Not found'; return out;
};
let fIdx = -1;
$('#fq').oninput = () => { fIdx = -1; findAll($('#fq').value); };
$('#fn').onclick = () => { const m = $$('mark.found', paper); if (!m.length) return findAll($('#fq').value); fIdx = (fIdx + 1) % m.length; m[fIdx].scrollIntoView({ block: 'center' }); m.forEach((x, i) => x.style.background = i === fIdx ? '#ffb347' : ''); };
$('#fq').onkeydown = e => { if (e.key === 'Enter') $('#fn').click(); if (e.key === 'Escape') closeFind(); };
$('#fra').onclick = () => { const m = findAll($('#fq').value); m.forEach(x => x.replaceWith(document.createTextNode($('#fr').value))); paper.normalize(); Kit.toast(m.length + ' replaced'); $('#fcnt').textContent = ''; changed(); };
const openFind = () => { $('#find').classList.add('on'); $('#fq').focus(); $('#fq').select(); };
const closeFind = () => { $('#find').classList.remove('on'); clearFound(); paper.focus(); };
$('#fx').onclick = closeFind;

// ---------- menus ----------
const MENUS = {
  file: () => [
    { label: 'New', act: () => { flush(); openDoc({ id: Kit.uid(), name: 'Untitled document', html: '<p><br></p>', page: doc.page }, true); } },
    { label: 'Open…', act: showHome },
    { label: 'Open a file from this device…', act: importFile },
    '-',
    { label: 'Save as Word (.docx)', hint: 'Ctrl+S', act: () => exportDocx() },
    { label: 'Save as PDF / Print', hint: 'Ctrl+P', act: () => { clearFound(); print(); } },
    { label: 'Save as web page (.html)', act: exportHtml },
