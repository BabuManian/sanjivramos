<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipe Flow</title>
<style>
html,body{margin:0;height:100%;background:#082f49;color:#e0f2fe;font:14px system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
header{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
header b{color:#fff}
button,select{font:inherit;border:none;border-radius:6px;padding:7px 11px;cursor:pointer;background:#0c4a6e;color:#e0f2fe}
canvas{display:block;touch-action:manipulation;border-radius:10px;cursor:pointer}
#win{display:none;position:fixed;inset:0;background:rgba(8,47,73,.85);align-items:center;justify-content:center;flex-direction:column;gap:12px}
#win.on{display:flex}
#win button{background:#38bdf8;color:#082f49;font-weight:700;padding:10px 18px}
p{margin:0;opacity:.7;text-align:center}
</style></head><body>
<header><select id="lvl" aria-label="Level"></select><span>Turns <b id="turns">0</b></span><span>Filled <b id="fill">0%</b></span><button id="reset">↺ Reset</button></header>
<canvas id="cv" aria-label="Pipe board"></canvas>
<p>Tap a pipe to turn it. Connect every pipe to the water source in the middle with no open ends.</p>
<div id="win"><h2 style="margin:0">Water flows everywhere!</h2><div id="ws"></div><button id="next">Next level</button></div>
<script src="../sj-gamekit/kit.js"></script>
<script>window.SJG && SJG.init("pipes", { vs: { mode: 'time', levelKey: 'sj-pipes-unlocked', levels: 12 }, title: "Pipe Flow", lower: false, trophies: [{"id": "l10", "name": "Plumber", "desc": "Solve 10 levels", "icon": "🔧"}, {"id": "all", "name": "Master Plumber", "desc": "Solve all 40 levels", "icon": "🏆"}] });</script>
<script>
(() => {
  const LEVELS = 40, U = 1, Rt = 2, D = 4, Lf = 8;
  const DIRS = [[0, -1, U, D], [1, 0, Rt, Lf], [0, 1, D, U], [-1, 0, Lf, Rt]];
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
  let G, n, src, turns, cur = 1, unlocked = 1, TS = 56, full = new Set(), anim = [];
  try { unlocked = +localStorage.getItem('sj-pipes-unlocked') || 1; } catch {}
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rot = m => ((m << 1) | (m >> 3)) & 15; // clockwise quarter turn
  // Random spanning tree from the centre = a guaranteed solution; then spin every tile.
  function generate(level) {
    const rand = rng(level * 31337 + 5), R = k => rand() * k | 0;
    n = Math.min(10, 4 + (level / 5 | 0));
    const grid = Array.from({ length: n }, () => Array(n).fill(0));
    src = [n >> 1, n >> 1];
    const seen = new Set([src + '']), stack = [src];
    while (stack.length) {
      // Pick from a random spot in the stack: mixes long corridors and branches.
      const i = rand() < 0.7 ? stack.length - 1 : R(stack.length);
      const [x, y] = stack[i];
      const opts = DIRS.filter(([dx, dy]) => { const nx = x + dx, ny = y + dy; return nx >= 0 && ny >= 0 && nx < n && ny < n && !seen.has([nx, ny] + ''); });
      if (!opts.length) { stack.splice(i, 1); continue; }
      const [dx, dy, a, b] = opts[R(opts.length)];
      grid[y][x] |= a; grid[y + dy][x + dx] |= b;
      seen.add([x + dx, y + dy] + ''); stack.push([x + dx, y + dy]);
    }
    G = grid.map(row => row.map(m => { let r = m; for (let k = R(4); k > 0; k--) r = rot(r); return { m: r, a: 0 }; }));
    if (solved()) { const c = G[0][0]; c.m = rot(c.m); }
  }
  function flow() {
    full = new Set([src + '']); const q = [src];
    while (q.length) {
      const [x, y] = q.pop();
      for (const [dx, dy, a, b] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= n || ny >= n || full.has([nx, ny] + '')) continue;
        if ((G[y][x].m & a) && (G[ny][nx].m & b)) { full.add([nx, ny] + ''); q.push([nx, ny]); }
      }
    }
  }
  function solved() {
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) for (const [dx, dy, a, b] of DIRS) {
      const has = G[y][x].m & a, nx = x + dx, ny = y + dy;
      const other = nx >= 0 && ny >= 0 && nx < n && ny < n ? G[ny][nx].m & b : 0;
      if (!!has !== !!other) return false;
    }
    flow(); return full.size === n * n;
  }
  function load(l) { cur = l; generate(l); turns = 0; $('lvl').value = l; $('win').classList.remove('on'); fit(); refresh(); }
  function refresh() {
    flow(); $('turns').textContent = turns; $('fill').textContent = Math.round(full.size / (n * n) * 100) + '%';
    if (solved()) {
      if (cur >= unlocked) { window.SJG && (SJG.score(cur + 1, 'levels'), cur + 1 >= 10 && SJG.unlock('l10'), cur + 1 >= LEVELS && SJG.unlock('all')); unlocked = Math.min(LEVELS, cur + 1); try { localStorage.setItem('sj-pipes-unlocked', String(unlocked)); } catch {} fillSelect(); }
      $('ws').textContent = `${turns} turns`; $('next').textContent = cur < LEVELS ? 'Next level' : 'All done! Back to 1';
      setTimeout(() => $('win').classList.add('on'), 400);
    }
  }
  function fit() { TS = Math.max(26, Math.min(72, Math.floor(Math.min(innerWidth - 20, innerHeight - 130) / n))); cv.width = cv.height = n * TS; }
  function draw() {
    ctx.fillStyle = '#0c4a6e'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const c = G[y][x], cx = x * TS + TS / 2, cy = y * TS + TS / 2, on = full.has([x, y] + '');
      ctx.fillStyle = (x + y) % 2 ? '#075985' : '#0369a1'; ctx.fillRect(x * TS, y * TS, TS, TS);
      c.a *= 0.75; // spin animation
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-c.a);
      [[0, -1, U], [1, 0, Rt], [0, 1, D], [-1, 0, Lf]].forEach(([dx, dy, bit]) => {
        if (!(c.m & bit)) return;
        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = TS * 0.34; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(dx * TS / 2, dy * TS / 2); ctx.stroke();
        ctx.strokeStyle = on ? '#38bdf8' : '#94a3b8'; ctx.lineWidth = TS * 0.2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(dx * TS / 2, dy * TS / 2); ctx.stroke();
      });
      ctx.fillStyle = on ? '#38bdf8' : '#94a3b8'; ctx.beginPath(); ctx.arc(0, 0, TS * 0.12, 0, 7); ctx.fill();
      ctx.restore();
      if (x === src[0] && y === src[1]) { ctx.fillStyle = '#f0f9ff'; ctx.beginPath(); ctx.arc(cx, cy, TS * 0.2, 0, 7); ctx.fill(); ctx.fillStyle = '#0284c7'; ctx.font = `${TS * 0.26}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('💧', cx, cy + 1); }
    }
    requestAnimationFrame(draw);
  }
  cv.addEventListener('click', e => {
    if ($('win').classList.contains('on')) return;
    const r = cv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * n), y = Math.floor((e.clientY - r.top) / r.height * n);
    const c = G[y]?.[x]; if (!c) return;
    c.m = rot(c.m); c.a += Math.PI / 2; turns++; refresh();
  });
  cv.addEventListener('contextmenu', e => { // right-click turns the other way
    e.preventDefault();
    const r = cv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * n), y = Math.floor((e.clientY - r.top) / r.height * n);
    const c = G[y]?.[x]; if (!c || $('win').classList.contains('on')) return;
    c.m = rot(rot(rot(c.m))); c.a -= Math.PI / 2; turns++; refresh();
  });
  function fillSelect() { $('lvl').innerHTML = ''; for (let i = 1; i <= LEVELS; i++) { const o = document.createElement('option'); o.value = i; o.disabled = i > unlocked; o.textContent = `Level ${i}` + (i < unlocked ? ' ✓' : i > unlocked ? ' 🔒' : ''); $('lvl').appendChild(o); } $('lvl').value = cur; }
  $('lvl').onchange = () => load(+$('lvl').value);
  $('reset').onclick = () => load(cur);
  $('next').onclick = () => load(cur < LEVELS ? cur + 1 : 1);
  addEventListener('keydown', e => { if (e.key === 'Enter' && $('win').classList.contains('on')) $('next').click(); });
  addEventListener('resize', fit);
  cur = Math.min(unlocked, LEVELS); fillSelect(); load(cur); requestAnimationFrame(draw);
})();
</script>
</body></html>
