<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat Tap</title>
<style>
html,body{margin:0;height:100%;background:#09090b;color:#fafafa;font:14px system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
</style></head><body>
<canvas id="cv" width="420" height="640" aria-label="Beat Tap"></canvas>
<script src="../sj-gamekit/kit.js"></script>
<script>window.SJG && SJG.init("rhythm", { vs: {}, title: "Beat Tap", lower: false, trophies: [{"id": "s", "name": "Perfect Pitch", "desc": "Get an S grade", "icon": "🎵"}] });</script>
<script>
(() => {
  const VW = 420, VH = 640, LANES = 4, LW = 90, LX = (VW - LW * LANES) / 2, HIT_Y = 560, SPEED = 460;
  const COLORS = ['#f43f5e', '#f59e0b', '#22d3ee', '#a78bfa'];
  const SONGS = [
    { name: 'Easy Groove', bpm: 96, sub: 2, dens: 0.42, chords: 0, len: 48, key: 0, seed: 11 },
    { name: 'Neon Drive', bpm: 124, sub: 2, dens: 0.6, chords: 0.08, len: 56, key: 3, seed: 22 },
    { name: 'Sunset Funk', bpm: 112, sub: 4, dens: 0.38, chords: 0.05, len: 56, key: 5, seed: 33 },
    { name: 'Hyper Rush', bpm: 150, sub: 4, dens: 0.42, chords: 0.12, len: 60, key: 7, seed: 44 },
    { name: 'Overdrive', bpm: 172, sub: 4, dens: 0.5, chords: 0.18, len: 64, key: 2, seed: 55 },
  ];
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let ac = null, state = 'menu', menuIdx = 0, song, notes, startAt, score, combo, maxCombo, counts, flashes, laneGlow = [0, 0, 0, 0], nextBeat, beatN, judge = null, bests = {};
  try { bests = JSON.parse(localStorage.getItem('sj-rhythm-best') || '{}'); } catch {}
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const now = () => ac.currentTime - startAt;

  function chart(s) {
    const rand = rng(s.seed), beat = 60 / s.bpm, step = beat / s.sub, out = [];
    let last = -1;
    for (let t = beat * 4; t < s.len - 2; t += step) {
      const strong = Math.abs((t / beat) % 1) < 1e-6;
      if (rand() > s.dens * (strong ? 1.5 : 0.8)) continue;
      let lane = rand() * LANES | 0; if (lane === last) lane = (lane + 1 + (rand() * 3 | 0)) % LANES;
      out.push({ t, lane }); last = lane;
      if (rand() < s.chords) out.push({ t, lane: (lane + 2) % LANES });
    }
    return out;
  }
  // --- tiny synth ---
  function tone(freq, when, dur, type = 'triangle', vol = 0.18) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g).connect(ac.destination); o.start(when); o.stop(when + dur + 0.02);
  }
  let noiseBuf = null;
  function noise(when, dur, vol, hp) {
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    s.connect(f).connect(g).connect(ac.destination); s.start(when); s.stop(when + dur);
  }
  function kick(when) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, when); o.frequency.exponentialRampToValueAtTime(40, when + 0.12); g.gain.setValueAtTime(0.6, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.2); o.connect(g).connect(ac.destination); o.start(when); o.stop(when + 0.22); }
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const PROG = [0, 5, 3, 4]; // i - vi - iv - v style roots in the scale below
  const SCALE = [0, 2, 3, 5, 7, 8, 10];
  function scheduleMusic() {
    const beat = 60 / song.bpm;
    while (startAt + nextBeat * beat < ac.currentTime + 0.15) {
      const when = startAt + nextBeat * beat, b = nextBeat;
      if (b * beat > song.len) break;
      if (b >= 0) {
        kick(when);
        if (b % 2 === 1) noise(when, 0.12, 0.25, 1500);
        noise(when + beat / 2, 0.04, 0.08, 7000);
        const root = 45 + song.key + SCALE[PROG[(b / 4 | 0) % 4]];
        tone(midi(root), when, beat * 0.9, 'sawtooth', 0.05);
        if (b % 4 === 0) [0, 3, 7].forEach(iv => tone(midi(root + 12 + iv), when, beat * 3.8, 'sine', 0.035));
      }
      nextBeat++;
    }
  }
  function start(i) {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    ac.resume();
    song = SONGS[i]; notes = chart(song); score = 0; combo = 0; maxCombo = 0; counts = { perfect: 0, great: 0, good: 0, miss: 0 }; flashes = [];
    startAt = ac.currentTime + 0.4; nextBeat = 0; state = 'play'; judge = null;
  }
  function finish() {
    state = 'result';
    const total = notes.length || 1, acc = (counts.perfect + counts.great * 0.7 + counts.good * 0.4) / total;
    song.acc = acc; song.grade = acc >= 0.95 ? 'S' : acc >= 0.88 ? 'A' : acc >= 0.75 ? 'B' : acc >= 0.6 ? 'C' : 'D';
    window.SJG && (SJG.score(score, song.name), song.grade === 'S' && SJG.unlock('s')); if (!bests[song.name] || score > bests[song.name].score) { bests[song.name] = { score, grade: song.grade }; try { localStorage.setItem('sj-rhythm-best', JSON.stringify(bests)); } catch {} }
  }
  function hit(lane) {
    laneGlow[lane] = 1;
    if (state !== 'play') return;
    const t = now();
    let best = null;
    for (const n of notes) if (!n.done && n.lane === lane && Math.abs(n.t - t) < 0.16 && (!best || Math.abs(n.t - t) < Math.abs(best.t - t))) best = n;
    if (!best) return;
    const d = Math.abs(best.t - t); best.done = true;
    const kind = d < 0.05 ? 'perfect' : d < 0.1 ? 'great' : 'good';
    counts[kind]++; combo++; maxCombo = Math.max(maxCombo, combo);
    score += ({ perfect: 300, great: 200, good: 100 })[kind] * (1 + Math.min(combo, 100) / 50);
    judge = { kind, t: 0.5 };
    flashes.push({ lane, t: 0.25 });
    const root = 57 + song.key; tone(midi(root + [0, 3, 7, 10][lane] + 12), ac.currentTime, 0.18, 'square', 0.05);
  }
  function update(dt) {
    laneGlow = laneGlow.map(v => Math.max(0, v - dt * 5));
    flashes.forEach(f => f.t -= dt); flashes = flashes?.filter(f => f.t > 0) || [];
    if (judge) { judge.t -= dt; if (judge.t <= 0) judge = null; }
    if (state !== 'play') return;
    scheduleMusic();
    const t = now();
    for (const n of notes) if (!n.done && t - n.t > 0.16) { n.done = true; n.miss = true; counts.miss++; combo = 0; judge = { kind: 'miss', t: 0.5 }; }
    if (t > song.len) finish();
  }
  function draw() {
    ctx.fillStyle = '#09090b'; ctx.fillRect(0, 0, VW, VH);
    for (let i = 0; i < LANES; i++) {
      const x = LX + i * LW;
      ctx.fillStyle = i % 2 ? '#111114' : '#16161a'; ctx.fillRect(x, 0, LW, VH);
      const g = ctx.createLinearGradient(0, HIT_Y - 200, 0, HIT_Y); g.addColorStop(0, 'transparent'); g.addColorStop(1, COLORS[i] + Math.round(laneGlow[i] * 90).toString(16).padStart(2, '0'));
      ctx.fillStyle = g; ctx.fillRect(x, HIT_Y - 200, LW, 200);
    }
    if (state === 'play' || state === 'result') {
      const t = state === 'play' ? now() : song.len;
      // beat lines
      const beat = 60 / song.bpm;
      ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
      for (let b = Math.floor(t / beat); b < t / beat + 3; b++) { const y = HIT_Y - (b * beat - t) * SPEED; ctx.beginPath(); ctx.moveTo(LX, y); ctx.lineTo(LX + LW * LANES, y); ctx.stroke(); }
      for (const n of notes) {
        if (n.done && !n.miss) continue;
        const y = HIT_Y - (n.t - t) * SPEED; if (y < -30 || y > VH + 30) continue;
        const x = LX + n.lane * LW;
        ctx.globalAlpha = n.miss ? 0.25 : 1;
        ctx.fillStyle = COLORS[n.lane]; ctx.beginPath(); ctx.roundRect(x + 8, y - 12, LW - 16, 24, 8); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x + 16, y - 9, LW - 32, 4);
        ctx.globalAlpha = 1;
      }
    }
    // Hit line and keys.
    for (let i = 0; i < LANES; i++) {
      const x = LX + i * LW;
      ctx.strokeStyle = COLORS[i]; ctx.lineWidth = 3; ctx.globalAlpha = 0.5 + laneGlow[i] * 0.5;
      ctx.beginPath(); ctx.roundRect(x + 6, HIT_Y - 14, LW - 12, 28, 9); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillStyle = '#71717a'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center'; ctx.fillText('DFJK'[i], x + LW / 2, HIT_Y + 50);
    }
    flashes.forEach(f => { ctx.fillStyle = `rgba(255,255,255,${f.t * 2})`; ctx.beginPath(); ctx.arc(LX + f.lane * LW + LW / 2, HIT_Y, 40 * (1.2 - f.t * 2), 0, 7); ctx.fill(); });
    ctx.textAlign = 'center';
    if (state === 'play') {
      ctx.fillStyle = '#fafafa'; ctx.font = 'bold 22px system-ui'; ctx.fillText(Math.round(score).toLocaleString(), VW / 2, 36);
      ctx.font = '13px system-ui'; ctx.fillStyle = '#a1a1aa'; ctx.fillText(song.name, VW / 2, 56);
      if (combo > 2) { ctx.font = 'bold 34px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText(combo, VW / 2, 300); ctx.font = '12px system-ui'; ctx.fillText('COMBO', VW / 2, 318); }
      if (judge) { ctx.font = 'bold 26px system-ui'; ctx.fillStyle = ({ perfect: '#fde047', great: '#4ade80', good: '#60a5fa', miss: '#ef4444' })[judge.kind]; ctx.fillText(judge.kind.toUpperCase(), VW / 2, 400 - (0.5 - judge.t) * 30); }
      const prog = Math.min(1, Math.max(0, now() / song.len)); ctx.fillStyle = '#27272a'; ctx.fillRect(0, 0, VW, 4); ctx.fillStyle = '#a78bfa'; ctx.fillRect(0, 0, VW * prog, 4);
    } else if (state === 'menu') {
      ctx.fillStyle = 'rgba(9,9,11,.82)'; ctx.fillRect(0, 0, VW, VH);
      ctx.fillStyle = '#fafafa'; ctx.font = 'bold 40px system-ui'; ctx.fillText('BEAT TAP', VW / 2, 110);
      ctx.font = '14px system-ui'; ctx.fillStyle = '#a1a1aa'; ctx.fillText('Hit D F J K (or tap the lanes) as notes cross the line', VW / 2, 140);
      SONGS.forEach((s, i) => {
        const y = 190 + i * 70, sel = i === menuIdx;
        ctx.fillStyle = sel ? '#27272a' : '#18181b'; ctx.beginPath(); ctx.roundRect(40, y, VW - 80, 58, 12); ctx.fill();
        if (sel) { ctx.strokeStyle = COLORS[i % 4]; ctx.lineWidth = 2; ctx.stroke(); }
        ctx.textAlign = 'left'; ctx.fillStyle = '#fafafa'; ctx.font = 'bold 17px system-ui'; ctx.fillText(s.name, 58, y + 25);
        ctx.font = '12px system-ui'; ctx.fillStyle = '#a1a1aa'; ctx.fillText(`${s.bpm} BPM · ${'★'.repeat(i + 1)}`, 58, y + 44);
        const b = bests[s.name]; ctx.textAlign = 'right';
        if (b) { ctx.fillStyle = '#fde047'; ctx.font = 'bold 22px system-ui'; ctx.fillText(b.grade, VW - 58, y + 30); ctx.font = '11px system-ui'; ctx.fillStyle = '#a1a1aa'; ctx.fillText(Math.round(b.score).toLocaleString(), VW - 58, y + 46); }
        ctx.textAlign = 'center';
      });
      ctx.fillStyle = '#a1a1aa'; ctx.font = '13px system-ui'; ctx.fillText('↑/↓ to choose, Enter to play — or tap a song', VW / 2, 590);
    } else if (state === 'result') {
      ctx.fillStyle = 'rgba(9,9,11,.85)'; ctx.fillRect(0, 0, VW, VH);
      ctx.fillStyle = '#fde047'; ctx.font = 'bold 90px system-ui'; ctx.fillText(song.grade, VW / 2, 200);
      ctx.fillStyle = '#fafafa'; ctx.font = 'bold 26px system-ui'; ctx.fillText(Math.round(score).toLocaleString(), VW / 2, 250);
      ctx.font = '15px system-ui'; ctx.fillStyle = '#d4d4d8';
      [`Accuracy ${(song.acc * 100).toFixed(1)}%`, `Max combo ${maxCombo}`, `Perfect ${counts.perfect} · Great ${counts.great}`, `Good ${counts.good} · Miss ${counts.miss}`].forEach((s, i) => ctx.fillText(s, VW / 2, 300 + i * 26));
      ctx.fillStyle = '#a1a1aa'; ctx.fillText('Tap or press Enter for the song list', VW / 2, 450);
    }
  }
  const KEYS = { d: 0, f: 1, j: 2, k: 3, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3 };
  addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (state === 'menu') {
      if (k === 'ArrowUp') menuIdx = (menuIdx + SONGS.length - 1) % SONGS.length;
      else if (k === 'ArrowDown') menuIdx = (menuIdx + 1) % SONGS.length;
      else if (k === 'Enter' || k === ' ') start(menuIdx);
      e.preventDefault(); return;
    }
    if (state === 'result') { if (k === 'Enter' || k === ' ' || k === 'Escape') state = 'menu'; return; }
    if (k === 'Escape') { state = 'menu'; return; }
    if (k in KEYS) { e.preventDefault(); hit(KEYS[k]); }
  });
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * VW / r.width, y = (e.clientY - r.top) * VH / r.height;
    if (state === 'menu') { const i = Math.floor((y - 190) / 70); if (i >= 0 && i < SONGS.length && (y - 190) % 70 < 58) { menuIdx = i; start(i); } return; }
    if (state === 'result') { state = 'menu'; return; }
    const lane = Math.floor((x - LX) / LW); if (lane >= 0 && lane < LANES) hit(lane);
  });
  function fit() { const s = Math.min(innerWidth / VW, innerHeight / VH); cv.style.width = Math.floor(VW * s) + 'px'; cv.style.height = Math.floor(VH * s) + 'px'; }
  addEventListener('resize', fit); fit();
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { state = 'menu'; } });
  let last = performance.now();
  function frame(t) { update(Math.min(0.05, (t - last) / 1000)); last = t; draw(); requestAnimationFrame(frame); }
  flashes = []; requestAnimationFrame(frame);
})();
</script>
</body></html>
