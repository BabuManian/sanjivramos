<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lights Out</title>
<style>
html,body{margin:0;height:100%;background:#18181b;color:#fafafa;font:14px system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
header{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
header b{color:#fff}
button,select{font:inherit;border:none;border-radius:6px;padding:7px 11px;cursor:pointer;background:#3f3f46;color:#fafafa}
#board{display:grid;gap:6px}
#board button{width:var(--s);height:var(--s);border-radius:12px;padding:0;background:#27272a;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);transition:background .15s,box-shadow .15s,transform .08s}
#board button.on{background:#fde047;box-shadow:0 0 18px rgba(253,224,71,.6),inset 0 -4px 0 rgba(0,0,0,.15)}
#board button:active{transform:scale(.94)}
#board button.hint{outline:3px solid #22d3ee}
#win{display:none;position:fixed;inset:0;background:rgba(24,24,27,.85);align-items:center;justify-content:center;flex-direction:column;gap:12px}
#win.on{display:flex}
#win button{background:#fde047;color:#18181b;font-weight:700;padding:10px 18px}
p{margin:0;opacity:.7;text-align:center;max-width:460px}
</style></head><body>
<header><select id="lvl" aria-label="Level"></select><span>Moves <b id="moves">0</b></span><span>Par <b id="par">0</b></span><button id="hint">💡 Hint</button><button id="reset">↺ Reset</button></header>
<div id="board" role="grid"></div>
<p>Pressing a light flips it and its neighbours. Turn every light off.</p>
<div id="win"><h2 style="margin:0">Lights out!</h2><div id="ws"></div><button id="next">Next level</button></div>
<script src="../sj-gamekit/kit.js"></script>
<script>window.SJG && SJG.init("lightsout", { vs: { mode: 'time', levelKey: 'sj-lights-unlocked', levels: 15 }, title: "Lights Out", lower: false, trophies: [{"id": "l10", "name": "Night Owl", "desc": "Solve 10 levels", "icon": "🌙"}, {"id": "all", "name": "Total Darkness", "desc": "Solve all 50 levels", "icon": "🏆"}] });</script>
<script>
(() => {
  const LEVELS = 50, $ = id => document.getElementById(id);
  let n, grid, moves, par, presses, cur = 1, unlocked = 1, btns = [];
  try { unlocked = +localStorage.getItem('sj-lights-unlocked') || 1; } catch {}
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function flip(g, x, y) { for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < n && ny < n) g[ny][nx] ^= 1; } }
  // Start from all-off and press random squares: undoing those presses solves it.
  function load(l) {
    cur = l; const rand = rng(l * 4241 + 9);
    n = l <= 15 ? 4 + (l > 5 ? 1 : 0) : l <= 35 ? 6 : 7;
    par = Math.min(n * n - 2, 2 + Math.ceil(l * 0.45));
    grid = Array.from({ length: n }, () => Array(n).fill(0));
    presses = new Set();
    while (presses.size < par) presses.add((rand() * n | 0) + ',' + (rand() * n | 0));
    presses.forEach(k => { const [x, y] = k.split(',').map(Number); flip(grid, x, y); });
    if (grid.flat().every(v => !v)) { presses.add('0,0'); flip(grid, 0, 0); }
    moves = 0; $('lvl').value = l; $('win').classList.remove('on');
    const s = Math.min(76, Math.floor((Math.min(innerWidth, innerHeight - 150) - 20) / n) - 6);
    $('board').style.setProperty('--s', s + 'px'); $('board').style.gridTemplateColumns = `repeat(${n}, auto)`;
    $('board').innerHTML = ''; btns = [];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const b = document.createElement('button'); b.setAttribute('aria-label', `Light ${x + 1}, ${y + 1}`);
      b.onclick = () => press(x, y); $('board').appendChild(b); btns.push(b);
    }
    render();
  }
  function press(x, y) {
    if ($('win').classList.contains('on')) return;
    flip(grid, x, y); moves++;
    const k = x + ',' + y; presses.has(k) ? presses.delete(k) : presses.add(k);
    render();
    if (grid.flat().every(v => !v)) {
      if (cur >= unlocked) { window.SJG && (SJG.score(cur + 1, 'levels'), cur + 1 >= 10 && SJG.unlock('l10'), cur + 1 >= LEVELS && SJG.unlock('all')); unlocked = Math.min(LEVELS, cur + 1); try { localStorage.setItem('sj-lights-unlocked', String(unlocked)); } catch {} fillSelect(); }
      $('ws').textContent = `${moves} moves (par ${par})` + (moves <= par ? ' ⭐' : '');
      $('next').textContent = cur < LEVELS ? 'Next level' : 'All done! Back to 1';
      setTimeout(() => $('win').classList.add('on'), 300);
    }
  }
  function render() {
    btns.forEach((b, i) => { b.classList.toggle('on', !!grid[i / n | 0][i % n]); b.classList.remove('hint'); });
    $('moves').textContent = moves; $('par').textContent = par;
  }
  // The squares still to press are tracked exactly, so a hint is always right.
  $('hint').onclick = () => { const k = [...presses][0]; if (!k) return; const [x, y] = k.split(',').map(Number); btns[y * n + x].classList.add('hint'); };
  function fillSelect() { $('lvl').innerHTML = ''; for (let i = 1; i <= LEVELS; i++) { const o = document.createElement('option'); o.value = i; o.disabled = i > unlocked; o.textContent = `Level ${i}` + (i < unlocked ? ' ✓' : i > unlocked ? ' 🔒' : ''); $('lvl').appendChild(o); } $('lvl').value = cur; }
  $('lvl').onchange = () => load(+$('lvl').value);
  $('reset').onclick = () => load(cur);
  $('next').onclick = () => load(cur < LEVELS ? cur + 1 : 1);
  addEventListener('keydown', e => { if (e.key === 'Enter' && $('win').classList.contains('on')) $('next').click(); });
  cur = Math.min(unlocked, LEVELS); fillSelect(); load(cur);
})();
</script>
</body></html>
