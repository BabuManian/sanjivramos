<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator</title>
<style>
html,body{margin:0;min-height:100%;background:#111827;color:#f9fafb;font:14px system-ui,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:12px;box-sizing:border-box;min-height:100vh}
.calc{width:min(92vw,320px);background:#1f2937;border-radius:18px;padding:14px;box-sizing:border-box}
#expr{min-height:20px;text-align:right;color:#9ca3af;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#disp{text-align:right;font-size:clamp(30px,10vw,44px);font-weight:300;overflow:hidden;white-space:nowrap;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{border:none;border-radius:12px;padding:0;height:58px;font:inherit;font-size:20px;background:#374151;color:#f9fafb;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.3)}
button.op{background:#f59e0b;color:#111827;font-weight:600}
button.fn{background:#4b5563}
button.eq{background:#22c55e;color:#052e16;font-weight:700}
button.wide{grid-column:span 2}
</style></head><body>
<div class="calc">
  <div id="expr"></div>
  <div id="disp">0</div>
  <div class="keys">
    <button class="fn" data-k="C">AC</button>
    <button class="fn" data-k="neg">+/−</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="/">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button>
    <button class="wide" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
</div>
<script>
(() => {
  // A small calculator: keeps the typed number, one pending operation and the running value.
  // Operations are applied left to right (like most basic calculators), never through eval().
  const disp = document.getElementById('disp'), expr = document.getElementById('expr');
  let cur = '0', acc = null, op = null, fresh = false, lastOp = null, lastB = null;
  const apply = (a, b, o) => {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b;
    }
    return b;
  };
  const fmt = v => {
    if (!isFinite(v)) return 'Error';
    if (Number.isNaN(v)) return 'Error';
    const s = String(+v.toPrecision(12));
    return s.length > 14 ? (+v).toExponential(6) : s;
  };
  const show = () => { disp.textContent = cur; expr.textContent = op ? fmt(acc) + ' ' + ({ '*': '×', '/': '÷', '-': '−' }[op] || op) : ''; };
  const input = d => {
    if (fresh) { cur = '0'; fresh = false; }
    if (d === '.') { if (!cur.includes('.')) cur += '.'; }
    else cur = cur === '0' ? d : (cur.length < 15 ? cur + d : cur);
  };
  function pressOp(o) {
    const v = parseFloat(cur);
    if (op && !fresh) { acc = apply(acc, v, op); cur = fmt(acc); if (cur === 'Error') { op = null; fresh = true; show(); return; } }
    else acc = v;
    op = o; fresh = true; lastOp = null;
    show();
  }
  function equals() {
    const v = parseFloat(cur);
    if (op) { lastOp = op; lastB = v; acc = apply(acc, v, op); }
    else if (lastOp) { acc = apply(acc, lastB, lastOp); }
    else return;
    cur = fmt(acc); op = null; fresh = true; expr.textContent = ''; disp.textContent = cur;
  }
  function press(k) {
    if (k >= '0' && k <= '9' || k === '.') input(k);
    else if (k === 'C') { cur = '0'; acc = null; op = null; fresh = false; lastOp = null; }
    else if (k === 'neg') { if (cur !== '0') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; }
    else if (k === '%') { cur = fmt(parseFloat(cur) / 100); }
    else if (k === '=') return equals();
    else if ('+-*/'.includes(k)) return pressOp(k);
    show();
  }
  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) press(b.dataset.k);
  });
  addEventListener('keydown', e => {
    const map = { '+': '+', '-': '-', '*': '*', '/': '/', Enter: '=', '=': '=', Escape: 'C', Backspace: null, '%': '%' };
    if (e.key === 'Backspace') {
      if (!fresh && cur.length > 1) cur = cur.slice(0, -1); else if (!fresh) cur = '0';
      return show();
    }
    if (/^[0-9.]$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key in map && map[e.key]) { e.preventDefault(); press(map[e.key]); }
  });
  show();
})();
</script>
</body></html>
