<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Turbo Drive 3D</title>
<style>
html,body{margin:0;height:100%;background:#0b1220;color:#e2e8f0;font:14px system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{pointer-events:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(6,10,20,.86);padding:16px;box-sizing:border-box;overflow:auto}
.ov.on{display:flex}
h1{margin:0;font-size:44px;font-style:italic;font-weight:900;background:linear-gradient(90deg,#f97316,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent}
button{font:inherit;border:none;border-radius:8px;padding:9px 14px;cursor:pointer;background:#1e293b;color:#e2e8f0}
button.sel{outline:2px solid #f97316;background:#334155}
button.pri{background:linear-gradient(90deg,#f97316,#eab308);color:#1c1917;font-weight:800;padding:12px 32px;font-size:17px}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.lbl{opacity:.7;min-width:80px;text-align:right}
.cars{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:6px}
@media (max-width:700px){.cars{grid-template-columns:repeat(2,minmax(140px,1fr))}}
.car{background:#111827;border-radius:10px;padding:8px;cursor:pointer;border:1px solid #1f2937;text-align:left}
.car.sel{border-color:#f97316}
.car .b{display:grid;grid-template-columns:62px 1fr;gap:2px 6px;font-size:11px;opacity:.85;align-items:center;margin-top:4px}
.car .b i{display:block;height:5px;border-radius:3px;background:#334155;overflow:hidden}
.car .b i::after{content:"";display:block;height:100%;width:var(--v);background:#f97316}
#touch{position:fixed;inset:0;display:none;pointer-events:none}
#touch.on{display:block}
#touch button{position:absolute;pointer-events:auto;border-radius:16px;background:rgba(255,255,255,.15);color:#fff;font-size:22px;touch-action:none;padding:0}
table{border-collapse:collapse}td{padding:4px 12px;border-bottom:1px solid #1e293b}
</style></head><body>
<canvas id="gl"></canvas><canvas id="hud"></canvas>
<div id="touch">
  <button data-k="left" style="left:14px;bottom:20px;width:80px;height:80px">◀</button>
  <button data-k="right" style="left:104px;bottom:20px;width:80px;height:80px">▶</button>
  <button data-k="gas" style="right:14px;bottom:20px;width:86px;height:110px">⬆</button>
  <button data-k="brake" style="right:110px;bottom:20px;width:70px;height:80px">⬇</button>
  <button data-k="drift" style="right:110px;bottom:110px;width:70px;height:56px;font-size:13px">DRIFT</button>
  <button data-k="item" style="right:190px;bottom:20px;width:70px;height:80px;font-size:13px">ITEM</button>
  <button data-k="pause" style="right:14px;top:14px;width:44px;height:44px;font-size:14px">II</button>
</div>
<div class="ov on" id="menu">
  <h1>TURBO DRIVE 3D</h1>
  <div class="row"><span class="lbl">Mode</span><span class="row" id="modes"></span></div>
  <div class="row"><span class="lbl">Track</span><select id="trackSel" style="font:inherit;background:#1e293b;color:#e2e8f0;border:none;border-radius:8px;padding:9px"></select><span id="seedBox" class="row"><input id="seed" type="number" min="1" style="width:90px;font:inherit;background:#1e293b;color:#e2e8f0;border:none;border-radius:8px;padding:9px" aria-label="Track seed"><button id="reroll">🎲 New</button></span></div>
  <div class="cars" id="cars"></div>
  <div class="row" id="lapsRow"><span class="lbl">Laps</span><span class="row" id="laps"></span></div>
  <div class="row"><span class="lbl">Rivals</span><span class="row" id="rivals"></span></div>
  <div class="row"><span class="lbl">Skill</span><span class="row" id="skill"></span></div>
  <div class="row"><span class="lbl">Power-ups</span><span class="row" id="pups"></span></div>
  <div class="row" id="playersRow"><span class="lbl">Players</span><span class="row" id="players"></span></div>
  <button class="pri" id="go">RACE</button>
  <div style="opacity:.65;font-size:12px;text-align:center;max-width:720px" id="helpLine"></div>
  <div id="bests" style="opacity:.6;font-size:12px"></div>
</div>
<div class="ov" id="pause"><h1>PAUSED</h1><button class="pri" id="resume">Resume</button><button id="restart">Restart race</button><button id="quit">Quit to menu</button></div>
<div class="ov" id="results"><h1 id="resT">FINISHED</h1><table id="resTable"></table><div class="row"><button class="pri" id="again">Race again</button><button id="toMenu">Menu</button></div></div>
<script src="../sj-gamekit/kit.js"></script>
<script>window.SJG && SJG.init("racer", { vs: { mode: 'time', finalModes: ['race'] }, pads: false, title: "Turbo Drive 3D", lower: true, trophies: [{"id": "win", "name": "Podium Top", "desc": "Win a race", "icon": "🏁"}, {"id": "rocket3", "name": "Sharpshooter", "desc": "Hit 3 rivals with rockets in one race", "icon": "🚀"}, {"id": "block", "name": "Bulletproof", "desc": "Block an attack with a shield", "icon": "🛡️"}, {"id": "mt10", "name": "Drift King", "desc": "Fire 10 drift boosts in one race", "icon": "💨"}, {"id": "clean", "name": "Untouchable", "desc": "Win a race with power-ups on without being hit", "icon": "✨"}, {"id": "split", "name": "Couch Racers", "desc": "Finish a 2-player split-screen race", "icon": "🎮"}, {"id": "emp", "name": "Blackout", "desc": "Hit 3+ cars with one EMP", "icon": "⚡"}] });</script>
<script>

const CARS = [
  { name: 'Roadster', color: '#ef4444', top: 52, acc: 17, grip: 1.0, turn: 1.9 },

    if (tags.length) { H.font = 'bold 15px system-ui'; H.fillStyle = '#fde047'; H.fillText(tags.join('   '), w / 2, by + (me.item ? 110 : 92)); }
    const incoming = rockets.some(r => r.tgt === me);
    if (incoming && Math.floor(performance.now() / 150) % 2) { H.font = 'bold 20px system-ui'; H.fillStyle = '#f87171'; H.fillText('⚠ ROCKET INCOMING', w / 2, h / 2 + 60); }
  }
  if (me.spinT > 0) { H.font = 'bold 30px system-ui'; H.fillStyle = '#f87171'; H.fillText('SPIN OUT!', w / 2, h / 2); }
  // minimap
  const mw = 150, mx = w - mw - 16, my = 16, sc = mw / 700;
  H.fillStyle = 'rgba(0,0,0,.4)'; H.beginPath(); H.roundRect(mx - 6, my - 6, mw + 12, mw + 12, 10); H.fill();
  H.strokeStyle = 'rgba(255,255,255,.75)'; H.lineWidth = 3; H.beginPath();
  center.forEach((p, i) => { const X = mx + mw / 2 + p[0] * sc, Y = my + mw / 2 + p[1] * sc; i ? H.lineTo(X, Y) : H.moveTo(X, Y); }); H.closePath(); H.stroke();
  if (opts.pups) for (const r of rockets) { H.fillStyle = '#ef4444'; H.fillRect(mx + mw / 2 + r.x * sc - 2, my + mw / 2 + r.z * sc - 2, 4, 4); }
  for (const c of live) { H.fillStyle = !c.ai ? (c.pnum ? '#38bdf8' : '#fb923c') : c.spec.color; H.beginPath(); H.arc(mx + mw / 2 + c.x * sc, my + mw / 2 + c.z * sc, c === me ? 5 : !c.ai ? 4.5 : 3.5, 0, 7); H.fill(); }
  if (state === 'count') { const n = Math.ceil(stateT - 0.5); H.font = 'bold 90px system-ui'; H.fillStyle = n > 0 ? '#fbbf24' : '#4ade80'; H.fillText(n > 0 && n <= 3 ? n : n <= 0 ? 'GO!' : '', w / 2, h / 2 - 40); }
  if (banner) { const by = opts.pups ? 150 : 132; H.font = 'bold 24px system-ui'; H.fillStyle = 'rgba(0,0,0,.5)'; H.fillText(banner.text, w / 2 + 2, by + 2); H.fillStyle = '#fde047'; H.fillText(banner.text, w / 2, by); }
  if (opts.mode === 1 && state === 'race') { const lead = Math.max(...cars.filter(c => c.ai).map(c => c.prog - me.prog), -1e9); if (lead > N * 0.6) { H.font = 'bold 16px system-ui'; H.fillStyle = '#fca5a5'; H.fillText(`Leader is closing in — ${Math.round((N - lead) / N * 100)}% of a lap behind you`, w / 2, 160); } }
  if (me.done) { H.font = 'bold 54px system-ui'; H.fillStyle = '#fbbf24'; H.fillText('FINISH!', w / 2, h / 2 - 60); }
  const [, d] = nearestIdx(me.x, me.z, me.idx, 5);
  if (d > ROAD_W / 2 + 25 && state === 'race') { H.font = 'bold 16px system-ui'; H.fillStyle = '#fca5a5'; H.fillText('Off course — back on the road in a moment' + (split ? '' : ' (or press R)'), w / 2, h - 110); }
}

// ---------- menus & input ----------
const $ = id => document.getElementById(id);
const isTouch = matchMedia('(pointer: coarse)').matches;
function hideAll() { document.querySelectorAll('.ov').forEach(o => o.classList.remove('on')); if (isTouch) $('touch').classList.add('on'); }
function showOv(id) { document.querySelectorAll('.ov').forEach(o => o.classList.remove('on')); $(id).classList.add('on'); $('touch').classList.remove('on'); }
function chips(el, items, cur, pick) { el.innerHTML = ''; items.forEach((l, i) => { const b = document.createElement('button'); b.textContent = l; if (i === cur) b.classList.add('sel'); b.onclick = () => pick(i); el.appendChild(b); }); }
function showMenu() {
  state = 'menu'; me = null; cars = []; showOv('menu');
  const save = () => store.set('opts', opts);
  if (opts.track > TRACKS.length) opts.track = 0;
  chips($('modes'), MODES, opts.mode, i => { opts.mode = i; if (i === 2 && opts.rivals < 3) opts.rivals = 7; save(); showMenu(); });
  $('trackSel').innerHTML = TRACKS.map((t, i) => `<option value="${i}">${i + 1}. ${t.name}</option>`).join('') + `<option value="${TRACKS.length}">🎲 Random track (endless seeds)</option>`;
  $('trackSel').value = opts.track; $('seed').value = opts.seed; $('seedBox').style.display = opts.track === TRACKS.length ? '' : 'none';
  $('trackSel').onchange = () => { opts.track = +$('trackSel').value; save(); trackMesh = null; buildTrack(opts.track); showMenu(); };
  $('seed').onchange = () => { opts.seed = Math.max(1, Math.floor(+$('seed').value || 1)); save(); trackMesh = null; buildTrack(opts.track); showMenu(); };
  $('reroll').onclick = () => { opts.seed = 1 + Math.floor(Math.random() * 99999); save(); trackMesh = null; buildTrack(opts.track); showMenu(); };
  $('lapsRow').style.display = opts.mode === 0 ? '' : 'none';
  const LAPS = [1, 3, 5, 10, 20], RIV = [0, 3, 5, 7, 11, 15, 19];
  chips($('laps'), LAPS.map(String), LAPS.indexOf(opts.laps), i => { opts.laps = LAPS[i]; save(); showMenu(); });
  chips($('rivals'), RIV.map(String), RIV.indexOf(opts.rivals), i => { opts.rivals = RIV[i]; save(); showMenu(); });
  chips($('skill'), SKILLS.map(s => s[0]), opts.skill, i => { opts.skill = i; save(); showMenu(); });
  if (opts.pups == null) opts.pups = 1; if (!opts.players) opts.players = 1; if (opts.car2 == null) opts.car2 = 1;
  chips($('pups'), ['On', 'Off'], opts.pups ? 0 : 1, i => { opts.pups = i ? 0 : 1; save(); showMenu(); });
  $('playersRow').style.display = opts.mode === 0 ? '' : 'none';
  chips($('players'), ['1 Player', '2 Players · split screen'], opts.players === 2 ? 1 : 0, i => { opts.players = i + 1; save(); showMenu(); });
  const two = opts.players === 2 && opts.mode === 0;
  $('helpLine').innerHTML = two
    ? '<b style="color:#fb923c">P1</b> W/S gas &amp; brake · A/D steer · Space drift · E item &nbsp;|&nbsp; <b style="color:#38bdf8">P2</b> ↑/↓ · ←/→ · Right Shift or . drift · Enter or / item<br>Gamepads: 1st pad = P1, 2nd pad = P2 (RT gas · LT brake · RB drift · LB item). Click a car for P1, right-click (or long-press) for P2. C camera · Esc pause'
    : '↑/W gas · ↓/S brake &amp; reverse · ←/→ or A/D steer · Space/Shift drift (hold, then let go for a boost) · E item · C camera · R reset · Esc pause' + (opts.pups ? '<br>Drive through the glowing boxes for power-ups: 🔥 Nitro · 🚀 Homing Rocket · 🛢️ Oil · 📌 Spikes · 🛡️ Shield · ⚡ EMP · 👻 Phase. The further behind you are, the better the item.' : '');
  const bar = (l, v) => `<span>${l}</span><i style="--v:${v}%"></i>`;
  $('cars').innerHTML = '';
  CARS.forEach((c, i) => { const d = document.createElement('div'); d.className = 'car' + (i === opts.car ? ' sel' : ''); if (two && i === opts.car2) d.style.boxShadow = 'inset 0 0 0 2px #38bdf8'; d.innerHTML = `<b style="color:${c.color}">■</b> <b>${c.name}</b>${two ? (i === opts.car ? ' <small style="color:#fb923c">P1</small>' : '') + (i === opts.car2 ? ' <small style="color:#38bdf8">P2</small>' : '') : ''}<div class="b">${bar('Top speed', c.top / 64 * 100)}${bar('Accel', c.acc / 24 * 100)}${bar('Handling', c.turn / 2.5 * 100)}${bar('Grip', c.grip / 1.3 * 100)}</div>`; d.onclick = () => { opts.car = i; store.set('opts', opts); showMenu(); }; d.oncontextmenu = e => { e.preventDefault(); opts.car2 = i; store.set('opts', opts); showMenu(); }; let lp; d.addEventListener('touchstart', () => { lp = setTimeout(() => { opts.car2 = i; store.set('opts', opts); showMenu(); }, 550); }, { passive: true }); d.addEventListener('touchend', () => clearTimeout(lp)); $('cars').appendChild(d); });
  const tn = trackDef(opts.track).name, key = tn + '|' + opts.laps, ek = 'mode1|' + tn;
  $('bests').textContent = opts.mode === 0 ? (bests[key] ? `Track record (${opts.laps} lap${opts.laps > 1 ? 's' : ''}): ${fmt(bests[key])}` : '') : opts.mode === 1 ? (bests[ek] ? `Endless best on ${tn}: ${bests[ek]} laps` : 'Endless: rivals get 3% faster every lap. You’re out when someone laps you.') : 'Elimination: last place is knocked out every lap until one car is left.';
}
$('go').onclick = startRace;
$('resume').onclick = () => { state = prevState; hideAll(); };
$('restart').onclick = startRace;
$('quit').onclick = showMenu; $('toMenu').onclick = showMenu; $('again').onclick = startRace;
let prevState = 'race';
function pause() { if (state !== 'race' && state !== 'count') return; prevState = state; state = 'paused'; showOv('pause'); }
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Slash', 'Enter'].includes(e.code) && state !== 'menu') e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') pause();
  if (e.code === 'KeyC') { camMode = (camMode + 1) % 3; cam = null; for (const c of cars) c.cam = null; }
  if (e.code === 'KeyR' && me && state === 'race') resetCar(me);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'race') pause(); });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); if (k === 'pause') pause(); else tk[k] = true; });
  const up = () => { tk[k] = false; }; b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
});
window.__racer = () => ({ items: cars.map(c => c.item || '-').join(','), rockets: rockets.length, hazards: hazards.length, boxes: boxes.filter(b => b.t <= 0).length + '/' + boxes.length, pads: pads.length, spins: cars.reduce((a, c) => a + c.hitsTaken, 0), used: cars.reduce((a, c) => a + c.itemsUsed, 0), mts: cars.reduce((a, c) => a + c.mtCount, 0), split, humans: humans.map(h => h.name + ':' + h.lap + (h.done ? '✓' : '')).join(' '), state, raceT: +raceT.toFixed(1), elimLap, endlessLaps, banner: banner && banner.text, res: document.getElementById('resT').textContent, cars: cars.map(c => `${c.name}:${c.lap}/${c.prog}/${Math.round(c.speed)}${c.out ? '✝' : ''}`) });
let last = performance.now();
window.__racerStep = (n, fn) => { for (let i = 0; i < n; i++) { if (fn) fn(); update(1 / 60); } return window.__racer(); };
window.__racerDbg = () => ({ cars, me, me2, boxes, pads, PU, opts, rollItem, useItem, spinOut, myInput });
let padStart = false;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const gp = padInput(0), st = !!(gp && gp.start) || !!(padInput(1) && padInput(1).start);
  if (st && !padStart) { if (state === 'race' || state === 'count') pause(); else if (state === 'paused') { state = prevState; hideAll(); } else if (state === 'menu' || state === 'results') startRace(); }
  padStart = st;
  const steps = Math.ceil(dt / 0.0167); for (let i = 0; i < steps; i++) update(dt / steps);
  render(); requestAnimationFrame(frame);
}
buildTrack(opts.track); showMenu(); requestAnimationFrame(frame);
})();
</script>
