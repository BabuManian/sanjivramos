<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kush Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#fa2d48;--red2:#ff4e62;--bg:#ffffff;--bg2:#f5f5f7;--side:rgba(242,242,247,.78);--card:#fff;--text:#1d1d1f;--text2:rgba(60,60,67,.62);--text3:rgba(60,60,67,.35);
  --line:rgba(60,60,67,.14);--hover:rgba(0,0,0,.045);--sel:rgba(0,0,0,.07);--bar:rgba(250,250,252,.82);--shadow:0 6px 22px rgba(0,0,0,.12);--artsh:0 10px 30px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",system-ui,sans-serif;color-scheme:light}
:root[data-dark]{--bg:#1c1c1e;--bg2:#2c2c2e;--side:rgba(30,30,32,.8);--card:#2c2c2e;--text:#f5f5f7;--text2:rgba(235,235,245,.6);--text3:rgba(235,235,245,.3);--line:rgba(84,84,88,.55);--hover:rgba(255,255,255,.06);--sel:rgba(255,255,255,.1);--bar:rgba(36,36,38,.82);--shadow:0 6px 22px rgba(0,0,0,.45);--artsh:0 12px 34px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--text3);border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
#app{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:62px minmax(0,1fr);height:100%}
/* ---------- sidebar ---------- */
#side{grid-row:1/3;background:var(--side);backdrop-filter:saturate(1.8) blur(30px);-webkit-backdrop-filter:saturate(1.8) blur(30px);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;padding:20px 20px 12px;font:700 19px/1 var(--font);letter-spacing:-.02em}
.brand .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(160deg,#ff5e72,#fa2d48 55%,#d90f2f);display:grid;place-items:center;box-shadow:0 2px 8px rgba(250,45,72,.35)}
.brand .logo svg{width:16px;height:16px;color:#fff}
.sbox{margin:4px 16px 10px;display:flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:9px;background:var(--sel)}
.sbox svg{width:15px;height:15px;color:var(--text2)}
.sbox input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:14px}
.sbox input::placeholder{color:var(--text2)}
#nav{flex:1;overflow:auto;padding:0 10px 18px}
.nh{font-size:11px;font-weight:600;color:var(--text2);margin:16px 10px 5px;letter-spacing:.02em}
.ni{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni svg{width:19px;height:19px;color:var(--red)}
.ni:hover{background:var(--hover)}
.ni.on{background:var(--sel);font-weight:600}
.ni span{overflow:hidden;text-overflow:ellipsis}
/* ---------- player bar ---------- */
#bar{grid-column:2;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--bar);backdrop-filter:saturate(1.8) blur(26px);-webkit-backdrop-filter:saturate(1.8) blur(26px);border-bottom:1px solid var(--line);z-index:6;min-width:0}
.ctl{display:flex;align-items:center;gap:6px}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:background .15s,transform .1s}
.ib:hover{background:var(--hover)}.ib:active{transform:scale(.9)}
.ib svg{width:20px;height:20px}
.ib.big svg{width:26px;height:26px}
.ib.sm svg{width:16px;height:16px}
.ib.on{color:var(--red)}
.ib[disabled]{opacity:.3;pointer-events:none}
#lcd{flex:1;min-width:0;max-width:560px;margin:0 auto;height:46px;border-radius:7px;background:var(--hover);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-right:12px;position:relative;overflow:hidden}
#lcd .art{width:46px;height:46px;flex:none;background:var(--sel);cursor:pointer;object-fit:cover}
#lcd .meta{flex:1;min-width:0;text-align:center;cursor:pointer}
#lcd .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lcd .a{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lcd .empty{flex:1;display:grid;place-items:center;color:var(--text3)}
#lcd .empty svg{width:22px;height:22px}
#lcdBar{position:absolute;left:46px;right:0;bottom:0;height:3px;cursor:pointer}
#lcdBar i{display:block;height:100%;background:var(--text2);width:0}
#lcd .tm{font-size:10.5px;color:var(--text2);font-variant-numeric:tabular-nums;width:34px;text-align:right}
#lcd .tm.l{text-align:left}
.right{display:flex;align-items:center;gap:4px}
.vol{display:flex;align-items:center;gap:6px;color:var(--text2)}
.vol svg{width:15px;height:15px}
input[type=range].sl{-webkit-appearance:none;appearance:none;width:92px;height:4px;border-radius:4px;background:linear-gradient(var(--text2),var(--text2)) 0/var(--p,50%) 100% no-repeat var(--sel);outline:none;cursor:pointer}
input[type=range].sl::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);border:none}
input[type=range].sl::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:none;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:4px;background:var(--red);color:#fff;margin-left:6px;vertical-align:1px}
/* ---------- main ---------- */
#main{grid-column:2;overflow:auto;position:relative;scroll-behavior:auto}
#page{padding:26px 34px 120px;max-width:1500px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.navb{display:flex;gap:6px;margin:-8px 0 8px;position:relative;z-index:3}
.ava{width:100%;height:100%;display:grid;place-items:center;color:#fff;font:700 clamp(28px,4vw,52px)/1 var(--font);letter-spacing:-.02em}
.arh .covers{position:absolute;right:120px;top:40px;width:300px;height:230px}
.arh .covers img{position:absolute;width:170px;height:170px;border-radius:10px;object-fit:cover;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.arh .covers img:nth-child(1){right:0;top:24px;transform:rotate(8deg)}.arh .covers img:nth-child(2){right:110px;top:0;transform:rotate(-6deg);z-index:1}.arh .covers img:nth-child(3){right:60px;top:60px;z-index:2}
@media (max-width:760px){.arh .covers{right:10px;top:30px;transform:scale(.6);transform-origin:top right}}
.navb .ib{width:30px;height:30px;background:var(--hover)}
h1.pt{font:700 34px/1.1 var(--font);letter-spacing:-.025em;margin:4px 0 22px}
.shelf{margin:0 0 34px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px;border-top:1px solid var(--line);padding-top:16px}
.sh h2{margin:0;font:700 21px/1.2 var(--font);letter-spacing:-.02em;display:flex;align-items:center;gap:4px}
.sh h2 svg{width:15px;height:15px;color:var(--text2)}
.sh .more{color:var(--red);font-size:14px;font-weight:500}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:var(--cw,176px);gap:20px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;min-width:0;text-align:left;cursor:pointer}
.cart{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--sel);box-shadow:var(--shadow)}
.cart.round{border-radius:50%}
.cart img{width:100%;height:100%;object-fit:cover;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card:hover .cart img{transform:scale(1.04)}
.cart .pb{position:absolute;left:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(30,30,30,.55);backdrop-filter:blur(12px);display:grid;place-items:center;color:#fff;opacity:0;transform:scale(.85);transition:.18s}
.cart .pb svg{width:15px;height:15px;margin-left:2px}
.card:hover .pb{opacity:1;transform:none}
.cart .pb:hover{background:var(--red)}
.ct{margin-top:8px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round+.ct,.card.artist .ct{text-align:center}.card.artist .cs{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,170px),1fr));gap:26px 20px}
/* hero cards */
.heros{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);gap:20px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.heros::-webkit-scrollbar{display:none}
.hero{position:relative;height:300px;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);color:#fff;text-align:left;isolation:isolate}
.hero .bgimg{position:absolute;inset:-30%;width:160%;height:160%;object-fit:cover;filter:blur(40px) saturate(1.6) brightness(.8);z-index:-2}
.hero .fg{position:absolute;right:20px;top:20px;width:150px;height:150px;border-radius:8px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.hero .tag{font-size:11px;font-weight:700;letter-spacing:.05em;opacity:.85;text-transform:uppercase}
.hero .tx{position:absolute;left:20px;right:20px;bottom:20px}
.hero h3{margin:4px 0 4px;font:700 24px/1.15 var(--font);letter-spacing:-.02em;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero p{margin:0;opacity:.85;font-size:13px}
/* song lists */
.songs{border-top:1px solid var(--line)}
.sr{display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,1fr) 60px 34px;align-items:center;gap:14px;height:56px;padding:0 10px;border-radius:8px;cursor:default;position:relative}
.sr:after{content:"";position:absolute;left:68px;right:10px;bottom:0;border-bottom:1px solid var(--line)}
.sr:hover{background:var(--hover)}
.sr.playing .st{color:var(--red)}
.sr .sa{position:relative;width:44px;height:44px;border-radius:5px;overflow:hidden;background:var(--sel)}
.sr .sa img{width:100%;height:100%;object-fit:cover}
.sr .sa .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.4);color:#fff;opacity:0}
.sr:hover .sa .ov,.sr.playing .sa .ov{opacity:1}
.sr .sa .ov svg{width:16px;height:16px}
.sr .num{width:44px;text-align:center;color:var(--text2);font-variant-numeric:tabular-nums}
.sr .st{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .ss{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .ss a,.sr .sal a{cursor:pointer}.sr .ss a:hover,.sr .sal a:hover{text-decoration:underline}
.sr .sal{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .sd{font-size:13px;color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.sr .more{opacity:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--red)}
.sr:hover .more,.sr .more.lk{opacity:1}
.sr .more svg{width:18px;height:18px}
.ex{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:3px;background:var(--text3);color:var(--bg);font-size:9px;font-weight:800;margin-left:6px;vertical-align:1px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--red);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.chart .sr{grid-template-columns:30px 44px minmax(0,1.6fr) minmax(0,1fr) 60px 34px}
.chart .sr:after{left:94px}
.rank{font-weight:600;color:var(--text2);text-align:center;font-variant-numeric:tabular-nums}
/* album / playlist header */
.ah{display:flex;gap:34px;align-items:flex-end;margin:8px 0 28px}
.ah .big{width:270px;height:270px;flex:none;border-radius:10px;box-shadow:var(--artsh);object-fit:cover;background:var(--sel)}
.ah .big.round{border-radius:50%}
.ah .info{min-width:0;padding-bottom:6px}
.ah h1{margin:0;font:700 30px/1.12 var(--font);letter-spacing:-.025em}
.ah .by{font-size:22px;color:var(--red);margin:3px 0 4px;font-weight:400;cursor:pointer}
.ah .by:hover{text-decoration:underline}
.ah .meta{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.ah .desc{font-size:13px;color:var(--text2);margin-top:10px;max-width:560px;line-height:1.5}
.acts{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;min-width:110px;padding:0 18px;border-radius:9px;background:var(--red);color:#fff;font-weight:600;font-size:14px;transition:filter .15s,transform .1s}
.pill:hover{filter:brightness(1.08)}.pill:active{transform:scale(.97)}
.pill.ghost{background:var(--sel);color:var(--red)}
.pill svg{width:15px;height:15px}
.foot{font-size:12px;color:var(--text2);margin:18px 10px;line-height:1.6}
/* browse tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.tile{height:130px;border-radius:12px;position:relative;overflow:hidden;color:#fff;text-align:left;padding:16px;font:700 20px/1.1 var(--font);letter-spacing:-.02em;box-shadow:var(--shadow);transition:transform .2s}
.tile:hover{transform:translateY(-2px)}
.tile img{position:absolute;right:-14px;bottom:-14px;width:96px;height:96px;border-radius:8px;transform:rotate(18deg);box-shadow:0 6px 18px rgba(0,0,0,.35)}
/* artist hero */
.arh{position:relative;height:340px;margin:-64px -34px 26px;overflow:hidden;display:flex;align-items:flex-end;padding:0 34px 26px;color:#fff;isolation:isolate}
.arh .bgimg{position:absolute;inset:-20%;width:140%;height:140%;object-fit:cover;filter:blur(50px) saturate(1.7) brightness(.65);z-index:-2}
.arh:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.45));z-index:-1}
.arh h1{margin:0;font:800 52px/1 var(--font);letter-spacing:-.03em;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.arh .pp{position:absolute;right:34px;bottom:28px;width:52px;height:52px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 6px 20px rgba(250,45,72,.5)}
.arh .pp svg{width:22px;height:22px;margin-left:3px}
/* search */
.chips{display:flex;gap:8px;margin:-8px 0 22px;flex-wrap:wrap}
.chip{height:30px;padding:0 14px;border-radius:15px;background:var(--sel);font-weight:500;font-size:13px}
.chip.on{background:var(--text);color:var(--bg)}
.top{display:grid;grid-template-columns:minmax(260px,.8fr) 1.5fr;gap:24px;margin-bottom:34px}
.topres{border-radius:12px;background:var(--bg2);padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:220px;cursor:pointer;transition:background .2s}
.topres:hover{background:var(--sel)}
.topres img{width:110px;height:110px;border-radius:8px;object-fit:cover;box-shadow:var(--shadow)}
.topres img.round{border-radius:50%}
.topres b{font-size:24px;letter-spacing:-.02em}
.empty{text-align:center;color:var(--text2);padding:70px 20px}
.empty svg{width:52px;height:52px;margin:0 auto 14px;color:var(--text3)}
.empty h3{color:var(--text);font-size:20px;margin:0 0 6px}
.sk{background:linear-gradient(90deg,var(--sel),var(--hover),var(--sel));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:9px}
@keyframes sk{from{background-position:200% 0}to{background-position:0 0}}
/* ---------- now playing (full screen) ---------- */
#np{position:fixed;inset:0;z-index:20;color:#fff;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1);overflow:hidden;background:#111}
#np.open{transform:none}
#np .bg{position:absolute;inset:-25%;z-index:-1;overflow:hidden}
#np .bg img{position:absolute;width:75%;height:75%;object-fit:cover;filter:blur(70px) saturate(1.9);opacity:.9;animation:drift 38s linear infinite}
#np .bg img:nth-child(1){left:0;top:0}#np .bg img:nth-child(2){right:0;bottom:0;animation-direction:reverse;animation-duration:52s}#np .bg img:nth-child(3){left:20%;top:25%;opacity:.6;animation-duration:70s}
@keyframes drift{from{transform:rotate(0) scale(1.1)}to{transform:rotate(360deg) scale(1.1)}}
#np .dim{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:-1}
.npt{display:flex;justify-content:center;padding:14px 18px 0;position:relative}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.45);margin:4px auto}
.npx{position:absolute;right:18px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.npx svg{width:16px;height:16px}
.npb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:40px;padding:10px 40px 30px;align-items:center;max-width:1300px;width:100%;margin:0 auto}
#np.side .npb{grid-template-columns:minmax(300px,480px) minmax(0,1fr)}
.npl{display:flex;flex-direction:column;align-items:center;gap:20px;min-width:0;max-width:480px;width:100%;margin:0 auto}
.npart{width:min(100%,46vh);aspect-ratio:1;border-radius:12px;object-fit:cover;box-shadow:0 26px 60px rgba(0,0,0,.45);transition:transform .5s cubic-bezier(.3,1.5,.5,1);background:rgba(255,255,255,.1)}
#np.paused .npart{transform:scale(.82)}
.npm{width:100%;display:flex;align-items:center;gap:10px}
.npm .tx{flex:1;min-width:0}
.npm .t{font:700 21px/1.25 var(--font);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npm .a{font-size:18px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.npm .ib{background:rgba(255,255,255,.14);color:#fff}
.npm .ib.on{color:#fff;background:var(--red)}
.scr{width:100%}
.scr .track{height:7px;border-radius:4px;background:rgba(255,255,255,.22);position:relative;cursor:pointer;transition:height .15s}
.scr .track:hover{height:10px}
.scr .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:rgba(255,255,255,.88)}
.scr .track b{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:rgba(255,255,255,.2)}
.scr .tms{display:flex;justify-content:space-between;font-size:12px;opacity:.6;margin-top:7px;font-variant-numeric:tabular-nums;font-weight:500}
.scr .tms .q{font-size:10px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.16)}
.npc{display:flex;align-items:center;justify-content:center;gap:34px;width:100%}
.npc .ib{color:#fff;width:56px;height:56px}
.npc .ib svg{width:34px;height:34px}
.npc .ib.pp svg{width:46px;height:46px}
.npc .ib.sm{width:40px;height:40px}.npc .ib.sm svg{width:20px;height:20px}
.npc .ib.sm{opacity:.6}.npc .ib.sm.on{opacity:1;color:#fff;background:rgba(255,255,255,.18)}
.npv{display:flex;align-items:center;gap:12px;width:100%;opacity:.75}
.npv svg{width:16px;height:16px}
.npv input{flex:1;width:auto}
.npv input[type=range].sl{background:linear-gradient(#fff,#fff) 0/var(--p,50%) 100% no-repeat rgba(255,255,255,.25);height:6px}
.npo{display:flex;justify-content:space-around;width:100%}
.npo .ib{color:#fff;opacity:.7;width:44px;height:44px}
.npo .ib.on{opacity:1;background:rgba(255,255,255,.18)}
.npmini{display:none;align-items:center;gap:12px;padding:6px 4px 10px}
#np:not(.side) .npmini{display:flex}
.npmini img{width:52px;height:52px;border-radius:7px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.35)}

#np.side .npr{display:flex}
#np:not(.side).panel .npl{display:none}
#np:not(.side).panel .npr{display:flex}

#lyr{flex:1;overflow:auto;padding:30vh 6px 40vh;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent)}

#lyr p:hover{color:rgba(255,255,255,.55)}
#lyr p.on{color:#fff;filter:none;transform:scale(1.02)}
#lyr p.past{color:rgba(255,255,255,.42)}
#lyr.plain p{font-size:22px;color:rgba(255,255,255,.85);filter:none;cursor:default;margin-bottom:10px}

#lyr .dots.on i{animation:dot 1.6s ease-in-out infinite}#lyr .dots.on i:nth-child(2){animation-delay:.2s}#lyr .dots.on i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{background:#fff;transform:scale(1.25)}}
.lmsg{margin:auto;text-align:center;opacity:.6;font-size:17px;font-weight:600}

#queue{flex:1;overflow:auto;padding:6px 0 30px}

.qr img{width:42px;height:42px;border-radius:5px;object-fit:cover;background:rgba(255,255,255,.1)}
.qr .tx{flex:1;min-width:0}
.qr .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#menu button svg{width:16px;height:16px}
#menu hr{border:none;border-top:1px solid var(--line);margin:4px 6px}

      const total = pl.songs.reduce((s, t) => s + (t.dur || 0), 0);
      set(`<div class="ah"><div class="big" style="overflow:hidden;display:block">${plCover(pl)}</div><div class="info"><h1>${esc(pl.name)}</h1><div class="by" style="cursor:default">You</div><div class="meta">${pl.songs.length} songs · ${Math.round(total / 60)} min</div><div class="acts"><button class="pill" data-act="p" ${pl.songs.length ? '' : 'disabled'}>${I('play')}Play</button><button class="pill ghost" data-act="s">${I('shuffle')}Shuffle</button><button class="pill ghost" data-act="ren" style="min-width:0">Rename</button><button class="pill ghost" data-act="del" style="min-width:0">${I('trash')}</button></div></div></div>
        ${pl.songs.length ? `<div data-list="l" data-title="${esc(pl.name)}">${songRows(pl.songs)}</div>` : emptyLib('playlist', 'Add songs with the ⋯ → Add to a Playlist menu, anywhere in Music.')}`);
      bindLists(page, { l: pl.songs });
      actions.p = () => setQueue(pl.songs, 0, pl.name); actions.s = () => { if (!pl.songs.length) return; Q.shuffle = true; setQueue(pl.songs, (Math.random() * pl.songs.length) | 0, pl.name); };
      actions.ren = () => { const n = prompt('Rename playlist', pl.name); if (n && n.trim()) { pl.name = n.trim().slice(0, 60); save(); render(); renderNav(); } };
      actions.del = () => { if (!confirm(`Delete “${pl.name}”?`)) return; D.playlists = D.playlists.filter(p => p !== pl); save(); renderNav(); go({ v: 'playlists' }, { replace: true }); };
    }
  } catch (e) {
    set(`<div class="empty">${I('note')}<h3>Can’t connect</h3>${esc(e.message || 'The music catalog didn’t answer.')}<br><br><button class="pill" id="retry">Try Again</button></div>`);
    const r = $('#retry'); if (r) r.onclick = render;
  }
}
function plCover(pl) { const arts = [...new Set(pl.songs.map(s => coverOf(s, 300)).filter(Boolean))].slice(0, 4); if (arts.length >= 4) return `<div style="display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%">${arts.map(a => `<img src="${esc(a)}" alt="" style="width:100%;height:100%;object-fit:cover">`).join('')}</div>`; if (arts[0]) return `<img src="${esc(arts[0])}" alt="" style="width:100%;height:100%;object-fit:cover">`; return `<div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#ff5e72,#fa2d48);color:#fff">${I('playlist', 'style="width:40%;height:40%"')}</div>`; }
const emptyLib = (ic, txt) => `<div class="empty">${I(ic)}<h3>Nothing here yet</h3>${esc(txt)}</div>`;
function bindQ2() { const q2 = $('#q2'); if (!q2) return; let t = 0; q2.oninput = () => { clearTimeout(t); t = setTimeout(() => { const s = q2.value.trim(); route = { v: 'search', q: s, k: route.k }; const pos = q2.selectionStart; render().then(() => { const n = $('#q2'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); }, 320); }; }

/* ======================= keyboard ======================= */
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight' && (e.metaKey || e.ctrlKey)) next(); else if (e.key === 'ArrowLeft' && (e.metaKey || e.ctrlKey)) prev();
  else if (e.key === 'ArrowRight') au.currentTime += 10; else if (e.key === 'ArrowLeft') au.currentTime -= 10;
  else if (e.key === 'ArrowUp') { e.preventDefault(); vol.value = Math.min(1, +vol.value + 0.05); vol.oninput(); } else if (e.key === 'ArrowDown') { e.preventDefault(); vol.value = Math.max(0, +vol.value - 0.05); vol.oninput(); }
  else if (e.key === 'Escape') { if ($('#np').classList.contains('open')) closeNP(); }
  else if (e.key === 'l') openNP('lyrics'); else if (e.key === 'f' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#q').focus(); }
  else if (e.key === '/' ) { e.preventDefault(); if (innerWidth <= 760) go({ v: 'search' }); else $('#q').focus(); }
});
addEventListener('resize', () => { if ($('#np').classList.contains('open')) renderNP(); });

/* ======================= start ======================= */
renderNav(); renderNow(); renderPlayState(); render();
ytApi('status').catch(() => {}).finally(() => { if (route.v === 'home' && ytState === 'signin') render(); });
window.__music = { get Q() { return Q; }, get cur() { return cur; }, get D() { return D; }, get LY() { return LY; }, setQueue, playAt, next, prev, resolveYt, scoreYt, go, openNP, closeNP, toggle, get route() { return route; }, chartSongs, albumTracks, artistInfo, searchIt, fromIt, loadLyrics, au };
})();
</script>
