<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Strike</title>
<style>
html,body{margin:0;height:100%;background:#05060f;color:#e5e7eb;font:14px system-ui,sans-serif;overflow:hidden;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;height:100%;max-width:100%;aspect-ratio:480/720}
canvas{width:100%;height:100%;display:block;touch-action:none;background:#000}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,10,.7);text-align:center}
#ov[hidden]{display:none}
#ov h1{font-size:34px;margin:0 0 6px;letter-spacing:2px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
#ov p{opacity:.8;margin:4px 0 12px}
button{border:none;background:#7c3aed;color:#fff;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;margin:3px}
button.alt{background:#1e293b}
.hint{font-size:12px;opacity:.6}
#mute{position:absolute;top:6px;right:6px;background:rgba(30,41,59,.7);padding:4px 8px;font-size:14px}
.ships{display:flex;gap:6px;justify-content:center;margin:8px 0}
.ship{background:#111827;border:2px solid transparent;border-radius:10px;padding:6px 10px;font-size:12px}
.ship.on{border-color:#a78bfa}
</style></head><body>
<div id="wrap"><div id="stage"><canvas id="c" width="480" height="720"></canvas><button id="mute">🔊</button>
  <div id="ov"><div>
    <h1>NOVA STRIKE</h1><p id="ovt">Blast through 8 sectors of alien fleets.<br>Each sector ends with a boss.</p>
    <div class="ships" id="ships"></div>
    <button id="go">Launch</button><button class="alt" id="endless">Endless mode</button>
    <p class="hint">Move: arrows / WASD / drag · Fire is automatic · Bomb: Space or double-tap · Pause: P</p>
    <p class="hint" id="best"></p>
  </div></div>
</div></div>
<script src="../sj-gamekit/kit.js"></script>
<script>
(() => {
  const W = 480, H = 720, cv = document.getElementById('c'), g = cv.getContext('2d'), $ = id => document.getElementById(id);
  const kit = window.SJG ? SJG.init('shooter', { vs: { live: () => window.__shooter && __shooter().score }, title: 'Nova Strike', trophies: [
    { id: 'boss1', name: 'Boss Breaker', desc: 'Defeat your first boss', icon: '💥' },
    { id: 'sector4', name: 'Deep Space', desc: 'Reach sector 4', icon: '🌌' },
    { id: 'clear', name: 'Nova Hero', desc: 'Clear all 8 sectors', icon: '🌟' },
    { id: 'maxpow', name: 'Full Power', desc: 'Max out your weapon', icon: '⚡' },
    { id: 'combo50', name: 'Chain Reaction', desc: 'Reach a 50× combo', icon: '🔗' },
    { id: 'nobomb', name: 'Pacifist Bomber', desc: 'Beat a boss without using a bomb that sector', icon: '🕊️' },
    { id: 'score100k', name: 'Six Figures', desc: 'Score 100,000 points', icon: '💯' },
  ] }) : null;
  const sfx = n => kit && kit.sfx(n);
  const SHIPS = [
    { name: 'Falcon', col: '#22d3ee', speed: 330, fire: 0.09, hp: 3, desc: 'Balanced' },
    { name: 'Hornet', col: '#facc15', speed: 400, fire: 0.07, hp: 2, desc: 'Fast, fragile' },
    { name: 'Titan', col: '#f472b6', speed: 260, fire: 0.11, hp: 5, desc: 'Slow, tough' },
  ];
  let shipSel = 0;
  $('ships').innerHTML = SHIPS.map((s, i) => `<div class="ship${i ? '' : ' on'}" data-i="${i}" style="cursor:pointer"><b style="color:${s.col}">${s.name}</b><br>${s.desc}</div>`).join('');
  $('ships').onclick = e => { const d = e.target.closest('.ship'); if (!d) return; shipSel = +d.dataset.i; document.querySelectorAll('.ship').forEach(x => x.classList.toggle('on', x === d)); sfx('click'); };

  let P, bullets, ebullets, enemies, pickups, parts, stars, score, combo, comboT, sector, sectorT, wave, boss, state = 'menu', endless = false, bombs, lives, paused = false, shake = 0, bombUsedThisSector;
  const keys = {};
  stars = Array.from({ length: 120 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() }));

  function start(isEndless) {
    endless = isEndless;
    const s = SHIPS[shipSel];
    P = { x: W / 2, y: H - 90, r: 10, pow: 1, cd: 0, inv: 2, ship: s, tx: null, ty: null };
    lives = s.hp; bombs = 3; score = 0; combo = 0; comboT = 0; sector = 1;
    bullets = []; ebullets = []; enemies = []; pickups = []; parts = [];
    startSector();
    state = 'play'; $('ov').hidden = true; sfx('power');
  }
  function startSector() { between = false; sectorT = 0; wave = 0; boss = null; bombUsedThisSector = false; banner = { text: endless ? `WAVE ${sector}` : `SECTOR ${sector}`, t: 2.2 }; if (sector >= 4) kit && kit.unlock('sector4'); }
  let banner = null, between = false;

  /* ---------- enemies ---------- */
  const diff = () => 1 + (sector - 1) * 0.22;
  function spawnWave() {
    wave++;
    const k = Math.random() * 6 | 0, d = diff();
    if (k === 0) for (let i = 0; i < 6; i++) enemies.push(mk('dart', 60 + i * 72, -40 - i * 30, { vy: 160 * d }));
    else if (k === 1) for (let i = 0; i < 8; i++) enemies.push(mk('wave', -30 - i * 45, 120, { vx: 160, ph: i * .5 }));
    else if (k === 2) for (let i = 0; i < 3; i++) enemies.push(mk('tank', 100 + i * 140, -60 - i * 40, { vy: 60 }));
    else if (k === 3) for (let i = 0; i < 5; i++) enemies.push(mk('spinner', W / 2 + (i - 2) * 80, -40 - Math.abs(i - 2) * 40, { vy: 100 }));
    else if (k === 4) for (let i = 0; i < 10; i++) enemies.push(mk('swarm', Math.random() * W, -30 - Math.random() * 300, { vy: 140 + Math.random() * 80 }));
    else { enemies.push(mk('sniper', 80, -40, { vy: 90 })); enemies.push(mk('sniper', W - 80, -40, { vy: 90 })); for (let i = 0; i < 4; i++) enemies.push(mk('dart', 140 + i * 66, -100, { vy: 180 * d })); }
  }
  const STATS = {
    dart: { hp: 2, r: 13, pts: 100, col: '#f87171' }, wave: { hp: 2, r: 12, pts: 120, col: '#fb923c' }, tank: { hp: 14, r: 22, pts: 500, col: '#a3e635' },
    spinner: { hp: 5, r: 15, pts: 250, col: '#c084fc' }, swarm: { hp: 1, r: 9, pts: 60, col: '#fbbf24' }, sniper: { hp: 6, r: 15, pts: 300, col: '#38bdf8' },
  };
  function mk(type, x, y, o) { const s = STATS[type]; return { type, x, y, vx: 0, vy: 0, t: 0, hp: Math.ceil(s.hp * (1 + (sector - 1) * .15)), r: s.r, pts: s.pts, col: s.col, cd: 1 + Math.random() * 1.5, ...o }; }
  function makeBoss() {
    const n = (sector - 1) % 4, hp = 220 + sector * 90;
    boss = { x: W / 2, y: -120, ty: 130, r: 60, hp, max: hp, t: 0, phase: 0, kind: n, cd: 1, name: ['Dreadnought', 'Hive Queen', 'Prism Core', 'The Warden'][n], col: ['#ef4444', '#eab308', '#22d3ee', '#a855f7'][n] };
    banner = { text: '⚠ ' + boss.name.toUpperCase(), t: 2.2 };
    sfx('boom');
  }
  function ebullet(x, y, a, sp, col = '#f472b6', r = 5) { ebullets.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r, col }); }
  const aimA = (x, y) => Math.atan2(P.y - y, P.x - x);

  function updateEnemy(e, dt) {
    e.t += dt; e.cd -= dt;
    const d = diff();
    switch (e.type) {
      case 'dart': e.y += e.vy * dt; break;
      case 'wave': e.x += e.vx * dt; e.y = 120 + Math.sin(e.t * 2 + e.ph) * 60 + e.t * 30; if (e.x > W + 40) e.x = -40; break;
      case 'tank': e.y = Math.min(e.y + e.vy * dt, 160); if (e.cd <= 0) { for (let i = -2; i <= 2; i++) ebullet(e.x, e.y + 20, Math.PI / 2 + i * .25, 170 * d, '#bef264'); e.cd = 2.2 / d; } if (e.t > 12) e.y += 120 * dt; break;
      case 'spinner': e.y += e.vy * dt * (e.y < 220 ? 1 : .2); if (e.cd <= 0) { for (let i = 0; i < 8; i++) ebullet(e.x, e.y, i * Math.PI / 4 + e.t, 130 * d, '#d8b4fe', 4); e.cd = 1.8 / d; } if (e.t > 9) e.y += 150 * dt; break;
      case 'swarm': e.y += e.vy * dt; e.x += Math.sign(P.x - e.x) * 70 * dt; break;
      case 'sniper': e.y = Math.min(e.y + e.vy * dt, 110); if (e.cd <= 0) { ebullet(e.x, e.y, aimA(e.x, e.y), 300 * d, '#7dd3fc', 4); e.cd = 1.3 / d; } if (e.t > 10) e.y += 140 * dt; break;
    }
    if (e.type === 'dart' && e.cd <= 0 && e.y > 0 && sector > 1) { ebullet(e.x, e.y, aimA(e.x, e.y), 200 * d); e.cd = 3; }
  }
  function updateBoss(b, dt) {
    b.t += dt; b.cd -= dt;
    if (b.y < b.ty) { b.y += 80 * dt; return; }
    b.x = W / 2 + Math.sin(b.t * .7) * 140;
    const rage = b.hp < b.max / 2, d = diff() * (rage ? 1.3 : 1);
    if (b.cd > 0) return;
    if (b.kind === 0) { for (let i = 0; i < 7; i++) ebullet(b.x, b.y + 40, Math.PI / 2 + (i - 3) * .18, 190 * d); b.cd = rage ? .6 : .9; if (rage) for (let i = 0; i < 2; i++) ebullet(b.x + (i ? 50 : -50), b.y, aimA(b.x, b.y), 260, '#fecaca'); }
    else if (b.kind === 1) { for (let i = 0; i < 3; i++) enemies.push(mk('swarm', b.x + (i - 1) * 40, b.y + 30, { vy: 160 })); ebullet(b.x, b.y, aimA(b.x, b.y), 220 * d, '#fde68a', 7); b.cd = rage ? .9 : 1.4; }
    else if (b.kind === 2) { const n = rage ? 18 : 12; for (let i = 0; i < n; i++) ebullet(b.x, b.y, i * Math.PI * 2 / n + b.t, 150 * d, '#67e8f9', 5); b.cd = rage ? .5 : .8; }
    else { for (let i = 0; i < 4; i++) ebullet(b.x, b.y, b.t * 3 + i * Math.PI / 2, 170 * d, '#e9d5ff', 5); if (Math.random() < .3) ebullet(b.x, b.y, aimA(b.x, b.y), 300, '#f0abfc', 6); b.cd = rage ? .12 : .18; }
  }

  /* ---------- player ---------- */
  function shoot() {
    const p = P.pow, x = P.x, y = P.y - 14, s = 620;
    const add = (dx, a, dmg = 1, col = P.ship.col) => bullets.push({ x: x + dx, y, vx: Math.sin(a) * s, vy: -Math.cos(a) * s, dmg, col });
    add(0, 0, p >= 3 ? 2 : 1);
    if (p >= 2) { add(-10, 0); add(10, 0); }
    if (p >= 3) { add(-14, -.15); add(14, .15); }
    if (p >= 4) { add(-18, -.3); add(18, .3); }
    if (p >= 5 && Math.random() < .5) { const t = nearest(); if (t) bullets.push({ x, y, vx: 0, vy: -400, dmg: 2, col: '#f0abfc', home: true }); }
  }
  function nearest() { let best = null, bd = 1e9; for (const e of enemies) { const d = Math.hypot(e.x - P.x, e.y - P.y); if (d < bd) { bd = d; best = e; } } return best || boss; }
  function bomb() {
    if (state !== 'play' || bombs <= 0) return;
    bombs--; bombUsedThisSector = true; shake = .5; sfx('boom');
    ebullets.length = 0;
    for (const e of enemies) { e.hp -= 30; }
    if (boss && boss.y >= boss.ty) boss.hp -= 40;
    for (let i = 0; i < 80; i++) { const a = Math.random() * 7, sp = 100 + Math.random() * 500; parts.push({ x: P.x, y: P.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col: '#fff' }); }
    P.inv = Math.max(P.inv, 1);
  }
  function hurt() {
    if (P.inv > 0) return;
    lives--; P.inv = 2.5; P.pow = Math.max(1, P.pow - 1); combo = 0; shake = .4; sfx('hurt');
    boom(P.x, P.y, P.ship.col, 40);
    ebullets.length = 0;
    if (lives <= 0) gameOver(false);
  }
  function boom(x, y, col, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 7, sp = 40 + Math.random() * 260; parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .4 + Math.random() * .5, col }); } }
  function kill(e) {
    combo++; comboT = 2;
    if (combo >= 50) kit && kit.unlock('combo50');
    score += e.pts * (1 + Math.floor(combo / 10));
    boom(e.x, e.y, e.col, 14); sfx('pop');
    const r = Math.random();
    if (r < .07) pickups.push({ x: e.x, y: e.y, k: 'P' }); else if (r < .09) pickups.push({ x: e.x, y: e.y, k: 'B' }); else if (r < .1) pickups.push({ x: e.x, y: e.y, k: '♥' });
    else if (r < .35) pickups.push({ x: e.x, y: e.y, k: '★' });
  }
  function gameOver(won) {
    state = 'over';
    const res = kit ? kit.score(score, endless ? 'endless' : 'campaign') : { isBest: false };
    if (score >= 100000) kit && kit.unlock('score100k');
    $('ovt').innerHTML = (won ? '🌟 All sectors cleared!<br>' : 'Ship destroyed.<br>') + `Score <b>${score.toLocaleString()}</b>` + (res.isBest ? ' — new best!' : '') + `<br>${endless ? 'Wave' : 'Sector'} ${sector}`;
    $('go').textContent = 'Play again';
    showBest();
    setTimeout(() => { $('ov').hidden = false; }, 700);
    sfx(won ? 'win' : 'lose');
  }
  function showBest() { if (!kit) return; const a = kit.best('campaign'), b = kit.best('endless'); $('best').textContent = (a ? `Best campaign: ${a.toLocaleString()}` : '') + (b ? `  ·  Best endless: ${b.toLocaleString()}` : ''); }
  showBest();

  /* ---------- loop ---------- */
  let last = 0;
  function frame(ts) {
    const dt = Math.min(.033, (ts - last) / 1000 || 0); last = ts;
    if (state === 'play' && !paused) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  function update(dt) {
    // move
    const sp = P.ship.speed;
    let mx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0), my = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
    if (mx || my) { const l = Math.hypot(mx, my); P.x += mx / l * sp * dt; P.y += my / l * sp * dt; }
    else if (P.tx !== null) { const dx = P.tx - P.x, dy = P.ty - P.y, l = Math.hypot(dx, dy); if (l > 2) { const m = Math.min(l, sp * 1.6 * dt); P.x += dx / l * m; P.y += dy / l * m; } }
    P.x = Math.max(12, Math.min(W - 12, P.x)); P.y = Math.max(40, Math.min(H - 20, P.y));
    P.inv = Math.max(0, P.inv - dt);
    P.cd -= dt; if (P.cd <= 0) { shoot(); P.cd = P.ship.fire; }
    comboT -= dt; if (comboT <= 0) combo = 0;
    shake = Math.max(0, shake - dt);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    // spawn
    sectorT += dt;
    const wavesPerSector = 7 + sector;
    if (!boss && !between) {
      if (wave < wavesPerSector) { if (sectorT > 2 + wave * 3.2 && enemies.length < 18) spawnWave(); }
      else if (!enemies.length) makeBoss();
    }
    // bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.home) { const t = nearest(); if (t) { const a = Math.atan2(t.y - b.y, t.x - b.x); b.vx += Math.cos(a) * 1600 * dt; b.vy += Math.sin(a) * 1600 * dt; const l = Math.hypot(b.vx, b.vy); b.vx = b.vx / l * 480; b.vy = b.vy / l * 480; } }
      b.x += b.vx * dt; b.y += b.vy * dt;
      let hit = false;
      for (const e of enemies) if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 3) { e.hp -= b.dmg; e.flash = .06; hit = true; break; }
      if (!hit && boss && boss.y >= boss.ty - 5 && Math.hypot(boss.x - b.x, boss.y - b.y) < boss.r) { boss.hp -= b.dmg; boss.flash = .05; hit = true; score += 5; }
      if (hit || b.y < -20 || b.x < -20 || b.x > W + 20 || b.y > H + 20) bullets.splice(i, 1);
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i]; updateEnemy(e, dt); e.flash = Math.max(0, (e.flash || 0) - dt);
      if (e.hp <= 0) { kill(e); enemies.splice(i, 1); continue; }
      if (Math.hypot(e.x - P.x, e.y - P.y) < e.r + P.r - 4) { hurt(); e.hp -= 5; }
      if (e.y > H + 60) enemies.splice(i, 1);
    }
    if (boss) {
      updateBoss(boss, dt); boss.flash = Math.max(0, (boss.flash || 0) - dt);
      if (Math.hypot(boss.x - P.x, boss.y - P.y) < boss.r + P.r) hurt();
      if (boss.hp <= 0) {
        score += 5000 * sector; boom(boss.x, boss.y, boss.col, 120); boom(boss.x, boss.y, '#fff', 60); shake = .8; sfx('boom');
        kit && kit.unlock('boss1');
        if (!bombUsedThisSector) kit && kit.unlock('nobomb');
        for (let i = 0; i < 6; i++) pickups.push({ x: boss.x + (Math.random() - .5) * 120, y: boss.y + (Math.random() - .5) * 60, k: '★' });
        pickups.push({ x: boss.x, y: boss.y, k: 'P' });
        boss = null; ebullets.length = 0;
        if (!endless && sector >= 8) { kit && kit.unlock('clear'); setTimeout(() => gameOver(true), 1200); state = 'won'; return; }
        sector++; between = true; setTimeout(startSector, 1500); wave = 99; enemies.length = 0;
      }
    }
    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
      if (Math.hypot(b.x - P.x, b.y - P.y) < b.r + 4) { ebullets.splice(i, 1); hurt(); continue; }
      if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) ebullets.splice(i, 1);
    }
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i]; p.y += 90 * dt;
      const d = Math.hypot(p.x - P.x, p.y - P.y);
      if (d < 90 && p.k === '★') { p.x += (P.x - p.x) * 6 * dt; p.y += (P.y - p.y) * 6 * dt; }
      if (d < 20) {
        pickups.splice(i, 1);
        if (p.k === 'P') { P.pow = Math.min(5, P.pow + 1); sfx('power'); if (P.pow === 5) kit && kit.unlock('maxpow'); }
        else if (p.k === 'B') { bombs = Math.min(5, bombs + 1); sfx('power'); }
        else if (p.k === '♥') { lives = Math.min(6, lives + 1); sfx('power'); }
        else { score += 50; sfx('coin'); }
      } else if (p.y > H + 20) pickups.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .97; p.vy *= .97; p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }
  }

  function drawShip(x, y, col, s = 1) {
    g.save(); g.translate(x, y); g.scale(s, s);
    g.fillStyle = col; g.beginPath(); g.moveTo(0, -16); g.lineTo(12, 12); g.lineTo(0, 6); g.lineTo(-12, 12); g.closePath(); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.ellipse(0, -2, 3, 6, 0, 0, 7); g.fill();
    g.fillStyle = `hsl(${30 + Math.random() * 30},100%,60%)`; g.beginPath(); g.moveTo(-5, 10); g.lineTo(0, 18 + Math.random() * 8); g.lineTo(5, 10); g.fill();
    g.restore();
  }
  function draw() {
    g.save();
    if (shake > 0) g.translate((Math.random() - .5) * shake * 20, (Math.random() - .5) * shake * 20);
    g.fillStyle = '#030412'; g.fillRect(-20, -20, W + 40, H + 40);
    const spd = state === 'play' && !paused ? 1 : .2;
    for (const s of stars) { s.y += (20 + s.z * 120) * spd / 60; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } g.fillStyle = `rgba(200,220,255,${.2 + s.z * .7})`; g.fillRect(s.x, s.y, 1 + s.z * 1.5, 1 + s.z * 2.5); }
    if (state !== 'menu' && P) {
      for (const p of pickups) { g.fillStyle = p.k === '★' ? '#fde047' : p.k === 'P' ? '#a78bfa' : p.k === 'B' ? '#fb7185' : '#4ade80'; g.beginPath(); g.arc(p.x, p.y, p.k === '★' ? 6 : 11, 0, 7); g.fill(); if (p.k !== '★') { g.fillStyle = '#000'; g.font = 'bold 12px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.k, p.x, p.y + 1); } }
      for (const e of enemies) {
        g.fillStyle = e.flash ? '#fff' : e.col; g.save(); g.translate(e.x, e.y);
        if (e.type === 'spinner') { g.rotate(e.t * 3); g.fillRect(-e.r, -4, e.r * 2, 8); g.fillRect(-4, -e.r, 8, e.r * 2); }
        else if (e.type === 'tank') { g.fillRect(-e.r, -e.r * .7, e.r * 2, e.r * 1.4); g.fillStyle = '#365314'; g.fillRect(-5, 0, 10, e.r); }
        else { g.beginPath(); g.moveTo(0, e.r); g.lineTo(e.r, -e.r * .6); g.lineTo(0, -e.r * .2); g.lineTo(-e.r, -e.r * .6); g.closePath(); g.fill(); }
        g.restore();
      }
      if (boss) {
        const b = boss; g.save(); g.translate(b.x, b.y);
        g.fillStyle = b.flash ? '#fff' : b.col;
        g.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + (b.kind === 2 ? b.t : 0), r = i % 2 ? b.r * .65 : b.r; g.lineTo(Math.cos(a) * r, Math.sin(a) * r * .7); } g.closePath(); g.fill();
        g.fillStyle = '#0f172a'; g.beginPath(); g.arc(0, 0, 18, 0, 7); g.fill(); g.fillStyle = b.hp < b.max / 2 ? '#ef4444' : '#fde68a'; g.beginPath(); g.arc(0, 0, 9 + Math.sin(b.t * 8) * 2, 0, 7); g.fill();
        g.restore();
        g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(40, 44, W - 80, 8); g.fillStyle = b.col; g.fillRect(40, 44, (W - 80) * Math.max(0, b.hp) / b.max, 8);
        g.fillStyle = '#fff'; g.font = '11px system-ui'; g.textAlign = 'center'; g.fillText(b.name, W / 2, 40);
      }
      for (const b of bullets) { g.fillStyle = b.col; g.fillRect(b.x - 2, b.y - 7, 4, 12); }
      for (const b of ebullets) { g.fillStyle = b.col; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(b.x, b.y, b.r * .45, 0, 7); g.fill(); }
      if (state === 'play' || state === 'won') if (!(P.inv > 0 && Math.floor(P.inv * 12) % 2)) drawShip(P.x, P.y, P.ship.col);
      for (const p of parts) { g.globalAlpha = Math.min(1, p.life * 2); g.fillStyle = p.col; g.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); } g.globalAlpha = 1;
      // HUD
      g.fillStyle = '#fff'; g.font = 'bold 16px system-ui'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.fillText(score.toLocaleString(), 10, 24);
      if (combo >= 5) { g.fillStyle = '#fde047'; g.font = 'bold 13px system-ui'; g.fillText(`${combo}× combo  (×${1 + Math.floor(combo / 10)})`, 10, H - 14); }
      g.textAlign = 'right'; g.font = '14px system-ui'; g.fillStyle = '#f87171'; g.fillText('♥'.repeat(Math.max(0, lives)), W - 50, 24);
      g.fillStyle = '#fb7185'; g.fillText('💣' + bombs, W - 50, 44); g.fillStyle = '#c4b5fd'; g.fillText('PWR ' + '▮'.repeat(P.pow) + '▯'.repeat(5 - P.pow), W - 10, H - 14);
      if (banner) { g.globalAlpha = Math.min(1, banner.t); g.fillStyle = '#fff'; g.font = 'bold 30px system-ui'; g.textAlign = 'center'; g.fillText(banner.text, W / 2, H / 2 - 40); g.globalAlpha = 1; }
      if (paused) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, W, H); g.fillStyle = '#fff'; g.font = 'bold 28px system-ui'; g.textAlign = 'center'; g.fillText('PAUSED', W / 2, H / 2); }
    }
    g.restore();
  }

  /* ---------- input ---------- */
  addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = true;
    if (k.startsWith('Arrow') || k === ' ') e.preventDefault();
    if (state === 'play') { if (k === ' ' || k === 'x' || k === 'b') bomb(); if (k === 'p' || k === 'Escape') paused = !paused; }
    else if ((k === 'Enter' || k === ' ') && !$('ov').hidden) start(false);
  });
  addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  let lastTap = 0, dragOff = null;
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const p = pos(e), now = performance.now();
    if (now - lastTap < 300) bomb(); lastTap = now;
    dragOff = { x: P.x - p.x, y: P.y - p.y }; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => { if (!dragOff || state !== 'play') return; const p = pos(e); P.tx = p.x + dragOff.x; P.ty = p.y + dragOff.y; });
  const up = () => { dragOff = null; if (P) P.tx = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  $('go').onclick = () => start(false);
  $('endless').onclick = () => start(true);
  $('mute').onclick = () => { const m = kit ? kit.mute() : true; $('mute').textContent = m ? '🔇' : '🔊'; };
  if (kit && kit.muted) $('mute').textContent = '🔇';
  addEventListener('blur', () => { if (state === 'play') paused = true; });
  window.__shooter = () => ({ state, score, sector, wave, enemies: enemies && enemies.length, boss: boss && boss.hp, lives, start, makeBoss: () => makeBoss(), skip: () => { wave = 99; enemies.length = 0; } });
  requestAnimationFrame(frame);
})();
</script>
</body></html>
