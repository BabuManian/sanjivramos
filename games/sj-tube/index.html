<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tube</title>
<style>
:root{color-scheme:dark;--bg:#0f0f10;--bg2:#1a1a1c;--bg3:#272729;--fg:#f1f1f1;--mut:#aaa;--red:#ff2a2a;--acc:#3ea6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:var(--acc)}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #222}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:19px;letter-spacing:-.5px;cursor:pointer;white-space:nowrap}
.logo i{display:inline-grid;place-items:center;width:30px;height:21px;border-radius:6px;background:var(--red);font-style:normal;font-size:11px}
#sform{flex:1;display:flex;max-width:620px;margin:0 auto}
#q{flex:1;min-width:0;height:38px;border-radius:20px 0 0 20px;border:1px solid #333;background:#121212;color:var(--fg);padding:0 16px;font:inherit;outline:none}
#q:focus{border-color:var(--acc)}
#sform button{width:58px;border-radius:0 20px 20px 0;background:#222;border:1px solid #333;border-left:none}
nav{padding:10px 8px;overflow:auto;border-right:1px solid #1d1d1f}
nav button{display:flex;align-items:center;gap:14px;width:100%;padding:9px 12px;border-radius:10px;text-align:left}
nav button:hover{background:var(--bg2)}nav button.on{background:var(--bg3);font-weight:600}
nav h4{margin:14px 12px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
nav .sub{font-size:13px}nav .sub img{width:24px;height:24px;border-radius:50%;object-fit:cover}
main{overflow:auto;position:relative}
.wrap{padding:18px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 16px}
.card{cursor:pointer;min-width:0}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.card:hover .th img{transform:scale(1.03)}
.len{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.85);padding:1px 5px;border-radius:5px;font-size:12px;font-weight:600}
.len.live{background:var(--red)}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
.meta{display:flex;gap:10px;margin-top:9px}
.meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.3;font-weight:600}
.meta small{display:block;color:var(--mut);margin-top:3px;font-size:13px}
.meta small a{color:var(--mut);text-decoration:none}.meta small a:hover{color:var(--fg)}
.chcard{display:flex;align-items:center;gap:16px;padding:12px;border-radius:12px;cursor:pointer}
.chcard:hover{background:var(--bg2)}.chcard img{width:88px;height:88px;border-radius:50%;object-fit:cover}
h2{margin:0 0 14px;font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{padding:6px 12px;border-radius:8px;background:var(--bg3);font-size:13px;font-weight:600}.chips button.on{background:var(--fg);color:#000}
.empty{color:var(--mut);text-align:center;padding:60px 20px}
.err{background:#3b1212;border:1px solid #7f1d1d;color:#fecaca;padding:12px 14px;border-radius:12px;margin:14px 0}
.btn{padding:8px 16px;border-radius:20px;background:var(--bg3);font-weight:600}
.btn.red{background:var(--fg);color:#000}.btn.subbed{background:var(--bg3);color:var(--fg)}
.skel{background:linear-gradient(90deg,#1c1c1e,#2a2a2d,#1c1c1e);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
/* watch */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;padding:18px 20px;max-width:1700px;margin:0 auto}
.watch.theater{grid-template-columns:1fr}.watch.theater .side{grid-column:1}
.player{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
.player video{width:100%;height:100%;display:block;background:#000}
.watch.theater .player{border-radius:0;aspect-ratio:auto;height:min(78vh,56.25vw)}
.ptools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ptools select{background:var(--bg3);color:var(--fg);border:none;border-radius:16px;padding:6px 10px;font:inherit}
.ptools .sp{flex:1}
.vt{font-size:20px;font-weight:700;margin:6px 0 10px}
.owner{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.owner img{width:42px;height:42px;border-radius:50%;object-fit:cover;cursor:pointer;background:#333}
.owner .n{cursor:pointer}.owner .n b{display:block}.owner .n small{color:var(--mut)}
.desc{background:var(--bg2);border-radius:12px;padding:12px;margin-top:12px;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:hidden;cursor:pointer;position:relative}
.desc.open{max-height:none;cursor:auto}
.desc .st{font-weight:700;display:block;margin-bottom:6px}
.side .card{display:grid;grid-template-columns:168px 1fr;gap:10px;margin-bottom:10px}
.side .th{border-radius:8px}.side .meta{margin:0}.side .meta b{font-size:14px}
.cmt{display:flex;gap:12px;margin:16px 0}.cmt img{width:36px;height:36px;border-radius:50%;flex:none;background:#333}
.cmt b{font-size:13px}.cmt small{color:var(--mut);font-size:12px}.cmt p{margin:4px 0;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f1f1f1;color:#111;padding:9px 16px;border-radius:10px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5)}
/* channel */
.banner{height:170px;background:#222 center/cover;border-radius:14px}
.chhead{display:flex;align-items:center;gap:18px;margin:16px 0}
.chhead img{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#333}
/* shorts */
.shorts{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.shorts::-webkit-scrollbar{display:none}
.short{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;align-items:center;gap:14px;padding:12px 0}
.sbox{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:#000}
.sbox video,.sbox img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sbox .ov{position:absolute;left:0;right:0;bottom:0;padding:60px 14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}
.sbox .ov b{display:block;font-size:15px;margin-bottom:6px}.sbox .ov span{cursor:pointer;pointer-events:auto;font-weight:600}
.sbox .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
.sbox .tap{position:absolute;inset:0}
.sbox .paused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:60px;opacity:.85;pointer-events:none}
.sacts{display:flex;flex-direction:column;gap:16px;align-items:center;align-self:flex-end;padding-bottom:20px}
.sacts button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.sacts button span{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--bg3);font-size:20px}
.sacts button.on span{background:var(--fg);color:#000}
.sdraw{position:fixed;right:0;top:56px;bottom:0;width:min(420px,100%);background:var(--bg2);z-index:30;overflow:auto;padding:16px;box-shadow:-10px 0 30px rgba(0,0,0,.5)}
.sload{color:var(--mut);display:grid;place-items:center;position:absolute;inset:0;font-size:13px}
#bnav{display:none}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:52px 1fr 54px}
  header{gap:8px;padding:0 10px}#sform{min-width:0}#sform button{width:46px}
  header{grid-column:1}.logo span{display:none}
  nav{display:none}
  #bnav{display:flex;border-top:1px solid #222;background:var(--bg)}
  #bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:2px}
  #bnav button.on{color:#fff;font-weight:700}#bnav button i{font-style:normal;font-size:18px}
  .watch{grid-template-columns:1fr;padding:0}.watch .info,.watch .side{padding:0 12px}.player{border-radius:0}
  .wrap{padding:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px 12px}
  .short{gap:0}.sacts{position:absolute;right:8px;bottom:70px;z-index:2}.sbox{border-radius:0;width:100%;aspect-ratio:auto}
}
</style></head>
<body>
<div id="app">
  <header>
    <div class="logo" data-go="home"><i>▶</i><span>Tube</span></div>
    <form id="sform"><input id="q" placeholder="Search" autocomplete="off" enterkeyhint="search"><button title="Search">🔍</button></form>
    <button class="btn" id="setBtn" title="Settings">⚙</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
  <div id="bnav"><button data-go="home"><i>🏠</i>Home</button><button data-go="shorts"><i>⚡</i>Shorts</button><button data-go="subs"><i>📺</i>Subs</button><button data-go="library"><i>📚</i>Library</button></div>
</div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), main = $('#main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// your subscriptions, history and settings live in a "webos." key, so they're saved to your SanjivramOS account too
const KEY = 'webos.tube';
const DEF = { subs: [], history: [], later: [], liked: [], progress: {}, set: { quality: '720', autoplay: true, sponsor: true, speed: 1, region: 'US', captions: '' } };
let D; try { D = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY)) || {}); D.set = Object.assign({}, DEF.set, D.set || {}); } catch { D = JSON.parse(JSON.stringify(DEF)); }
let saveT = null; const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch {} }, 300); };
const api = async (path, opts = {}) => {
  const r = await fetch('/yt/api/' + path, { credentials: 'same-origin', signal: opts.signal });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 404 && !j.error) throw new Error('Tube needs the updated server — in Termux run: sanjivramos restart');
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
};
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
const num = n => n == null ? '' : n >= 1e9 ? (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n);
const ago = v => { if (v.ago) return v.ago; if (!v.published) return ''; const s = (Date.now() - v.published) / 1000; for (const [n, u] of [[31536000, 'year'], [2592000, 'month'], [604800, 'week'], [86400, 'day'], [3600, 'hour'], [60, 'minute']]) if (s >= n) { const k = Math.floor(s / n); return `${k} ${u}${k > 1 ? 's' : ''} ago`; } return 'just now'; };
const isSub = id => D.subs.some(s => s.id === id);
function toggleSub(ch) { if (!ch || !ch.id) return; if (isSub(ch.id)) { D.subs = D.subs.filter(s => s.id !== ch.id); toast('Unsubscribed'); } else { D.subs.unshift({ id: ch.id, name: ch.name, thumb: ch.thumb || '' }); toast('Subscribed to ' + ch.name); } save(); renderNav(); }
const cardOf = v => ({ id: v.id, title: v.title, author: v.author, authorId: v.authorId, len: v.len, length: v.length, views: v.views, published: v.published, ago: v.ago, thumb: v.thumb, short: v.short });

/* ---------------- navigation ---------------- */
let view = 'home', ctrl = null;
const NAV = [['home', '🏠', 'Home'], ['shorts', '⚡', 'Shorts'], ['subs', '📺', 'Subscriptions'], ['history', '🕘', 'History'], ['later', '⏰', 'Watch later'], ['liked', '👍', 'Liked']];
function renderNav() {
  $('#nav').innerHTML = NAV.map(([k, i, l]) => `<button data-go="${k}" class="${view === k ? 'on' : ''}"><span>${i}</span>${l}</button>`).join('') +
    (D.subs.length ? `<h4>Subscriptions</h4>` + D.subs.slice(0, 40).map(s => `<button class="sub" data-ch="${esc(s.id)}">${s.thumb ? `<img src="${esc(s.thumb)}" alt="${esc(s.name)}">` : '📺'}<span>${esc(s.name)}</span></button>`).join('') : '');
  document.querySelectorAll('#bnav [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === view || (view === 'later' || view === 'history' || view === 'liked') && b.dataset.go === 'library'));
}
function go(v, arg, push = true) {
  if (ctrl) ctrl.abort(); ctrl = new AbortController(); stopPlayers();
  view = v; renderNav();
  if (push) history.pushState({ v, arg }, '', '#' + v + (arg ? '/' + encodeURIComponent(arg) : ''));
  main.scrollTop = 0;
  ({ home, shortsView, subs, library: () => listView('history'), history: () => listView('history'), later: () => listView('later'), liked: () => listView('liked'), search: () => searchView(arg), watch: () => watch(arg), channel: () => channelView(arg) })[v === 'shorts' ? 'shortsView' : v](arg);
}
addEventListener('popstate', e => { const s = e.state || parseHash(); go(s.v || 'home', s.arg, false); });
function parseHash() { const [v, a] = location.hash.slice(1).split('/'); return { v: v || 'home', arg: a ? decodeURIComponent(a) : undefined }; }
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const c = e.target.closest('[data-ch]'); if (c) { e.preventDefault(); e.stopPropagation(); go('channel', c.dataset.ch); return; }
  const v = e.target.closest('[data-v]'); if (v) { e.preventDefault(); const vd = v.dataset; if (vd.short === '1' && view !== 'watch') go('shorts', vd.v); else go('watch', vd.v); }
});
$('#sform').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); if (q) go('search', q); };
$('#setBtn').onclick = settings;

/* ---------------- lists ---------------- */
const skel = n => `<div class="grid">${Array.from({ length: n }, () => `<div><div class="skel" style="aspect-ratio:16/9"></div><div class="skel" style="height:14px;margin-top:10px;width:80%"></div><div class="skel" style="height:12px;margin-top:8px;width:50%"></div></div>`).join('')}</div>`;
function card(v) {
  if (v.type === 'channel') return `<div class="chcard" data-ch="${esc(v.id)}"><img src="${esc(v.thumb)}" alt="${esc(v.name)}"><div><b style="font-size:17px">${esc(v.name)}</b><div style="color:var(--mut);font-size:13px">${v.subs ? num(v.subs) + ' subscribers' : ''}${v.videos ? ' · ' + num(v.videos) + ' videos' : ''}</div><div style="color:var(--mut);font-size:13px;margin-top:4px">${esc((v.desc || '').slice(0, 140))}</div></div></div>`;
  const p = D.progress[v.id], pct = p && v.len ? Math.min(100, p / v.len * 100) : 0;
  return `<div class="card" data-v="${esc(v.id)}" data-short="${v.short ? 1 : 0}"><div class="th"><img loading="lazy" src="${esc(v.thumb)}" alt="${esc(v.title)}">${v.length ? `<span class="len${v.length === 'LIVE' ? ' live' : ''}">${v.short ? '⚡ ' : ''}${esc(v.length)}</span>` : ''}${pct ? `<span class="prog" style="width:${pct}%"></span>` : ''}</div>
    <div class="meta"><div><b>${esc(v.title)}</b><small>${v.authorId ? `<a href="#" data-ch="${esc(v.authorId)}">${esc(v.author || '')}</a>` : esc(v.author || '')}</small><small>${[v.views != null && v.views >= 0 ? num(v.views) + ' views' : '', ago(v)].filter(Boolean).join(' · ')}</small></div></div></div>`;
}
function errBox(e, retry) { return `<div class="err">⚠ ${esc(e.message)} ${retry ? '<button class="btn" id="retry" style="margin-left:8px">Retry</button>' : ''}</div>`; }
async function home() {
  main.innerHTML = `<div class="wrap"><div class="chips" id="cats"></div><div id="list">${skel(12)}</div></div>`;
  const cats = ['Trending', 'Music', 'Gaming', 'Minecraft', 'Roblox', 'Football', 'Science', 'Coding', 'Funny', 'Animals', 'Cooking', 'Movies'];
  $('#cats').innerHTML = cats.map((c, i) => `<button class="${i ? '' : 'on'}" data-cat="${c}">${c}</button>`).join('');
  $('#cats').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; $('#cats').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); load(b.dataset.cat); };
  const load = async cat => {
    $('#list').innerHTML = skel(12);
    try { const j = cat === 'Trending' ? await api('home?region=' + D.set.region, ctrl) : await api('search?q=' + encodeURIComponent(cat), ctrl); $('#list').innerHTML = j.items.length ? `<div class="grid">${j.items.map(card).join('')}</div>` : '<div class="empty">Nothing here right now.</div>'; }
    catch (e) { if (e.name === 'AbortError') return; $('#list').innerHTML = errBox(e, true); $('#retry').onclick = () => load(cat); }
  };
  load('Trending');
}
async function searchView(q) {
  $('#q').value = q; let page = 1, type = 'video', busy = false;
  main.innerHTML = `<div class="wrap"><div class="chips"><button class="on" data-t="video">Videos</button><button data-t="channel">Channels</button></div><div id="list">${skel(8)}</div><div id="more"></div></div>`;
  main.querySelector('.chips').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; type = b.dataset.t; page = 1; main.querySelectorAll('.chips button').forEach(x => x.classList.toggle('on', x === b)); $('#list').innerHTML = skel(8); load(); };
  const load = async () => {
    busy = true;
    try { const j = await api(`search?q=${encodeURIComponent(q)}&page=${page}&type=${type}`, ctrl); const html = j.items.map(card).join(''); if (page === 1) $('#list').innerHTML = j.items.length ? `<div class="${type === 'channel' ? '' : 'grid'}">${html}</div>` : `<div class="empty">No results for “${esc(q)}”.</div>`; else $('#list').firstElementChild.insertAdjacentHTML('beforeend', html); $('#more').innerHTML = j.items.length >= 10 ? '<div style="text-align:center;margin:20px"><button class="btn" id="mb">Load more</button></div>' : ''; const mb = $('#mb'); if (mb) mb.onclick = () => { page++; load(); }; }
    catch (e) { if (e.name !== 'AbortError') { $('#list').innerHTML = errBox(e, true); $('#retry').onclick = load; } }
    busy = false;
  };
  load();
}
function listView(kind) {
  view = kind; renderNav();
  const names = { history: 'History', later: 'Watch later', liked: 'Liked videos' };
  const tabs = `<div class="chips">${Object.entries(names).map(([k, l]) => `<button class="${k === kind ? 'on' : ''}" data-go="${k}">${l}</button>`).join('')}</div>`;
  const list = D[kind] || [];
  main.innerHTML = `<div class="wrap"><h2>${names[kind]}</h2>${tabs}${list.length ? `<div class="grid">${list.map(card).join('')}</div><div style="margin-top:20px"><button class="btn" id="clr">Clear ${names[kind].toLowerCase()}</button></div>` : '<div class="empty">Nothing here yet.</div>'}</div>`;
  const c = $('#clr'); if (c) c.onclick = () => { if (!confirm('Clear ' + names[kind].toLowerCase() + '?')) return; D[kind] = []; if (kind === 'history') D.progress = {}; save(); listView(kind); };
}
async function subs() {
  if (!D.subs.length) { main.innerHTML = `<div class="wrap"><h2>Subscriptions</h2><div class="empty">Subscribe to channels and their newest videos show up here.<br><br>Your subscriptions are saved to your SanjivramOS account.</div></div>`; return; }
  main.innerHTML = `<div class="wrap"><h2>Subscriptions</h2><div id="list">${skel(12)}</div></div>`;
  try { const j = await api('feed?ids=' + D.subs.map(s => s.id).join(','), ctrl); $('#list').innerHTML = j.items.length ? `<div class="grid">${j.items.map(card).join('')}</div>` : '<div class="empty">No new videos.</div>'; }
  catch (e) { if (e.name !== 'AbortError') { $('#list').innerHTML = errBox(e, true); $('#retry').onclick = subs; } }
}
async function channelView(id) {
  main.innerHTML = `<div class="wrap"><div class="skel banner"></div><div id="ch"></div></div>`;
  let tab = 'videos';
  const load = async () => {
    try {
      const c = await api(`channel/${id}?tab=${tab}`, ctrl);
      main.querySelector('.wrap').innerHTML = `${c.banner ? `<div class="banner" style="background-image:url('${esc(c.banner)}')"></div>` : ''}
        <div class="chhead">${c.thumb ? `<img src="${esc(c.thumb)}" alt="${esc(c.name)}">` : ''}<div style="flex:1"><h2 style="margin:0">${esc(c.name)}</h2><div style="color:var(--mut)">${c.subs ? num(c.subs) + ' subscribers' : ''}</div><div style="color:var(--mut);font-size:13px;margin-top:6px;max-width:700px">${esc((c.desc || '').slice(0, 220))}</div></div><button class="btn ${isSub(id) ? 'subbed' : 'red'}" id="subB">${isSub(id) ? 'Subscribed ✓' : 'Subscribe'}</button></div>
        <div class="chips"><button data-tab="videos" class="${tab === 'videos' ? 'on' : ''}">Videos</button><button data-tab="shorts" class="${tab === 'shorts' ? 'on' : ''}">Shorts</button></div>
        ${c.videos.length ? `<div class="grid">${c.videos.map(v => card({ ...v, author: v.author || c.name, authorId: id })).join('')}</div>` : '<div class="empty">No videos.</div>'}`;
      $('#subB').onclick = () => { toggleSub({ id, name: c.name, thumb: c.thumb }); $('#subB').className = 'btn ' + (isSub(id) ? 'subbed' : 'red'); $('#subB').textContent = isSub(id) ? 'Subscribed ✓' : 'Subscribe'; };

  api('status').then(j => { $('#st').textContent = `Server: ${j.last ? 'last answered by ' + j.last : 'no requests yet'} · yt-dlp ${j.ytdlp ? 'installed ✓' : 'not installed'}${j.lastErr ? ' · last problem: ' + j.lastErr : ''}`; }).catch(e => { $('#st').textContent = '⚠ ' + e.message; });
  $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(D.subs, null, 2)], { type: 'application/json' })); a.download = 'tube-subscriptions.json'; a.click(); };
  $('#imp').onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,.csv'; i.onchange = async () => { const t = await i.files[0].text(); let n = 0; const addSub = (id, name) => { if (/^UC[\w-]{22}$/.test(id) && !isSub(id)) { D.subs.push({ id, name: name || id, thumb: '' }); n++; } }; try { const j = JSON.parse(t); for (const s of Array.isArray(j) ? j : j.subscriptions || []) addSub(s.id || s.channelId || s.url && (/UC[\w-]{22}/.exec(s.url) || [])[0], s.name || s.title); } catch { for (const line of t.split('\n')) { const m = /(UC[\w-]{22})[^,]*,(?:[^,]*,)?\s*"?([^",\n]+)/.exec(line); if (m) addSub(m[1], m[2]); } } save(); renderNav(); toast(`Imported ${n} subscription${n === 1 ? '' : 's'}`); }; i.click(); };
}

/* ---------------- keyboard ---------------- */
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || view !== 'watch' || !P) return;
  const v = P.video, k = e.key.toLowerCase();
  if (k === 'k' || k === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  if (k === 'j') v.currentTime -= 10; if (k === 'l') v.currentTime += 10;
  if (k === 'arrowleft') v.currentTime -= 5; if (k === 'arrowright') v.currentTime += 5;
  if (k === 'm') v.muted = !v.muted;
  if (k === 'f') (document.fullscreenElement ? document.exitFullscreen() : $('.player').requestFullscreen()).catch(() => {});
  if (k === 't') $('#theater').click();
  if (e.shiftKey && k === 'n' && P.v.related[0]) go('watch', P.v.related[0].id);
});
addEventListener('pagehide', savePos);

renderNav();
const start = parseHash(); go(start.v, start.arg, false); history.replaceState(start, '', location.hash || '#home');
window.__tube = { get D() { return D; }, go, get P() { return P; }, pickStreams, get view() { return view; } };
})();
</script>
</body></html>
