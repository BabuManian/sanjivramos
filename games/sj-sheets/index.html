<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheets</title>
<script src="../sj-officekit/kit.js"></script>
<script src="engine.js"></script>
<style>
:root{--k-acc:#1f8a4c;--grid:#e2e5e9;--hdr:#f3f4f6;--cell:#fff;--ctext:#1b1b1b}
@media (prefers-color-scheme:dark){:root{--grid:#3a3e45;--hdr:#2a2d32;--cell:#1f2125;--ctext:#e8eaed}}
#app{display:flex;flex-direction:column;height:100%}
#home{flex:1;overflow:auto} #home.off{display:none}
#ed{flex:1;display:none;flex-direction:column;min-height:0} #ed.on{display:flex}
.fbar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--k-panel);border-bottom:1px solid var(--k-line)}
.fbar input{font:13px ui-monospace,Consolas,monospace;border:1px solid var(--k-line);border-radius:6px;background:var(--k-bg);color:var(--k-text);padding:5px 8px;height:30px}
#nameBox{width:90px;text-align:center}
#fx{flex:1;min-width:0}
.fxl{color:var(--k-sub);font-style:italic;font-family:Georgia,serif}
.gwrap{flex:1;overflow:auto;position:relative;background:var(--cell);outline:none}
table.g{border-collapse:separate;border-spacing:0;table-layout:fixed;font:13px/1.2 system-ui,"Segoe UI",Arial,sans-serif;color:var(--ctext);user-select:none}
.g th,.g td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);height:24px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.g td{background:var(--cell);max-width:0}
.g thead th{position:sticky;top:0;z-index:3;background:var(--hdr);font-weight:500;color:var(--k-sub);font-size:12px;text-align:center;position:sticky}
.g tbody th{position:sticky;left:0;z-index:2;background:var(--hdr);font-weight:500;color:var(--k-sub);font-size:12px;text-align:center;width:46px;min-width:46px}
.g thead th.corner{left:0;z-index:4;width:46px}
.g thead th .rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:5}
.g th.hs{background:color-mix(in srgb,var(--k-acc) 22%,var(--hdr));color:var(--k-text)}
.g td.sel{background:color-mix(in srgb,var(--k-acc) 13%,var(--cell))}
.g td.act{outline:2px solid var(--k-acc);outline-offset:-2px;background:var(--cell)}
.g td.err{color:#c62828}
.g td.wrap{white-space:normal;word-break:break-word}
#edit{position:absolute;z-index:6;display:none;font:13px/1.2 system-ui,"Segoe UI",Arial,sans-serif;border:2px solid var(--k-acc);padding:3px 4px;background:var(--cell);color:var(--ctext);outline:none;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.tabs{display:flex;align-items:center;gap:2px;padding:3px 6px;background:var(--k-panel);border-top:1px solid var(--k-line);overflow-x:auto}
.tab{border:none;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;color:var(--k-sub)}
.tab:hover{background:var(--k-hover)} .tab.on{background:var(--k-bg);color:var(--k-acc);font-weight:600;box-shadow:inset 0 -2px 0 var(--k-acc)}
.sum{margin-left:auto;color:var(--k-sub);font-size:12px;white-space:nowrap;padding:0 6px}
.ac{position:fixed;z-index:60;background:var(--k-panel);border:1px solid var(--k-line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.2);max-height:200px;overflow:auto;font:13px ui-monospace,monospace;display:none}
.ac div{padding:5px 10px;cursor:pointer} .ac div.on,.ac div:hover{background:var(--k-hover)}
.chartc{width:min(640px,86vw);height:min(380px,50vh);display:block;background:#fff;border-radius:8px;border:1px solid var(--k-line)}
.tpl-grid{position:absolute;inset:0;background-image:linear-gradient(#e3e6ea 1px,transparent 1px),linear-gradient(90deg,#e3e6ea 1px,transparent 1px);background-size:20% 10%}
.tpl-grid b{position:absolute;left:6%;top:4%;font:9px sans-serif;color:#1f8a4c}
@media print{#home,.k-bar,.k-tools,.fbar,.tabs{display:none!important}#ed,.gwrap{display:block!important;overflow:visible!important}.g td.act{outline:none}.g td.sel{background:none}}
</style></head>
<body><div id="app"><div id="home"></div><div id="ed">
  <div class="k-bar">
    <button class="k-mb" data-m="file">File</button><button class="k-mb" data-m="edit">Edit</button><button class="k-mb" data-m="insert">Insert</button><button class="k-mb" data-m="format">Format</button><button class="k-mb" data-m="data">Data</button>
    <input class="k-title" id="title" spellcheck="false"><span class="k-status" id="status"></span>
  </div>
  <div class="k-tools">
    <button class="k-tb" data-t="undo" title="Undo (Ctrl+Z)">↶</button><button class="k-tb" data-t="redo" title="Redo (Ctrl+Y)">↷</button><span class="k-vs"></span>
    <select id="fmt" title="Number format"><option value="">General</option><option value="num">Number</option><option value="cur">Currency</option><option value="pct">Percent</option><option value="date">Date</option><option value="time">Time</option><option value="text">Text</option></select>
    <button class="k-tb" data-t="dec-" title="Fewer decimals">.0←</button><button class="k-tb" data-t="dec+" title="More decimals">.00→</button><span class="k-vs"></span>
    <button class="k-tb" data-s="b" title="Bold (Ctrl+B)"><b>B</b></button><button class="k-tb" data-s="i" title="Italic (Ctrl+I)"><i>I</i></button><button class="k-tb" data-s="u" title="Underline (Ctrl+U)"><u>U</u></button><button class="k-tb" data-s="st" title="Strikethrough"><s>S</s></button>
    <span class="k-col k-tb" title="Text colour"><b>A</b><i id="fcI" style="background:#c62828"></i><input type="color" id="fc" value="#c62828"></span>
    <span class="k-col k-tb" title="Fill colour"><span>🪣</span><i id="bgI" style="background:#fff59d"></i><input type="color" id="bg" value="#fff59d"></span>
    <span class="k-vs"></span>
    <button class="k-tb" data-al="left" title="Align left">⫷</button><button class="k-tb" data-al="center" title="Centre">≡</button><button class="k-tb" data-al="right" title="Align right">⫸</button><button class="k-tb" data-s="wrap" title="Wrap text">↵</button>
    <span class="k-vs"></span>
    <button class="k-tb" data-t="sum" title="AutoSum">Σ</button><button class="k-tb" data-t="sortA" title="Sort A→Z">A↓</button><button class="k-tb" data-t="sortZ" title="Sort Z→A">Z↓</button><button class="k-tb" data-t="chart" title="Chart">📊</button><button class="k-tb" data-t="clear" title="Clear formatting">⌫</button>
  </div>
  <div class="fbar"><input id="nameBox" title="Cell — type a cell like C12 to jump"><span class="fxl">fx</span><input id="fx" spellcheck="false" autocomplete="off"></div>
  <div class="gwrap" id="gw" tabindex="0"><table class="g" id="g"></table><textarea id="edit" spellcheck="false" rows="1"></textarea></div>
  <div class="tabs" id="tabs"></div>
</div></div>
<div class="ac" id="ac"></div>
<script>
'use strict';
const { $, $$, h, esc, x } = Kit; const E = SheetEngine;
const lib = new Kit.Library('sheets');
const gw = $('#gw'), grid = $('#g'), edit = $('#edit'), fx = $('#fx'), nameBox = $('#nameBox'), status = $('#status');
let book = null, docId = null, calc = null, si = 0, rows = 100, cols = 26;
let sel = { c: 0, r: 0, c2: 0, r2: 0 }, editing = null; // editing: { via: 'cell'|'bar', orig }
let undoS = [], redoS = [], saveT = 0, tds = [];
const sh = () => book.sheets[si];
const DEF_W = 96;

// ---------- templates ----------
const T = (name, cells, colW = {}) => ({ name, cells, colW });
const rowsOf = (arr, start = 0) => { const o = {}; arr.forEach((row, r) => row.forEach((v, c) => { if (v !== '' && v != null) o[E.key(c, r + start)] = typeof v === 'object' ? v : { v: String(v) }; })); return o; };
const B = (v, s = {}) => ({ v: String(v), s: { b: true, ...s } });
const TEMPLATES = [
  { name: 'Blank spreadsheet', sheets: [T('Sheet1', {})] },
  { name: 'Monthly budget', sheets: [T('Budget', { ...rowsOf([[B('Monthly budget', { fc: '#1f8a4c' })], [], [B('Income'), B('Planned'), B('Actual'), B('Difference')], ['Salary', { v: '3000', s: { fmt: 'cur' } }, { v: '3000', s: { fmt: 'cur' } }, { v: '=C4-B4', s: { fmt: 'cur' } }], ['Other', { v: '200', s: { fmt: 'cur' } }, { v: '150', s: { fmt: 'cur' } }, { v: '=C5-B5', s: { fmt: 'cur' } }], [], [B('Expenses'), B('Planned'), B('Actual'), B('Difference')], ['Rent', { v: '1200', s: { fmt: 'cur' } }, { v: '1200', s: { fmt: 'cur' } }, { v: '=B8-C8', s: { fmt: 'cur' } }], ['Food', { v: '400', s: { fmt: 'cur' } }, { v: '455', s: { fmt: 'cur' } }, { v: '=B9-C9', s: { fmt: 'cur' } }], ['Transport', { v: '150', s: { fmt: 'cur' } }, { v: '120', s: { fmt: 'cur' } }, { v: '=B10-C10', s: { fmt: 'cur' } }], ['Phone & internet', { v: '80', s: { fmt: 'cur' } }, { v: '80', s: { fmt: 'cur' } }, { v: '=B11-C11', s: { fmt: 'cur' } }], ['Fun', { v: '200', s: { fmt: 'cur' } }, { v: '260', s: { fmt: 'cur' } }, { v: '=B12-C12', s: { fmt: 'cur' } }], [], [B('Total income'), B('=SUM(B4:B5)', { fmt: 'cur' }), B('=SUM(C4:C5)', { fmt: 'cur' })], [B('Total expenses'), B('=SUM(B8:B12)', { fmt: 'cur' }), B('=SUM(C8:C12)', { fmt: 'cur' })], [B('Left over', { fc: '#1f8a4c' }), B('=B14-B15', { fmt: 'cur', fc: '#1f8a4c' }), B('=C14-C15', { fmt: 'cur', fc: '#1f8a4c' })]]) }, { 0: 150, 1: 100, 2: 100, 3: 100 })] },
  { name: 'To-do list', sheets: [T('Tasks', rowsOf([[B('Task'), B('Owner'), B('Due'), B('Done?')], ['Write the plan', 'Me', { v: String(E.toSerial(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate() + 3)), s: { fmt: 'date' } }, 'no'], ['Send invites', '', '', 'no'], ['Book the room', '', '', 'yes'], [], [B('Done'), { v: '=COUNTIF(D2:D4,"yes")&" of "&COUNTA(A2:A4)' }]]), { 0: 220, 1: 110, 2: 110, 3: 80 })] },
  { name: 'Grade book', sheets: [T('Grades', rowsOf([[B('Student'), B('Test 1'), B('Test 2'), B('Test 3'), B('Average'), B('Grade')], ['Asha', 88, 92, 79, '=ROUND(AVERAGE(B2:D2),1)', '=IF(E2>=90,"A",IF(E2>=80,"B",IF(E2>=70,"C","D")))'], ['Ben', 72, 65, 81, '=ROUND(AVERAGE(B3:D3),1)', '=IF(E3>=90,"A",IF(E3>=80,"B",IF(E3>=70,"C","D")))'], ['Chen', 95, 98, 91, '=ROUND(AVERAGE(B4:D4),1)', '=IF(E4>=90,"A",IF(E4>=80,"B",IF(E4>=70,"C","D")))'], ['Dara', 64, 70, 58, '=ROUND(AVERAGE(B5:D5),1)', '=IF(E5>=90,"A",IF(E5>=80,"B",IF(E5>=70,"C","D")))'], [], [B('Class average'), '=AVERAGE(B2:B5)', '=AVERAGE(C2:C5)', '=AVERAGE(D2:D5)', '=ROUND(AVERAGE(E2:E5),1)']]), { 0: 130 })] },
  { name: 'Invoice', sheets: [T('Invoice', { ...rowsOf([[B('INVOICE', { fc: '#1f8a4c' })], ['Invoice #', '0001'], ['Date', { v: String(E.toSerial(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate())), s: { fmt: 'date', al: 'left' } }], ['Bill to', 'Client name'], [], [B('Item'), B('Qty'), B('Price'), B('Total')], ['Design work', 10, { v: '45', s: { fmt: 'cur' } }, { v: '=B7*C7', s: { fmt: 'cur' } }], ['Hosting', 1, { v: '120', s: { fmt: 'cur' } }, { v: '=B8*C8', s: { fmt: 'cur' } }], ['', '', '', { v: '=B9*C9', s: { fmt: 'cur' } }], [], ['', '', B('Subtotal'), B('=SUM(D7:D9)', { fmt: 'cur' })], ['', '', 'Tax rate', { v: '0.08', s: { fmt: 'pct' } }], ['', '', 'Tax', { v: '=D11*D12', s: { fmt: 'cur' } }], ['', '', B('Total due'), B('=D11+D13', { fmt: 'cur', fc: '#1f8a4c' })]]) }, { 0: 180, 2: 110, 3: 110 })] }
];
TEMPLATES.forEach(t => t.preview = `<div class="tpl-grid">${t.name === 'Blank spreadsheet' ? '' : `<b>${esc(t.name)}</b>`}</div>`);

// ---------- home ----------
const showHome = () => { flush(); book = null; $('#ed').classList.remove('on'); $('#home').classList.remove('off'); refreshHome(); document.title = 'Sheets'; };
const refreshHome = Kit.home({ el: $('#home'), title: 'Sheets', accent: '#1f8a4c', lib, templates: TEMPLATES, importLabel: 'Open a file…',
  onNew: t => openBook(K_new(t.name === 'Blank spreadsheet' ? 'Untitled spreadsheet' : t.name, JSON.parse(JSON.stringify(t.sheets))), true),
  onOpen: id => { const d = lib.load(id); if (d) { docId = id; openBook(d); } else Kit.toast('That file is gone'); },
  onImport: () => importFile() });
document.querySelector('#home').style.setProperty('--tp-ar', '1.3');
const K_new = (name, sheets) => { docId = Kit.uid(); return { name, sheets: sheets.map(s => ({ name: s.name, cells: s.cells || {}, colW: s.colW || {} })) }; };
const openBook = (b, isNew) => {
  book = b; book.sheets.forEach(s => { s.cells = s.cells || {}; s.colW = s.colW || {}; });
  calc = new E.Calc(book); si = Math.min(book.active || 0, book.sheets.length - 1); undoS = []; redoS = [];
  $('#title').value = book.name; $('#home').classList.add('off'); $('#ed').classList.add('on'); document.title = book.name + ' — Sheets';
  sel = { c: 0, r: 0, c2: 0, r2: 0 }; build(); renderTabs(); if (isNew) save(); status.textContent = 'Saved'; gw.focus();
};
const save = () => { if (!book) return; book.name = $('#title').value.trim() || 'Untitled spreadsheet'; book.active = si; lib.save(docId, book.name, book); status.textContent = 'Saved'; clearTimeout(saveT); saveT = 0; };
const flush = () => { if (saveT) save(); };
const changed = () => { status.textContent = 'Saving…'; clearTimeout(saveT); saveT = setTimeout(save, 600); };
$('#title').oninput = () => { document.title = $('#title').value + ' — Sheets'; changed(); };
$('#title').onkeydown = e => { if (e.key === 'Enter') gw.focus(); };
addEventListener('pagehide', flush); document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
const snapshot = () => { undoS.push(JSON.stringify({ sheets: book.sheets, si })); if (undoS.length > 100) undoS.shift(); redoS = []; };
const restore = (from, to) => { if (!from.length) return; to.push(JSON.stringify({ sheets: book.sheets, si })); const s = JSON.parse(from.pop()); book.sheets = s.sheets; si = Math.min(s.si, book.sheets.length - 1); calc = new E.Calc(book); build(); renderTabs(); changed(); };

// ---------- grid ----------
const used = s => { let mc = 0, mr = 0; for (const k in s.cells) { const p = E.parseRef(k); if (p) { mc = Math.max(mc, p.c); mr = Math.max(mr, p.r); } } return { mc, mr }; };
const build = () => {
  const u = used(sh()); rows = Math.max(100, u.mr + 30, sel.r2 + 30); cols = Math.max(26, u.mc + 6, sel.c2 + 6);
  let html = '<colgroup><col style="width:46px">'; for (let c = 0; c < cols; c++) html += `<col style="width:${sh().colW[c] || DEF_W}px">`; html += '</colgroup><thead><tr><th class="corner"></th>';
  for (let c = 0; c < cols; c++) html += `<th data-c="${c}">${E.colName(c)}<span class="rz" data-rz="${c}"></span></th>`;
  html += '</tr></thead><tbody>';
  for (let r = 0; r < rows; r++) { html += `<tr><th data-r="${r}">${r + 1}</th>`; for (let c = 0; c < cols; c++) html += '<td></td>'; html += '</tr>'; }
  grid.innerHTML = html + '</tbody>';
  tds = [...grid.tBodies[0].rows].map(tr => [...tr.cells].slice(1));
  grid.style.width = (46 + [...Array(cols).keys()].reduce((a, c) => a + (sh().colW[c] || DEF_W), 0)) + 'px';
  recalc(); paintSel();
};
const recalc = () => {
  calc.reset(); calc.asts.clear && calc.asts.size > 5000 && calc.asts.clear();
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) paintCell(c, r);
  updateSum();
};
const paintCell = (c, r) => {
  const td = tds[r] && tds[r][c]; if (!td) return;
  const cell = sh().cells[E.key(c, r)];
  if (!cell) { if (td.textContent || td.className.replace(/\b(sel|act)\b/g, '').trim() || td.getAttribute('style')) { td.textContent = ''; td.removeAttribute('style'); td.classList.remove('err', 'wrap'); } return; }
  const s = cell.s || {}; const v = s.fmt === 'text' && !String(cell.v).startsWith('=') ? cell.v : calc.value(si, c, r);
  td.textContent = E.format(v, s.fmt, s.dec);
  td.classList.toggle('err', v instanceof E.FErr); td.classList.toggle('wrap', !!s.wrap);
  const st = td.style; st.cssText = '';
  if (s.b) st.fontWeight = '700'; if (s.i) st.fontStyle = 'italic'; if (s.u || s.st) st.textDecoration = (s.u ? 'underline ' : '') + (s.st ? 'line-through' : '');
  if (s.fc) st.color = s.fc; if (s.bg) st.background = s.bg;
  st.textAlign = s.al || (typeof v === 'number' ? 'right' : typeof v === 'boolean' || v instanceof E.FErr ? 'center' : 'left');
};
const norm = () => ({ c1: Math.min(sel.c, sel.c2), r1: Math.min(sel.r, sel.r2), c2: Math.max(sel.c, sel.c2), r2: Math.max(sel.r, sel.r2) });
let painted = [];
const paintSel = () => {
  painted.forEach(td => td.classList.remove('sel', 'act')); painted = [];
  $$('.hs', grid).forEach(t => t.classList.remove('hs'));
  const n = norm();
  for (let r = n.r1; r <= Math.min(n.r2, rows - 1); r++) for (let c = n.c1; c <= Math.min(n.c2, cols - 1); c++) { const td = tds[r][c]; td.classList.add('sel'); painted.push(td); }
  const a = tds[sel.r] && tds[sel.r][sel.c]; if (a) { a.classList.add('act'); painted.push(a); }
  for (let c = n.c1; c <= n.c2 && c < cols; c++) grid.tHead.rows[0].cells[c + 1].classList.add('hs');
  for (let r = n.r1; r <= n.r2 && r < rows; r++) grid.tBodies[0].rows[r].cells[0].classList.add('hs');
  nameBox.value = n.c1 === n.c2 && n.r1 === n.r2 ? E.key(sel.c, sel.r) : E.key(n.c1, n.r1) + ':' + E.key(n.c2, n.r2);
  if (!editing) { const cell = sh().cells[E.key(sel.c, sel.r)]; fx.value = cell ? cell.v : ''; }
  syncTools(); updateSum();
};
const scrollTo = (c, r) => {
  const td = tds[r] && tds[r][c]; if (!td) return;
  const L = td.offsetLeft, T = td.offsetTop, W = td.offsetWidth, H = td.offsetHeight, hw = 46, hh = 25;
  if (L - hw < gw.scrollLeft) gw.scrollLeft = L - hw; else if (L + W > gw.scrollLeft + gw.clientWidth) gw.scrollLeft = L + W - gw.clientWidth;
  if (T - hh < gw.scrollTop) gw.scrollTop = T - hh; else if (T + H > gw.scrollTop + gw.clientHeight) gw.scrollTop = T + H - gw.clientHeight;
};
const select = (c, r, extend) => {
  c = Kit.clamp(c, 0, 16383); r = Kit.clamp(r, 0, 1048575);
  if (c >= cols - 2 || r >= rows - 2) { if (extend) { sel.c2 = c; sel.r2 = r; } else sel = { c, r, c2: c, r2: r }; build(); scrollTo(c, r); return; }
  if (extend) { sel.c2 = c; sel.r2 = r; } else sel = { c, r, c2: c, r2: r };
  paintSel(); scrollTo(extend ? c : sel.c, extend ? r : sel.r);
};
const updateSum = () => {
  if (!book) return; const n = norm(); if (n.c1 === n.c2 && n.r1 === n.r2) { $('.sum') && ($('.sum').textContent = ''); return; }
  let s = 0, cnt = 0, nums = 0;
  for (let r = n.r1; r <= n.r2 && r <= rows; r++) for (let c = n.c1; c <= n.c2 && c <= cols; c++) { const v = calc.value(si, c, r); if (v != null && v !== '') cnt++; if (typeof v === 'number') { s += v; nums++; } }
  const el = $('.sum'); if (el) el.textContent = nums ? `Sum ${E.format(s)} · Average ${E.format(+(s / nums).toPrecision(10))} · Count ${cnt}` : cnt ? `Count ${cnt}` : '';
};

// ---------- mouse ----------
let drag = null;
const cellAt = e => { const td = e.target.closest && e.target.closest('td'); if (!td || !grid.contains(td)) return null; return { c: td.cellIndex - 1, r: td.parentNode.sectionRowIndex }; };
grid.addEventListener('mousedown', e => {
  if (e.target.dataset.rz) return startResize(e, +e.target.dataset.rz);
  const th = e.target.closest('th');
  if (th) { e.preventDefault(); commitIfCell(); if (th.dataset.c) { const c = +th.dataset.c; if (e.shiftKey) { sel.c2 = c; sel.r = 0; sel.r2 = rows - 1; } else sel = { c, r: 0, c2: c, r2: rows - 1 }; drag = { col: true }; } else if (th.dataset.r) { const r = +th.dataset.r; if (e.shiftKey) { sel.r2 = r; sel.c = 0; sel.c2 = cols - 1; } else sel = { c: 0, r, c2: cols - 1, r2: r }; drag = { row: true }; } else { sel = { c: 0, r: 0, c2: cols - 1, r2: rows - 1 }; } paintSel(); gw.focus(); return; }
  const p = cellAt(e); if (!p) return;
  if (editing && isFormulaEditing()) { e.preventDefault(); insertRef(p, e.shiftKey); drag = { ref: true, start: p }; return; }
  e.preventDefault(); commitIfCell();
  select(p.c, p.r, e.shiftKey); drag = { cell: true }; gw.focus({ preventScroll: true });
});
