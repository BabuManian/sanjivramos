<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Present</title>
<script src="../sj-officekit/kit.js"></script>
<style>
:root{--k-acc:#d2552b}
#app{display:flex;flex-direction:column;height:100%}
#home{flex:1;overflow:auto} #home.off{display:none}
#ed{flex:1;display:none;flex-direction:column;min-height:0} #ed.on{display:flex}
.main{flex:1;display:flex;min-height:0}
.thumbs{width:180px;flex:none;overflow-y:auto;background:var(--k-panel);border-right:1px solid var(--k-line);padding:10px 8px 40px}
.th{display:flex;gap:6px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
.th .n{width:16px;font-size:11px;color:var(--k-sub);text-align:right;padding-top:2px}
.th .box{flex:1;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:4px;border:2px solid transparent;box-shadow:0 0 0 1px var(--k-line)}
.th.on .box{border-color:var(--k-acc)}
.th.drop .box{box-shadow:0 -3px 0 var(--k-acc)}
.th .box>.slide{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.addsl{width:100%;margin-top:4px}
.center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--k-bg)}
.stagewrap{flex:1;position:relative;overflow:hidden;min-height:0}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.notes{height:74px;flex:none;border:none;border-top:1px solid var(--k-line);background:var(--k-panel);color:var(--k-text);font:13px/1.4 system-ui;padding:8px 12px;resize:vertical;outline:none}
.slide{width:960px;height:540px;position:relative;overflow:hidden;background:#fff;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#222}
.el{position:absolute;box-sizing:border-box;line-height:1.2;word-wrap:break-word;overflow:visible}
.el .tx{width:100%;height:100%;display:flex;flex-direction:column;outline:none;padding:6px 10px;box-sizing:border-box}
.el .tx>*{margin:0} .el .tx p{margin:0 0 .25em} .el .tx ul,.el .tx ol{margin:0 0 .25em;padding-left:1.2em} .el .tx li{margin:0 0 .3em}
.el.v-m .tx{justify-content:center} .el.v-b .tx{justify-content:flex-end}
.el img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;user-select:none}
.el svg.shp{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ed .el{cursor:move} .ed .el.editing{cursor:text}
.ed .el.empty .tx::before{content:attr(data-ph);color:rgba(127,127,127,.7)}
.ed .el.sel{outline:1.5px solid #3b82f6;outline-offset:1px}
.ed .el.ghost{outline:1px dashed rgba(127,127,127,.5)}
.hd{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid #3b82f6;border-radius:50%;z-index:5;margin:-6px 0 0 -6px}
.hd[data-h=nw],.hd[data-h=se]{cursor:nwse-resize} .hd[data-h=ne],.hd[data-h=sw]{cursor:nesw-resize} .hd[data-h=n],.hd[data-h=s]{cursor:ns-resize} .hd[data-h=e],.hd[data-h=w]{cursor:ew-resize}
.guide{position:absolute;background:#ec4899;z-index:4;pointer-events:none}
#show{position:fixed;inset:0;background:#000;z-index:80;display:none;cursor:none}
#show.on{display:block}
#show .slide{position:absolute;left:0;top:0;transform-origin:0 0}
#show .slide.in-fade{animation:fadein .5s ease}
#show .slide.in-push{animation:pushin .5s ease}
#show .slide.in-zoom{animation:zoomin .45s ease}
@keyframes fadein{from{opacity:0}} @keyframes pushin{from{translate:100% 0}} @keyframes zoomin{from{opacity:0;scale:.85}}
#show .cnt{position:absolute;right:14px;bottom:10px;color:rgba(255,255,255,.5);font:13px system-ui}
#show:hover{cursor:default}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(560px,84vw)}
.theme-grid button{border:2px solid transparent;border-radius:8px;padding:0;cursor:pointer;aspect-ratio:16/9;overflow:hidden;position:relative;background:none}
.theme-grid button.on{border-color:var(--k-acc)}
.theme-grid span{position:absolute;left:8px;bottom:6px;font:600 12px system-ui;background:rgba(0,0,0,.45);color:#fff;padding:2px 6px;border-radius:4px}
.lay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(480px,84vw)}
.lay-grid button{border:1px solid var(--k-line);border-radius:6px;background:var(--k-bg);cursor:pointer;padding:6px;font-size:12px}
@media (max-width:700px){.thumbs{width:96px}.th .n{display:none}.notes{display:none}}
@media print{
  @page{size:13.333in 7.5in;margin:0}
  body{background:#fff} #app{display:none!important}
  #printout{display:block!important} #printout .slide{break-after:page;transform:scale(1.333);transform-origin:0 0;width:960px;height:540px}
  #printout .pg{width:1280px;height:720px;overflow:hidden;break-after:page}
}
#printout{display:none}
</style></head>
<body><div id="app"><div id="home"></div><div id="ed">
  <div class="k-bar">
    <button class="k-mb" data-m="file">File</button><button class="k-mb" data-m="edit">Edit</button><button class="k-mb" data-m="insert">Insert</button><button class="k-mb" data-m="slide">Slide</button><button class="k-mb" data-m="arrange">Arrange</button>
    <input class="k-title" id="title" spellcheck="false"><span class="k-status" id="status"></span>
    <button class="k-btn pri" id="playBtn" title="Present (F5)">▶ Present</button>
  </div>
  <div class="k-tools">
    <button class="k-tb" data-t="undo" title="Undo (Ctrl+Z)">↶</button><button class="k-tb" data-t="redo" title="Redo (Ctrl+Y)">↷</button><span class="k-vs"></span>
    <button class="k-tb" data-t="newslide" title="New slide">＋▭</button><button class="k-tb" data-t="text" title="Text box">T</button><button class="k-tb" data-t="shape" title="Shape">◆</button><button class="k-tb" data-t="image" title="Picture">🖼</button><button class="k-tb" data-t="theme" title="Theme">🎨</button><span class="k-vs"></span>
    <select id="font" title="Font"><option value="">Theme font</option><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Trebuchet MS</option><option>Verdana</option><option>Times New Roman</option><option>Courier New</option><option>Impact</option><option>Comic Sans MS</option></select>
    <select id="fs" title="Font size"><option value="">Size</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option><option>36</option><option>40</option><option>44</option><option>54</option><option>60</option><option>72</option><option>96</option></select>
    <button class="k-tb" data-x="bold" title="Bold"><b>B</b></button><button class="k-tb" data-x="italic" title="Italic"><i>I</i></button><button class="k-tb" data-x="underline" title="Underline"><u>U</u></button>
    <span class="k-col k-tb" title="Text colour"><b>A</b><i id="fcI" style="background:#d2552b"></i><input type="color" id="fc" value="#d2552b"></span>
    <button class="k-tb" data-x="insertUnorderedList" title="Bullets">•≡</button><button class="k-tb" data-x="insertOrderedList" title="Numbering">1≡</button>
    <button class="k-tb" data-al="left" title="Align left">⫷</button><button class="k-tb" data-al="center" title="Centre">≡</button><button class="k-tb" data-al="right" title="Align right">⫸</button>
    <span class="k-vs"></span>
    <span class="k-col k-tb" title="Fill colour"><span>🪣</span><i id="fillI" style="background:#4f7fd9"></i><input type="color" id="fill" value="#4f7fd9"></span>
    <span class="k-col k-tb" title="Outline colour"><span>▢</span><i id="lnI" style="background:#1f2937"></i><input type="color" id="ln" value="#1f2937"></span>
    <button class="k-tb" data-t="front" title="Bring to front">⇡</button><button class="k-tb" data-t="back" title="Send to back">⇣</button><button class="k-tb" data-t="del" title="Delete">🗑</button>
  </div>
  <div class="main"><div class="thumbs" id="thumbs"></div><div class="center"><div class="stagewrap" id="sw"><div class="stage" id="stage"></div></div><textarea class="notes" id="notes" placeholder="Speaker notes — only you see these"></textarea></div></div>
</div></div>
<div id="show"><div class="cnt"></div></div>
<div id="printout"></div>
<script>
'use strict';
const { $, $$, h, esc, x } = Kit;
const lib = new Kit.Library('present');
const W = 960, H = 540;
const stage = $('#stage'), sw = $('#sw'), status = $('#status');
let deck = null, docId = null, cur = 0, selId = null, editingEl = null, undoS = [], redoS = [], saveT = 0, scale = 1, clipEl = null;

// ---------- themes ----------
const THEMES = [
  { id: 'clean', name: 'Clean', bg: '#ffffff', title: '#1f2937', text: '#374151', accent: '#d2552b', font: 'Calibri' },
  { id: 'midnight', name: 'Midnight', bg: '#0f172a', bg2: '#1e293b', title: '#f8fafc', text: '#cbd5e1', accent: '#38bdf8', font: 'Trebuchet MS' },
  { id: 'ocean', name: 'Ocean', bg: '#0e7490', bg2: '#1e3a8a', title: '#ffffff', text: '#e0f2fe', accent: '#fde047', font: 'Verdana' },
  { id: 'sunset', name: 'Sunset', bg: '#f97316', bg2: '#db2777', title: '#ffffff', text: '#fff7ed', accent: '#fef08a', font: 'Trebuchet MS' },
  { id: 'forest', name: 'Forest', bg: '#f0fdf4', title: '#14532d', text: '#166534', accent: '#16a34a', font: 'Georgia' },
  { id: 'paper', name: 'Paper', bg: '#faf7f0', title: '#3f2d20', text: '#5b4636', accent: '#b45309', font: 'Georgia' },
  { id: 'violet', name: 'Violet', bg: '#2e1065', bg2: '#6d28d9', title: '#ffffff', text: '#ede9fe', accent: '#f0abfc', font: 'Calibri' },
  { id: 'bold', name: 'Bold', bg: '#fde047', title: '#111827', text: '#1f2937', accent: '#dc2626', font: 'Impact' },
  { id: 'slate', name: 'Slate', bg: '#e2e8f0', title: '#0f172a', text: '#334155', accent: '#2563eb', font: 'Arial' },
  { id: 'mono', name: 'Mono', bg: '#111111', title: '#ffffff', text: '#d4d4d4', accent: '#ffffff', font: 'Courier New' }
];
const theme = () => THEMES.find(t => t.id === (deck && deck.theme)) || THEMES[0];
const bgCss = (sl, t = theme()) => sl.bg ? sl.bg : t.bg2 ? `linear-gradient(135deg,${t.bg},${t.bg2})` : t.bg;

// ---------- layouts ----------
const uid = Kit.uid;
const TXT = (role, x0, y0, w, h0, html, o = {}) => ({ id: uid(), type: 'text', role, x: x0, y: y0, w, h: h0, html, ...o });
const LAYOUTS = {
  title: { name: 'Title slide', els: () => [TXT('title', 80, 170, 800, 110, '', { fs: 54, bold: true, align: 'center', valign: 'b', ph: 'Click to add title' }), TXT('sub', 80, 290, 800, 70, '', { fs: 26, align: 'center', ph: 'Click to add subtitle' })] },
  content: { name: 'Title and content', els: () => [TXT('title', 50, 28, 860, 80, '', { fs: 40, bold: true, valign: 'm', ph: 'Click to add title' }), TXT('body', 50, 120, 860, 380, '', { fs: 26, ph: 'Click to add text', list: true })] },
  section: { name: 'Section header', els: () => [TXT('title', 80, 200, 800, 100, '', { fs: 48, bold: true, valign: 'b', ph: 'Section title' }), TXT('sub', 80, 310, 800, 60, '', { fs: 24, ph: 'Section description' })] },
  two: { name: 'Two content', els: () => [TXT('title', 50, 28, 860, 80, '', { fs: 40, bold: true, valign: 'm', ph: 'Click to add title' }), TXT('body', 50, 120, 420, 380, '', { fs: 24, ph: 'Click to add text', list: true }), TXT('body', 490, 120, 420, 380, '', { fs: 24, ph: 'Click to add text', list: true })] },
  titleonly: { name: 'Title only', els: () => [TXT('title', 50, 28, 860, 80, '', { fs: 40, bold: true, valign: 'm', ph: 'Click to add title' })] },
  quote: { name: 'Big quote', els: () => [TXT('title', 100, 130, 760, 220, '', { fs: 40, italic: true, align: 'center', valign: 'm', ph: '“Add a memorable quote”' }), TXT('sub', 100, 370, 760, 50, '', { fs: 22, align: 'center', ph: '— Who said it' })] },
  blank: { name: 'Blank', els: () => [] }
};
const newSlide = (layout = 'content') => ({ id: uid(), layout, els: LAYOUTS[layout].els(), notes: '', transition: 'fade' });
const P = s => `<p>${s}</p>`, UL = (...a) => `<ul>${a.map(s => `<li>${s}</li>`).join('')}</ul>`;
const fillSlide = (layout, vals) => { const s = newSlide(layout); s.els.forEach((e, i) => { if (vals[i] != null) e.html = vals[i]; }); return s; };
const TEMPLATES = [
  { name: 'Blank presentation', theme: 'clean', slides: () => [newSlide('title')] },
  { name: 'Pitch deck', theme: 'midnight', slides: () => [fillSlide('title', [P('Your Big Idea'), P('A one-line pitch that explains it')]), fillSlide('content', [P('The problem'), UL('Who has it', 'Why it hurts', 'What they do today')]), fillSlide('content', [P('Our solution'), UL('What it is', 'How it works', 'Why now')]), fillSlide('two', [P('Market'), UL('Who buys', 'How many', 'How much'), UL('Competitors', 'Why we win')]), fillSlide('section', [P('Thank you'), P('you@example.com')])] },
  { name: 'School project', theme: 'forest', slides: () => [fillSlide('title', [P('Project Title'), P('Your Name · Class · Date')]), fillSlide('content', [P('What I studied'), UL('The question', 'Why it matters')]), fillSlide('content', [P('What I found'), UL('Finding one', 'Finding two', 'Finding three')]), fillSlide('quote', [P('“The important thing is not to stop questioning.”'), P('— Albert Einstein')]), fillSlide('content', [P('Conclusion'), UL('What it means', 'What I would do next')])] },
  { name: 'Photo story', theme: 'mono', slides: () => [fillSlide('title', [P('A Story in Pictures'), P('Add your photos with Insert → Picture')]), fillSlide('titleonly', [P('Chapter one')]), fillSlide('section', [P('The end')])] },
  { name: 'Sunset talk', theme: 'sunset', slides: () => [fillSlide('title', [P('Talk Title'), P('Speaker name')]), fillSlide('content', [P('Agenda'), UL('Part one', 'Part two', 'Questions')])] }
];
TEMPLATES.forEach(t => { const th = THEMES.find(x => x.id === t.theme); t.preview = `<div style="position:absolute;inset:0;background:${th.bg2 ? `linear-gradient(135deg,${th.bg},${th.bg2})` : th.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:${th.font};color:${th.title};padding:6px;text-align:center"><b style="font-size:12px">${esc(t.name === 'Blank presentation' ? '' : t.name)}</b><span style="width:40%;height:3px;background:${th.accent};margin-top:5px;border-radius:2px;${t.name === 'Blank presentation' ? 'display:none' : ''}"></span></div>`; });

// ---------- home ----------
const showHome = () => { flush(); deck = null; $('#ed').classList.remove('on'); $('#home').classList.remove('off'); refreshHome(); document.title = 'Present'; };
const refreshHome = Kit.home({ el: $('#home'), title: 'Present', accent: '#d2552b', lib, templates: TEMPLATES, importLabel: 'Open a file…',
  onNew: t => { docId = uid(); openDeck({ name: t.name === 'Blank presentation' ? 'Untitled presentation' : t.name, theme: t.theme, slides: t.slides() }, true); },
  onOpen: id => { const d = lib.load(id); if (d) { docId = id; openDeck(d); } else Kit.toast('That file is gone'); },
  onImport: () => importFile() });
$('#home').style.setProperty('--tp-ar', String(16 / 9));
const openDeck = (d, isNew) => {
  deck = d; if (!deck.slides.length) deck.slides.push(newSlide('title')); cur = 0; selId = null; undoS = []; redoS = [];
  $('#title').value = deck.name; $('#home').classList.add('off'); $('#ed').classList.add('on'); document.title = deck.name + ' — Present';
  renderAll(); if (isNew) save(); status.textContent = 'Saved';
};
const save = () => { if (!deck) return; deck.name = $('#title').value.trim() || 'Untitled presentation'; lib.save(docId, deck.name, deck); status.textContent = 'Saved'; clearTimeout(saveT); saveT = 0; };
const flush = () => { if (editingEl) stopEdit(); if (saveT) save(); };
const changed = () => { status.textContent = 'Saving…'; clearTimeout(saveT); saveT = setTimeout(save, 600); };
$('#title').oninput = () => { document.title = $('#title').value + ' — Present'; changed(); };
addEventListener('pagehide', flush); document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
const snap = () => { undoS.push(JSON.stringify(deck)); if (undoS.length > 80) undoS.shift(); redoS = []; };
const undoRedo = (from, to) => { if (editingEl) stopEdit(); if (!from.length) return; to.push(JSON.stringify(deck)); const d = JSON.parse(from.pop()); deck.slides = d.slides; deck.theme = d.theme; cur = Math.min(cur, deck.slides.length - 1); selId = null; renderAll(); changed(); };
const slide = () => deck.slides[cur];
const elById = id => slide().els.find(e => e.id === id);

// ---------- rendering ----------
const shapeSvg = (e, t) => {
  const f = e.fill || t.accent, l = e.line || 'none', lw = e.line ? (e.lw || 2) : 0, w = e.w, hh = e.h;
  const pathOf = { rect: `<rect x="0" y="0" width="${w}" height="${hh}"/>`, roundRect: `<rect x="0" y="0" width="${w}" height="${hh}" rx="${Math.min(w, hh) * 0.16}"/>`, ellipse: `<ellipse cx="${w / 2}" cy="${hh / 2}" rx="${w / 2}" ry="${hh / 2}"/>`, triangle: `<polygon points="${w / 2},0 ${w},${hh} 0,${hh}"/>`, rightArrow: `<polygon points="0,${hh * .25} ${w * .6},${hh * .25} ${w * .6},0 ${w},${hh / 2} ${w * .6},${hh} ${w * .6},${hh * .75} 0,${hh * .75}"/>`, star5: `<polygon points="${[...Array(10)].map((_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .4 : 1; return `${w / 2 + Math.cos(a) * w / 2 * r},${hh / 2 + Math.sin(a) * hh / 2 * r}`; }).join(' ')}"/>`, line: `<line x1="0" y1="${hh / 2}" x2="${w}" y2="${hh / 2}" stroke-width="${e.lw || 4}" stroke="${e.line || f}"/>`, diamond: `<polygon points="${w / 2},0 ${w},${hh / 2} ${w / 2},${hh} 0,${hh / 2}"/>` };
  return `<svg class="shp" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><g fill="${e.shape === 'line' ? 'none' : f}" stroke="${l}" stroke-width="${lw}" vector-effect="non-scaling-stroke">${pathOf[e.shape] || pathOf.rect}</g></svg>`;
};
const textStyle = (e, t) => `font-size:${e.fs || 24}px;color:${e.color || (e.role === 'title' ? t.title : t.text)};font-family:'${(e.font || t.font).replace(/'/g, '')}',Calibri,Arial,sans-serif;text-align:${e.align || 'left'};${e.bold ? 'font-weight:700;' : ''}${e.italic ? 'font-style:italic;' : ''}${e.underline ? 'text-decoration:underline;' : ''}`;
const elHtml = (e, t, edit) => {
  const cls = `el v-${e.valign || 't'}${edit && e.type === 'text' && !stripHtml(e.html) ? ' empty' : ''}${edit && e.type === 'text' && !e.fill && !e.line ? ' ghost' : ''}`;
  const box = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;${e.rot ? `transform:rotate(${e.rot}deg);` : ''}`;
  if (e.type === 'image') return `<div class="${cls}" data-id="${e.id}" style="${box}"><img src="${e.src}" alt="" draggable="false"></div>`;
  const inner = e.type === 'shape' ? shapeSvg(e, t) : (e.fill || e.line ? `<div style="position:absolute;inset:0;background:${e.fill || 'transparent'};${e.line ? `border:${e.lw || 2}px solid ${e.line};` : ''}"></div>` : '');
  const txt = e.type === 'text' || (e.type === 'shape' && e.html) ? `<div class="tx" data-ph="${esc(e.ph || '')}" style="${textStyle(e, t)};position:relative${e.type === 'shape' ? ';justify-content:center;text-align:' + (e.align || 'center') + ';color:' + (e.color || '#fff') : ''}">${e.html || ''}</div>` : '';
  return `<div class="${cls}" data-id="${e.id}" style="${box}">${inner}${txt}</div>`;
};
const stripHtml = s => String(s || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim();
const slideHtml = (sl, edit) => { const t = theme(); return `<div class="slide" style="background:${bgCss(sl, t)}">${sl.els.map(e => elHtml(e, t, edit)).join('')}</div>`; };
const renderStage = () => {
  stage.innerHTML = slideHtml(slide(), true); stage.firstElementChild.classList.add('ed');
  fit(); drawHandles(); $('#notes').value = slide().notes || '';
};
const fit = () => { const pw = sw.clientWidth - 40, ph = sw.clientHeight - 40; scale = Math.max(0.1, Math.min(pw / W, ph / H)); stage.style.transform = `scale(${scale})`; stage.style.left = (sw.clientWidth - W * scale) / 2 + 'px'; stage.style.top = (sw.clientHeight - H * scale) / 2 + 'px'; };
new ResizeObserver(() => deck && fit()).observe(sw);
const renderThumbs = () => {
  const box = $('#thumbs'); const tw = box.clientWidth - (innerWidth <= 700 ? 16 : 40);
  box.innerHTML = deck.slides.map((s, i) => `<div class="th${i === cur ? ' on' : ''}" data-i="${i}" draggable="true"><span class="n">${i + 1}</span><div class="box">${slideHtml(s, false)}</div></div>`).join('') + '<button class="k-btn addsl" id="addsl">＋ New slide</button>';
  $$('.th .slide', box).forEach(el => el.style.transform = `scale(${(el.parentNode.clientWidth || tw) / W})`);
  $$('.th', box).forEach(t => {
    const i = +t.dataset.i;
    t.onclick = () => { if (editingEl) stopEdit(); cur = i; selId = null; renderStage(); markThumb(); };
    t.oncontextmenu = e => { e.preventDefault(); cur = i; renderStage(); markThumb(); Kit.menu(t, slideMenu()); };
    t.ondragstart = e => { e.dataTransfer.setData('text/x-slide', String(i)); e.dataTransfer.effectAllowed = 'move'; };
    t.ondragover = e => { if ([...e.dataTransfer.types].includes('text/x-slide')) { e.preventDefault(); t.classList.add('drop'); } };
    t.ondragleave = () => t.classList.remove('drop');
    t.ondrop = e => { e.preventDefault(); t.classList.remove('drop'); const from = +e.dataTransfer.getData('text/x-slide'); if (isNaN(from) || from === i) return; snap(); const [s] = deck.slides.splice(from, 1); deck.slides.splice(from < i ? i - 1 : i, 0, s); cur = deck.slides.indexOf(s); renderAll(); changed(); };
  });
  $('#addsl').onclick = e => addSlideMenu(e.currentTarget);
};
