<!doctype html>
<html><head><meta charset="utf-8"><title>SanjivramOS</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#e8ecf4;font:16px system-ui,"DejaVu Sans",sans-serif;cursor:default;user-select:none}
  body{display:grid;place-items:center}
  .box{text-align:center}
  .logo{font-size:44px;font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,#6aa8ff,#b48cff);-webkit-background-clip:text;color:transparent}
  .bar{width:240px;height:4px;margin:26px auto 14px;border-radius:2px;background:#1b1f2b;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#6aa8ff;border-radius:2px;animation:s 1.2s ease-in-out infinite}
  @keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #st{opacity:.75;font-size:14px;min-height:1.2em}
  .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:12px;opacity:.35}
</style></head>
<body><div class="box"><div class="logo">SanjivramOS</div><div class="bar"><i></i></div><div id="st">Starting…</div></div>
<div class="hint">Ctrl+Alt+F2 — text console</div>
<script>window.setStatus = t => { document.getElementById('st').textContent = t; };</script>
</body></html>
