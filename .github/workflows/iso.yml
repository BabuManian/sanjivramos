# Builds the SanjivramOS Linux ISO (Debian trixie + Electron) and publishes it as the "iso-latest" release.
name: Build SanjivramOS ISO
# Old Debian edition: only built by hand now (Actions → Run workflow). The Ubuntu edition is ubuntu-iso.yml.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  iso:
    # Two ISOs: "standard" (AMD/Intel/open NVIDIA drivers) and "nvidia" (NVIDIA's own driver for GeForce/RTX cards).
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, nvidia]
    concurrency:
      group: iso-${{ matrix.variant }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Build ISO (Debian trixie container)
        run: |
          docker run --rm --privileged -v "$PWD:/src" \
            -e SJ_REPO="https://github.com/${{ github.repository }}.git" -e SJ_BRANCH="${{ github.ref_name }}" \
            -e SJ_VARIANT="${{ matrix.variant }}" -e WORK=/src/distro/work \
            debian:trixie bash /src/distro/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view iso-latest >/dev/null 2>&1 || gh release create iso-latest --prerelease --title "SanjivramOS Linux (latest ISO)" \
            --notes "Debian-based SanjivramOS live/installer ISO for 64-bit PCs. Flash it to a USB stick (balenaEtcher, Rufus or dd) and boot. It downloads the newest SanjivramOS from GitHub on every boot."
          gh release upload iso-latest distro/out/*.iso distro/out/*.iso.sha256 --clobber
          gh release edit iso-latest --notes "Built $(date -u +'%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}.

          - **sanjivramos-amd64.iso**: for most PCs (AMD and Intel graphics, older NVIDIA cards with the open nouveau driver).
          - **sanjivramos-amd64-nvidia.iso**: for PCs with a GeForce GTX 900 series / RTX or newer NVIDIA card (NVIDIA's own driver).

          Both include Wi-Fi firmware (Intel, Realtek, Atheros/Qualcomm, MediaTek, Broadcom, Marvell, TI). Flash one to a USB stick (balenaEtcher, Rufus or dd) and boot it. Login/sudo password: sanjivram. It downloads the newest SanjivramOS from GitHub on every boot."
      - name: Build log on failure
        if: failure()
        run: |
          sudo grep -nE '^E: |error|Error|failed' distro/work/build.log | tail -n 60 || true
          sudo tail -n 120 distro/work/build.log 2>/dev/null || true
