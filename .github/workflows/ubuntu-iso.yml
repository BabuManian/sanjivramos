# Builds the SanjivramOS Linux ISO (Ubuntu 26.04 + Electron), tests it, and publishes it as the "ubuntu-latest" release.
# Test: runs the real installer onto a virtual disk, boots the installed system in QEMU (Secure Boot UEFI and old BIOS)
# and checks the lock screen takes the installer's password; also boots the live ISO. Only a passing ISO is published.
name: Build SanjivramOS Linux (Ubuntu)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['distro-ubuntu/**', 'distro/shell/**', '.github/workflows/ubuntu-iso.yml']
permissions:
  contents: write
concurrency:
  group: ubuntu-iso
  cancel-in-progress: true
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af >/dev/null || true
          df -h /
      - name: Build ISO (Ubuntu 26.04 container)
        run: |
          docker run --rm --privileged -v "$PWD:/src" \
            -e SJ_REPO="https://github.com/${{ github.repository }}.git" -e SJ_BRANCH="${{ github.ref_name }}" \
            -e WORK=/src/distro-ubuntu/work -e KEEP_SQUASHFS=1 \
            ubuntu:26.04 bash /src/distro-ubuntu/build.sh
          sudo rm -rf distro-ubuntu/work
          df -h /
      - name: Test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf socat imagemagick gdisk squashfs-tools jq dosfstools parted
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Test — boot the live ISO (Secure Boot)
        run: bash distro-ubuntu/test/vm-check.sh live secureboot distro-ubuntu/out/sanjivramos-amd64.iso
      - name: Test — install to a disk
        run: |
          mkdir -p distro-ubuntu/out/test
          truncate -s 48G distro-ubuntu/out/test/disk.img
          LOOP=$(sudo losetup -fP --show distro-ubuntu/out/test/disk.img)
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          jq -cn --arg d "$LOOP" '{disk:$d, fullname:"Test Person", username:"tester", hostname:"sjtest", password:"Pässw0rd with spaces!", lock:true, timezone:"Asia/Kolkata", xkb_layout:"us", xkb_variant:""}' \
            | sudo SJ_SQUASHFS="$PWD/distro-ubuntu/out/filesystem.squashfs" SJ_NO_NVRAM=1 SJ_TEST_LOOP=1 bash distro-ubuntu/rootfs/usr/lib/sanjivramos/system/sjos-install | tee distro-ubuntu/out/test/install.out
          sudo cp /var/log/sanjivramos-install.log distro-ubuntu/out/test/ 2>/dev/null || true
          grep -q '^PROGRESS 100 ' distro-ubuntu/out/test/install.out
          # Look inside the installed system.
          sudo mkdir -p /mnt/sj && sudo mount "${LOOP}p3" /mnt/sj
          sudo cat /mnt/sj/etc/fstab /mnt/sj/etc/hostname /mnt/sj/etc/timezone
          sudo grep '^tester:' /mnt/sj/etc/passwd
          sudo grep -q '^tester:\$' /mnt/sj/etc/shadow && echo "password hash set"
          sudo cat /mnt/sj/etc/systemd/system/sanjivramos-session.service.d/user.conf
          test ! -e /mnt/sj/etc/sanjivramos/no-lock
          sudo ls /mnt/sj/boot /mnt/sj/boot/grub | head -40
          sudo mount "${LOOP}p2" /mnt/sj/boot/efi && sudo find /mnt/sj/boot/efi -type f && sudo umount /mnt/sj/boot/efi
          sudo umount /mnt/sj
          sudo losetup -d "$LOOP"
          sudo chown "$USER" distro-ubuntu/out/test/*
      - name: Test — boot the installed system (Secure Boot UEFI)
        run: bash distro-ubuntu/test/vm-check.sh installed-uefi secureboot distro-ubuntu/out/test/disk.img 'Pässw0rd with spaces!'
      - name: Test — boot the installed system (BIOS)
        run: bash distro-ubuntu/test/vm-check.sh installed-bios bios distro-ubuntu/out/test/disk.img 'Pässw0rd with spaces!'
      - name: Test results (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            distro-ubuntu/out/test/*.png
            distro-ubuntu/out/test/*.log
            distro-ubuntu/out/test/*.out
          if-no-files-found: ignore
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f distro-ubuntu/out/filesystem.squashfs
          NOTES="$(cat distro-ubuntu/RELEASE.md)

          Built $(date -u +'%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}. Tested in a virtual machine: live USB (Secure Boot), full install, and the installed system on UEFI with Secure Boot and on BIOS."
          gh release view ubuntu-latest >/dev/null 2>&1 || gh release create ubuntu-latest --prerelease --title "SanjivramOS Linux" --notes "$NOTES"
          gh release upload ubuntu-latest distro-ubuntu/out/sanjivramos-amd64.iso distro-ubuntu/out/sanjivramos-amd64.iso.sha256 --clobber
          gh release edit ubuntu-latest --title "SanjivramOS Linux" --notes "$NOTES"
